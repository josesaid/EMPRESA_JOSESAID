# Microservicio compras-proveedores-ms (puerto 8106 en tu Mac).
# Requiere antes: postgres y kafka de la raíz (docker compose up -d desde la raíz).
# Variables que se leen del .env de esta carpeta o del .env de la raíz:
#   COMPRAS_DB_PASSWORD  contraseña del usuario compras
#   USUARIOS_JWT_SECRET      mismo secreto que usuarios-accesos-ms, para validar sus tokens

services:
  compras-proveedores-ms:
    build: .
    image: compras-proveedores-ms:0.1.0
    environment:
      # Base de datos propia creada por infra/postgres/init-databases.sh
      DB_URL: jdbc:postgresql://postgres:5432/compras
      DB_USER: compras
      DB_PASSWORD: ${COMPRAS_DB_PASSWORD:?Defina COMPRAS_DB_PASSWORD en .env}
      # Broker interno de Kafka (listener INTERNAL definido en la raíz)
      KAFKA_BOOTSTRAP: kafka:29092
      # Secreto compartido con usuarios-accesos-ms: sin él no se validan los tokens
      JWT_SECRET: ${USUARIOS_JWT_SECRET:?Defina USUARIOS_JWT_SECRET en .env}
      # Claves de cifrado de datos fiscales (AES-256-GCM e índice HMAC). Generar con openssl rand -base64 32
      COMPRAS_CIFRADO_CLAVE: ${COMPRAS_CIFRADO_CLAVE:?Defina COMPRAS_CIFRADO_CLAVE en .env}
      COMPRAS_INDICE_CLAVE: ${COMPRAS_INDICE_CLAVE:?Defina COMPRAS_INDICE_CLAVE en .env}
    ports:
      # Puerto de tu Mac 8106 -> puerto 8081 dentro del contenedor
      - "8106:8081"
    # No hay depends_on: Compose rechaza depender de servicios de otro archivo.
    # El orden de arranque está documentado en el README de la raíz y en el de este servicio.
    networks:
      - empresa-net
    restart: unless-stopped

networks:
  empresa-net:
    external: true
    name: empresa-net
