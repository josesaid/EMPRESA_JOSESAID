# Configuración de compras-proveedores-ms.
# Todas las credenciales se leen de variables de entorno; nunca se escriben valores reales aquí.
spring:
  application:
    name: compras-proveedores-ms
  datasource:
    # Base de datos y usuario propios del servicio, creados por infra/postgres/init-databases.sh
    url: ${DB_URL:jdbc:postgresql://localhost:5432/compras}
    username: ${DB_USER:compras}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo controla Flyway; Hibernate solo valida que coincida
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

server:
  port: ${SERVER_PORT:8081}

management:
  tracing:
    sampling:
      # 100% de las solicitudes para ver todo en la práctica; bajar en producción
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          # Jaeger recibe OTLP en la red empresa-net
          endpoint: ${TRAZAS_OTLP_ENDPOINT:http://jaeger:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  structured:
    format:
      # Logs JSON en formato ECS, requerido por el anexo de la empresa
      file: ecs

compras:
  jwt:
    # Clave pública para validar tokens (JWKS de usuarios-accesos-ms)
    jwks-uri: ${JWT_JWKS_URI:http://usuarios-accesos-ms:8081/.well-known/jwks.json}
    # Vida del token de acceso (ISO-8601)
    duracion: ${JWT_DURACION:PT15M}
    emisor: ${JWT_EMISOR:compras-proveedores-ms}
  outbox:
    # Cada cuántos milisegundos el retransmisor envía eventos pendientes a Kafka
    intervalo-ms: ${OUTBOX_INTERVALO_MS:5000}
  cifrado:
    # Clave AES-256 en base64 (32 bytes). Generar con: openssl rand -base64 32
    clave: ${COMPRAS_CIFRADO_CLAVE:}
    # Clave HMAC en base64 (mínimo 32 bytes) para el índice de búsqueda del RFC
    indice-clave: ${COMPRAS_INDICE_CLAVE:}

# Descubrimiento de servicios: se registra al arrancar en discovery-ms.
# Si discovery-ms no responde, el servicio arranca igual y se registra cuando el registro esté arriba.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-ms:8761/eureka/}
  instance:
    hostname: ${EUREKA_INSTANCIA_HOST:${spring.application.name}}
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: ${EUREKA_RENOVACION_SEG:5}
    lease-expiration-duration-in-seconds: ${EUREKA_EXPIRACION_SEG:15}

compras:
  # Tipo de cambio para comparar órdenes en MXN contra el límite de aprobación en USD.
  tipo-cambio-mxn-por-usd: ${COMPRAS_TIPO_CAMBIO_MXN_USD:18}
