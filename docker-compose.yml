# Infraestructura compartida de EMPRESA_JOSESAID y microservicios incluidos.
# Antes del primer "up": docker network create empresa-net
name: empresa

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      CLIENTES_DB_PASSWORD: ${CLIENTES_DB_PASSWORD:?Defina CLIENTES_DB_PASSWORD en .env}
      # Contraseña del usuario usuarios_accesos (usada por init-databases.sh)
      USUARIOS_ACCESOS_DB_PASSWORD: ${USUARIOS_ACCESOS_DB_PASSWORD:?Defina USUARIOS_ACCESOS_DB_PASSWORD en .env}
      # Contraseña del usuario facturacion_pagos
      FACTURACION_DB_PASSWORD: ${FACTURACION_DB_PASSWORD:?Defina FACTURACION_DB_PASSWORD en .env}
      # Contraseña del usuario contabilidad
      CONTABILIDAD_DB_PASSWORD: ${CONTABILIDAD_DB_PASSWORD:?Defina CONTABILIDAD_DB_PASSWORD en .env}
      # Contraseña del usuario inventario
      INVENTARIO_DB_PASSWORD: ${INVENTARIO_DB_PASSWORD:?Defina INVENTARIO_DB_PASSWORD en .env}
      # Contraseña del usuario compras
      COMPRAS_DB_PASSWORD: ${COMPRAS_DB_PASSWORD:?Defina COMPRAS_DB_PASSWORD en .env}
      # Contraseña del usuario pedidos
      PEDIDOS_DB_PASSWORD: ${PEDIDOS_DB_PASSWORD:?Defina PEDIDOS_DB_PASSWORD en .env}
      # Contraseña del usuario documentos
      DOCUMENTOS_DB_PASSWORD: ${DOCUMENTOS_DB_PASSWORD:?Defina DOCUMENTOS_DB_PASSWORD en .env}
      # Clave AES-256 en base64 para cifrar los archivos legales
      DOCUMENTOS_CIFRADO_CLAVE: ${DOCUMENTOS_CIFRADO_CLAVE:?Defina DOCUMENTOS_CIFRADO_CLAVE en .env}
      # Contraseña del usuario reportes
      REPORTES_DB_PASSWORD: ${REPORTES_DB_PASSWORD:?Defina REPORTES_DB_PASSWORD en .env}
      # Contraseña del usuario nexus
      NEXUS_DB_PASSWORD: ${NEXUS_DB_PASSWORD:?Defina NEXUS_DB_PASSWORD en .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - empresa-net
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.0.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    networks:
      - empresa-net
    restart: unless-stopped

include:
  # Descubrimiento primero: los demás se registran aquí al arrancar
  - discovery-ms/docker-compose.yml
  - gateway-ms/docker-compose.yml
  - clientes-ms/docker-compose.yml
  - usuarios-accesos-ms/docker-compose.yml
  - facturacion-pagos-ms/docker-compose.yml
  - contabilidad-ms/docker-compose.yml
  - inventario-operaciones-ms/docker-compose.yml
  - compras-proveedores-ms/docker-compose.yml
  - pedidos-ventas-ms/docker-compose.yml
  - documentos-cumplimiento-ms/docker-compose.yml
  - reportes-ejecutivos-ms/docker-compose.yml
  - nexus-ms/docker-compose.yml
  # Monitoreo: Prometheus y Grafana
  - infra/monitoring/docker-compose.yml
  # Trazabilidad: Jaeger
  - infra/trazabilidad/docker-compose.yml
  # Mensajería: Kafka UI para ver topics y mensajes
  - infra/mensajeria/docker-compose.yml

volumes:
  postgres-data:

networks:
  empresa-net:
    external: true
    name: empresa-net
