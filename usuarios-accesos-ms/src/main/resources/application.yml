# Configuración de usuarios-accesos-ms.
# Todas las credenciales se leen de variables de entorno; nunca se escriben valores reales aquí.
spring:
  application:
    name: usuarios-accesos-ms
  datasource:
    # Base de datos y usuario propios del servicio, creados por infra/postgres/init-databases.sh
    url: ${DB_URL:jdbc:postgresql://localhost:5432/usuarios_accesos}
    username: ${DB_USER:usuarios_accesos}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo controla Flyway; Hibernate solo valida que coincida
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

server:
  port: ${SERVER_PORT:8081}

management:
  tracing:
    sampling:
      # 100% de las solicitudes para ver todo en la práctica; bajar en producción
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          # Jaeger recibe OTLP en la red empresa-net
          endpoint: ${TRAZAS_OTLP_ENDPOINT:http://jaeger:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  structured:
    format:
      # Logs JSON en formato ECS, requerido por el anexo de la empresa
      file: ecs

usuarios:
  jwt:
    # Clave RSA privada (PKCS#8 DER en Base64). Solo este servicio la tiene; los demás validan con /.well-known/jwks.json
    clave-privada: ${JWT_CLAVE_PRIVADA:}
    # Vida del token de acceso (ISO-8601)
    duracion: ${JWT_DURACION:PT15M}
    emisor: ${JWT_EMISOR:usuarios-accesos-ms}
  outbox:
    # Cada cuántos milisegundos el retransmisor envía eventos pendientes a Kafka
    intervalo-ms: ${OUTBOX_INTERVALO_MS:5000}
  admin-inicial:
    # Opcional. Si se define, se crea un ADMIN al arrancar cuando el correo no existe.
    correo: ${ADMIN_INICIAL_CORREO:}
    password: ${ADMIN_INICIAL_PASSWORD:}

# Descubrimiento de servicios: se registra al arrancar en discovery-ms.
# Si discovery-ms no responde, el servicio arranca igual y se registra cuando el registro esté arriba.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-ms:8761/eureka/}
  instance:
    hostname: ${EUREKA_INSTANCIA_HOST:${spring.application.name}}
    prefer-ip-address: false
