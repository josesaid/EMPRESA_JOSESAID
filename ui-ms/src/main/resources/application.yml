spring:
  application:
    name: ui-ms
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  session:
    store-type: redis

server:
  port: ${SERVER_PORT:8080}

ui:
  gateway-url: ${GATEWAY_URL:http://localhost:8080}
  # Bundle SSL (spring.ssl.bundles) con la CA interna para llamar al gateway por HTTPS. Vacío = HTTP normal.
  gateway-tls-bundle: ${GATEWAY_TLS_BUNDLE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
