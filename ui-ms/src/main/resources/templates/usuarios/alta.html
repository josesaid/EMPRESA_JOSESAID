<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: pagina('Alta de usuario', ~{::main})}">
<body>
<main class="p-3 p-md-4">
    <h1 class="h3 mb-3">Alta de usuario</h1>

    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}">Mensaje</div>
    <div class="alert alert-warning" th:if="${error}" th:text="${error}">Error</div>

    <section class="bg-white rounded shadow-sm p-3" th:if="${datos != null and mensaje == null}">
        <p class="mb-1">Correo: <strong th:text="${datos.correo}">correo</strong></p>
        <p class="mb-1">Nombre: <span th:text="${datos.nombreCompleto}">nombre</span></p>
        <p>Roles: <span th:text="${#strings.listJoin(datos.roles, ', ')}">roles</span></p>

        <form th:action="@{/usuarios/altas/{id}(id=${id})}" method="post">
            <div class="mb-3">
                <label class="form-label" for="password">Contraseña temporal</label>
                <input class="form-control" id="password" type="password" name="password" autocomplete="new-password" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="codigo">Código de confirmación de 8 dígitos</label>
                <input class="form-control" id="codigo" type="text" name="codigo" pattern="\d{8}" maxlength="8" inputmode="numeric" autocomplete="off" required>
            </div>
            <button type="submit" class="btn btn-primary">Crear usuario</button>
        </form>
        <p class="small text-secondary mt-3 mb-0">La contraseña se envía directo a usuarios; el asistente no la recibe.</p>
    </section>
</main>
</body>
</html>
