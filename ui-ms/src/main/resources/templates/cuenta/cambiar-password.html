<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EMPRESA_JOSESAID · Cambiar contraseña</title>
</head>
<body>
    <h1>Cambiar contraseña temporal</h1>
    <p th:if="${error}" th:text="${error}">Error</p>
    <form th:action="@{/cuenta/cambiar-password}" method="post">
        <label>Correo <input type="email" name="correo" th:value="${correo}" required></label><br>
        <label>Contraseña temporal <input type="password" name="passwordActual" required></label><br>
        <label>Contraseña nueva (mínimo 12 caracteres) <input type="password" name="passwordNueva" minlength="12" required></label><br>
        <label>Confirma la contraseña nueva <input type="password" name="confirmacion" minlength="12" required></label><br>
        <button type="submit">Cambiar contraseña</button>
    </form>
    <p><a th:href="@{/login}">Volver al acceso</a></p>
</body>
</html>
