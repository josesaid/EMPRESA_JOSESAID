<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EMPRESA_JOSESAID · Acceso</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 60%, #7e22ce 120%);
        }
        .tarjeta-acceso { max-width: 420px; border: 0; border-radius: 1rem; }
        .marca-etiqueta { letter-spacing: .12em; }
        .boton-entrar { padding: .75rem; font-weight: 600; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
<main class="card tarjeta-acceso shadow-lg w-100">
    <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
            <p class="text-uppercase small fw-semibold text-secondary mb-1 marca-etiqueta">Bienvenido</p>
            <h1 class="h3 fw-bold mb-1">EMPRESA_JOSESAID</h1>
            <p class="text-secondary mb-0">Inicia sesión para continuar</p>
        </div>

        <div class="alert alert-danger py-2 small" role="alert" th:if="${param.error}">Correo o contraseña incorrectos.</div>
        <div class="alert alert-warning py-2 small" role="alert" th:if="${param.bloqueado}">Demasiados intentos fallidos. Espera 5 minutos e intenta de nuevo.</div>
        <div class="alert alert-warning py-2 small" role="alert" th:if="${param.cambio}">Tu contraseña es temporal. <a class="alert-link" th:href="@{/cuenta/cambiar-password}">Cámbiala aquí</a>.</div>
        <div class="alert alert-success py-2 small" role="status" th:if="${param.cambiada}">Contraseña actualizada. Ya puedes entrar.</div>
        <div class="alert alert-info py-2 small" role="status" th:if="${param.salir}">Sesión cerrada.</div>
        <div class="alert alert-warning py-2 small" role="alert" th:if="${param.expirada}">Tu sesión venció. Vuelve a entrar.</div>

        <form th:action="@{/login}" method="post">
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="correo" name="correo" placeholder="correo@empresa.mx"
                       required autofocus autocomplete="username">
                <label for="correo">Correo</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña"
                       required autocomplete="current-password">
                <label for="password">Contraseña</label>
            </div>
            <button type="submit" class="btn btn-primary w-100 boton-entrar">Entrar</button>
        </form>
    </div>
</main>
</body>
</html>
