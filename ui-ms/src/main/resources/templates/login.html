<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EMPRESA_JOSESAID · Acceso</title>
</head>
<body>
    <h1>Acceso a EMPRESA_JOSESAID</h1>
    <p th:if="${param.error}">Correo o contraseña incorrectos.</p>
    <p th:if="${param.salir}">Sesión cerrada.</p>
    <form th:action="@{/login}" method="post">
        <label>Correo <input type="email" name="correo" required autofocus></label>
        <label>Contraseña <input type="password" name="password" required></label>
        <button type="submit">Entrar</button>
    </form>
</body>
</html>
