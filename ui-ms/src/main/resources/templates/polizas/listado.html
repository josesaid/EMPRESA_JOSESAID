<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: pagina(${titulo}, ~{::main})}">
<body>
<main class="p-3 p-md-4">
    <h1 class="h3 mb-3" th:text="${titulo}">Pólizas</h1>
    <form th:action="@{/polizas}" method="get" class="row g-2 align-items-end mb-3">
        <div class="col-12 col-md-auto">
            <label class="form-label small mb-1" for="periodo">Periodo (AAAA-MM)</label>
            <input class="form-control form-control-sm" id="periodo" type="text" name="periodo" th:value="${periodo}" pattern="\d{4}-\d{2}" required>
        </div>
        <div class="col-12 col-md-auto"><button type="submit" class="btn btn-primary btn-sm">Consultar</button></div>
    </form>
    <div class="alert alert-warning" th:if="${error}" th:text="${error}">Error</div>
    <div class="table-responsive bg-white rounded shadow-sm" th:unless="${error}">
        <table class="table table-hover table-sm align-middle mb-0">
            <thead class="table-light">
                <tr><th>Fecha</th><th>Tipo</th><th>Estatus</th><th>Total</th><th></th></tr>
            </thead>
            <tbody>
                <tr th:each="p : ${polizas}">
                    <td th:text="${p.fecha}">2026-11-02</td>
                    <td th:text="${p.tipo}">INGRESO</td>
                    <td th:text="${p.estatus}">APLICADA</td>
                    <td th:text="${p.total}">1000.00</td>
                    <td class="text-end"><a th:href="@{/polizas/{id}(id=${p.id})}">Ver</a></td>
                </tr>
                <tr th:if="${polizas.isEmpty()}"><td colspan="5">Sin pólizas en este periodo.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
