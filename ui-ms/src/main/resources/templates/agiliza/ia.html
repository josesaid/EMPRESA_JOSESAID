<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: pagina('Agiliza con IA', ~{::main})}">
<body>
<main class="p-3 p-md-4">
    <div class="mx-auto" style="max-width: 720px;">
        <h1 class="h3 mb-2">Agiliza con IA</h1>
        <p class="text-secondary mb-4">Elige una opción abajo. Solo te pediremos el dato que falta.</p>

        <section class="bg-white rounded shadow-sm p-3 mb-3">
            <p class="small mb-2" th:if="${#lists.isEmpty(opciones)}">Tu rol no tiene opciones por ahora.</p>
            <form th:unless="${#lists.isEmpty(opciones)}" method="get" th:action="@{/agiliza-ia}">
                <fieldset>
                    <legend class="h5">¿Qué quieres hacer con IA?</legend>
                    <p class="small text-secondary">Marca una opción y presiona Continuar.</p>
                    <div class="form-check py-2 border-top" th:each="o : ${opciones}">
                        <input class="form-check-input" type="radio" name="opcion"
                               th:id="'opcion-' + ${o.id}" th:value="${o.id}"
                               th:checked="${elegida != null and elegida.id == o.id}">
                        <label class="form-check-label" th:for="'opcion-' + ${o.id}">
                            <span class="small text-uppercase fw-semibold d-block" th:text="${o.rol}">ROL</span>
                            <span th:text="${o.texto}">Opción</span>
                        </label>
                    </div>
                </fieldset>
                <button type="submit" class="btn btn-primary btn-sm mt-2">Continuar</button>
            </form>
        </section>

        <section class="bg-white rounded shadow-sm p-3" th:if="${elegida != null}">
            <h2 class="h5 mb-3" th:text="${elegida.texto}">Opción elegida</h2>

            <form th:if="${elegida.tarea.campo != null and elegida.tarea.valorFijo == null}"
                  method="get" th:action="@{${elegida.tarea.ruta}}" class="mb-0">
                <label class="form-label" th:for="${elegida.tarea.campo}" th:text="${elegida.tarea.etiqueta}">Dato</label>
                <input class="form-control mb-2" type="text" required autocomplete="off"
                       th:id="${elegida.tarea.campo}" th:name="${elegida.tarea.campo}"
                       th:placeholder="${elegida.tarea.ejemplo}">
                <button type="submit" class="btn btn-primary btn-sm">Consultar</button>
            </form>

            <form th:if="${elegida.tarea.valorFijo != null}" method="get" th:action="@{${elegida.tarea.ruta}}" class="mb-0">
                <input type="hidden" th:name="${elegida.tarea.campo}" th:value="${elegida.tarea.valorFijo}">
                <button type="submit" class="btn btn-primary btn-sm">Consultar</button>
            </form>

            <a th:if="${elegida.tarea.campo == null}" class="btn btn-primary btn-sm"
               th:href="@{${elegida.tarea.ruta}}">Ir a la pantalla</a>
        </section>
    </div>
</main>
</body>
</html>
