<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: pagina(${titulo}, ~{::main})}">
<body>
<main class="p-3 p-md-4">
    <h1 class="h3 mb-3" th:text="${titulo}">Cuentas contables</h1>
    <div class="alert alert-warning" th:if="${error}" th:text="${error}">Error</div>
    <div class="table-responsive bg-white rounded shadow-sm" th:unless="${error}">
        <table class="table table-hover table-sm align-middle mb-0">
            <thead class="table-light">
                <tr><th>Código</th><th>Nombre</th><th>Naturaleza</th><th>Activa</th></tr>
            </thead>
            <tbody>
                <tr th:each="cuenta : ${cuentas}">
                    <td th:text="${cuenta.codigo}">1102</td>
                    <td th:text="${cuenta.nombre}">Bancos</td>
                    <td th:text="${cuenta.naturaleza}">DEUDORA</td>
                    <td th:text="${cuenta.activa} ? 'Sí' : 'No'">Sí</td>
                </tr>
                <tr th:if="${cuentas.isEmpty()}"><td colspan="4">Sin cuentas registradas.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
