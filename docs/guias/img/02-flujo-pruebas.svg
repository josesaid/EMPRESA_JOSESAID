</style>
<defs><marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#3b5bdb"/></marker></defs>
<text x="340" y="28" text-anchor="middle" class="h">Flujo del script de pruebas</text>
