<script type="application/json" id="datos">{"svc": "compras-proveedores-ms", "info": {"nombre": "compras-proveedores-ms", "descripcion": "Proveedores con datos fiscales cifrados, órdenes de compra, aprobación y recepción de insumos.", "puerto": "8081", "java": "21", "spring_boot": "4.1.2", "endpoints": 9, "roles": ["ALMACEN", "COMPRAS", "DIRECCION", "FINANZAS"]}, "readme": "# compras-proveedores-ms\n\nMicroservicio del área **Compras y proveedores**. Administra proveedores con datos fiscales cifrados, órdenes de compra, su aprobación, la recepción de insumos y su cancelación.\n\n## 1. Identidad\n\n- **Servicio:** compras-proveedores-ms · **Versión:** 0.1.0 · **Lenguaje:** Java 21 · **Framework:** Spring Boot 4.1.2\n- **Acceso:** vía gateway, sin puerto publicado (contenedor: contenedor: 8081) · **Base de datos:** `compras`\n- **Responsable:** pendiente de asignar · **Estado:** funcional; monto límite de aprobación definido y configurable (sección 10)\n\n## 2. Propósito y alcance\n\nDa de alta proveedores validando su RFC, emite órdenes de compra que DIRECCION aprueba, registra recepciones parciales o totales y cancela órdenes con motivo.\n\n**Dentro del alcance:** proveedores, órdenes de compra, aprobación, recepciones, cancelaciones y eventos de recepción.\n\n**Fuera del alcance:** existencias (inventario-operaciones-ms), pagos a proveedores (facturacion-pagos-ms, pendiente) y asientos contables (contabilidad-ms).\n\n## 3. Estructura del repositorio\n\n```\ncompras-proveedores-ms/\n├── pom.xml\n├── Dockerfile\n├── docker-compose.yml          Servicio, con comentarios\n├── .env.example                Variables requeridas (sin valores reales)\n├── docs/diseno.md              Diseño técnico\n├── src/main/java/.../compras/\n│   ├── domain/                 Proveedor, OrdenCompra, LineaOrden, Recepcion y puertos\n│   ├── application/            ComprasService y publicador de eventos\n│   ├── infrastructure/\n│   │   ├── persistence/        Entidades JPA con datos cifrados\n│   │   ├── seguridad/          ProtectorDatos: AES-256-GCM e índice HMAC\n│   │   └── outbox/             Outbox y retransmisor a Kafka\n│   ├── api/                    Controlador REST, enmascarado y errores\n│   └── config/                 Seguridad JWT, reloj y propiedades\n└── src/test/java/...           Pruebas unitarias e integración\n```\n\n## 4. Requisitos\n\n- JDK 21 y Maven 3.9 (solo para compilar fuera de Docker)\n- Docker Desktop con Compose v2\n- Red `empresa-net`: `docker network create empresa-net` (una sola vez)\n\n## 5. Configuración\n\n| Variable | Obligatoria | Descripción |\n|---|---|---|\n| `COMPRAS_DB_PASSWORD` | Sí (Compose) | Contraseña del usuario `compras` |\n| `JWT_JWKS_URI` | No | URL del JWKS de usuarios-accesos-ms (clave pública). Ya viene configurada en el Compose |\n| `COMPRAS_CIFRADO_CLAVE` | Sí (Compose) | Clave AES-256 en base64 (32 bytes). Si se pierde, los RFC cifrados no se recuperan. |\n| `COMPRAS_CIFRADO_CLAVES` | No | (vacío) | Varias versiones de la clave AES: `N:base64,N:base64`. Si se define, sustituye a `COMPRAS_CIFRADO_CLAVE` |\n| `COMPRAS_CIFRADO_VERSION_ACTIVA` | No | `1` | Versión con la que se cifra lo nuevo. Los valores antiguos se leen con su versión (`v<N>:`; sin prefijo = versión 1) |\n| `COMPRAS_INDICE_CLAVE` | Sí (Compose) | Clave HMAC en base64 para buscar RFC. Si cambia, la búsqueda por RFC deja de encontrar proveedores existentes. |\n| `COMPRAS_LIMITE_APROBACION_USD` | No | Monto en USD (entero mayor a cero) desde el que solo DIRECCION aprueba una orden. Por defecto 1000000. |\n| `COMPRAS_TIPO_CAMBIO_MXN_USD` | No | Tipo de cambio para convertir órdenes en MXN a USD antes de compararlas con el límite. Por defecto 18. |\n\nLas claves de cifrado nunca se escriben en el código ni en el repositorio. Guárdalas en `.env` y respáldalas fuera de la máquina.\n\n## 6. Ejecución\n\n**Orden de arranque (obligatorio):**\n\n1. Red: `docker network create empresa-net` (una sola vez)\n2. Raíz: `docker compose up -d postgres kafka`\n3. **usuarios-accesos-ms** primero, porque emite los tokens que este servicio valida\n4. **compras-proveedores-ms** (este servicio). Puede arrancar en cualquier orden respecto de los demás servicios de negocio.\n\n```bash\ncd compras-proveedores-ms\ndocker compose up -d --build\ncurl -s http://localhost:8080/compras-proveedores-ms/actuator/health\n```\n\n## 7. Modelo de datos\n\n- **proveedores:** id, razon_social, rfc_cifrado, rfc_indice (único), correo_cifrado, estatus, version.\n- **ordenes_compra:** id, proveedor_id, moneda, estatus, motivo_cancelacion, version.\n- **lineas_orden:** id, orden_id, articulo_sku, cantidad_ordenada, cantidad_recibida, precio_unitario. Única por orden y SKU.\n- **recepciones:** id, orden_id, articulo_sku, cantidad, fecha. Historial inmutable.\n- **outbox_eventos:** id, tipo, agregado_id, payload, creado_utc, publicado_utc, intentos.\n\nEl total de una orden se calcula desde sus líneas; no se almacena.\n\n## 8. Migraciones\n\nFlyway ejecuta `V1__esquema_inicial.sql`. Hibernate solo valida. Los cambios van en `V2`, `V3`…\n\n## 9. Máquinas de estado\n\n**Orden de compra:**\n- `BORRADOR → APROBADA` (solo DIRECCION).\n- `APROBADA → RECIBIDA_PARCIAL → RECIBIDA` según las recepciones.\n- `BORRADOR` o `APROBADA → CANCELADA` con motivo.\n\nUna orden aprobada no se modifica. Una orden recibida o cancelada no admite más cambios.\n\n**Proveedor:** `ACTIVO`, `INACTIVO` o `BLOQUEADO`. Solo un proveedor activo recibe órdenes nuevas.\n\n## 10. Seguridad\n\n- JWT RS256 emitido por usuarios-accesos-ms. Solo `/actuator/health` es público.\n- **COMPRAS:** alta de proveedores, órdenes y cancelaciones. Consulta órdenes.\n- **DIRECCION:** aprueba órdenes. Consulta órdenes.\n- **ALMACEN:** registra recepciones. Consulta órdenes.\n- **FINANZAS:** consulta proveedores.\n- **Datos sensibles:** RFC y correo se cifran con AES-256-GCM. En las respuestas el RFC se enmascara (`AAN*******B3`) y el correo muestra solo la primera letra y el dominio.\n\n### Reglas de aprobación\n\n- Nadie aprueba una orden que creó (403).\n- Una orden creada antes de registrar su creador solo la aprueba DIRECCION (403 para cualquier otro rol).\n- Por debajo del límite, COMPRAS aprueba. Desde el límite en adelante solo aprueba DIRECCION; COMPRAS recibe 403.\n- El límite por defecto es 1,000,000 USD. Las órdenes en MXN se convierten con `COMPRAS_TIPO_CAMBIO_MXN_USD` antes de compararse. `COMPRAS_LIMITE_APROBACION_USD` debe ser un entero mayor a cero; si no lo es, el servicio no arranca.\n\n## 11. API\n\nBase: `/v1`\n\n| Método | Ruta | Rol | Éxito | Errores |\n|---|---|---|---|---|\n| POST | `/proveedores` | COMPRAS | 201 | 400, 409 (RFC duplicado) |\n| GET | `/proveedores/{id}` | COMPRAS, FINANZAS | 200 | 404 |\n| POST | `/ordenes-compra` | COMPRAS | 201 | 400, 404, 422 (proveedor inactivo) |\n| GET | `/ordenes-compra/{id}` (añadido) | COMPRAS, ALMACEN, DIRECCION | 200 | 404 |\n| POST | `/ordenes-compra/{id}/aprobacion` | COMPRAS, DIRECCION (reglas en sección 10) | 200 | 403, 404, 409 |\n| POST | `/ordenes-compra/{id}/recepciones` | ALMACEN | 201 | 400, 404, 409 (excede lo ordenado), 422 (SKU ajeno) |\n| POST | `/ordenes-compra/{id}/cancelacion` | COMPRAS | 200 | 400 (sin motivo), 404, 409 |\n\nEjemplo de recepción parcial:\n\n```json\n{ \"lineas\": [ { \"articuloSku\": \"TORN-1\", \"cantidad\": 4 } ] }\n```\n\nErrores RFC 9457 con `type` `urn:josesaid:compras-proveedores:error:<slug>`.\n\n## 12. Reglas de duplicados\n\n- RFC único: se compara por el índice HMAC del RFC normalizado (mayúsculas y sin espacios). Un duplicado responde 409.\n- Un SKU aparece una sola vez por orden.\n- Una recepción repetida registra otra recepción mientras no exceda lo ordenado. Pendiente `Idempotency-Key`.\n\n## 13. Eventos\n\nTópico `compras.eventos`, clave = id de la orden.\n\n| Tipo | Cuándo | Datos |\n|---|---|---|\n| `orden-compra-aprobada` | Al aprobar | id, proveedor_id, moneda, total |\n| `insumos-recibidos` | Al registrar una recepción | orden_id, lineas (sku, cantidad) |\n\nLos datos fiscales no aparecen en ningún evento.\n\n## 14. Outbox\n\nEl evento se guarda en `outbox_eventos` dentro de la misma transacción que el cambio de orden. Si una línea de la recepción falla, se revierte toda la recepción y no sale ningún evento.\n\n## 15. Observabilidad\n\n- Salud: `GET /actuator/health`. Métricas: `GET /actuator/prometheus`.\n- Logs JSON ECS. Nunca registran RFC, correo ni razón social.\n- Pendiente: métricas de negocio (`ordenes_compra_total`, `recepciones_total`) y trazas.\n\n## 16. Pruebas\n\n- Unitarias (10): normalización y validación de proveedor, reglas de orden y recepción, y cifrado con AES-GCM e índice HMAC.\n- Integración (1): PostgreSQL 17 y Kafka 4.0.0 con Testcontainers. Cubre RFC duplicado, aprobación solo por DIRECCION, recepciones parciales y totales, y enmascarado.\n\n```bash\nmvn -B verify\nmvn -B package -DskipITs\n```\n\n## 17. Despliegue\n\nImagen multi-etapa, usuario sin privilegios (uid 10001), `HEALTHCHECK`. Despliegue con `docker compose up -d --build`.\n\n## 18. Rollback\n\nLas migraciones no revierten solas. Para volver atrás, despliega la imagen anterior compatible. **Nunca cambies las claves de cifrado sin migrar los datos**: los RFC cifrados quedarían ilegibles.\n\n## 19. Solución de problemas\n\n- **\"Defina COMPRAS_CIFRADO_CLAVE\":** falta la clave en `.env`.\n- **El arranque falla con \"debe ser una clave AES-256\":** la clave no tiene 32 bytes decodificados. Genérala con `openssl rand -base64 32`.\n- **409 \"Ya existe un proveedor con ese RFC\":** el RFC ya está dado de alta.\n- **409 \"La recepción excede lo ordenado\":** consulta `GET /ordenes-compra/{id}` para ver lo pendiente.\n\n## 20. Decisiones y pendientes\n\n- **Añadido:** `GET /ordenes-compra/{id}`, para consultar el estado de cada compra.\n- **Decisión:** monto límite de aprobación de 1,000,000 USD, configurable con `COMPRAS_LIMITE_APROBACION_USD`. Por debajo aprueba COMPRAS; desde el límite, solo DIRECCION.\n- **Pendiente:** responsable del servicio.\n- **Pendiente:** endpoints para cambiar el estatus del proveedor (inactivar o bloquear). Hoy todos nacen `ACTIVO`.\n- **Pendiente:** rotación de claves de cifrado con re-cifrado de datos.\n- **Pendiente:** pago a proveedores desde facturacion-pagos-ms y portal de proveedores.\n- **Pendiente:** `Idempotency-Key`, métricas de negocio y diagramas en PNG.\n\n## 21. Referencias\n\n- Especificación del área: `area_md_specification_files/Compras_Proveedores.md`\n- Diseño técnico: `docs/diseno.md`\n- Orden de arranque general: `README.md` de la raíz, sección 10\n\n## Descubrimiento, gateway y monitoreo\n\n- Al arrancar, `compras-proveedores-ms` se registra en `discovery-ms` (Eureka). Después queda accesible por el gateway en `http://localhost:8080/compras-proveedores-ms/...`.\n- **Orden de arranque:** `discovery-ms` primero. Si este servicio arranca antes, se registra solo cuando el registro esté disponible.\n- Métricas Prometheus en `/actuator/prometheus`, sin token, solo lectura.\n- Variables `EUREKA_USUARIO` y `EUREKA_PASSWORD`: obligatorias en Docker; el Compose arma la URL de registro `http://USUARIO:CLAVE@discovery-ms:8761/eureka/`. Fuera de Docker use `EUREKA_URL=http://USUARIO:CLAVE@localhost:8761/eureka/` y `EUREKA_INSTANCIA_HOST=localhost`.\n\n\n## Idempotencia de altas (`Idempotency-Key`)\n\nEl alta de `POST /v1/ordenes-compra` acepta la cabecera opcional `Idempotency-Key`. Úsela cuando un reintento no debe crear el registro dos veces (por ejemplo, si se cortó la conexión y no sabe si la petición llegó).\n\n- **Misma clave y mismo cuerpo:** responde la misma respuesta original; no se crea nada nuevo.\n- **Misma clave con otro cuerpo:** responde `422` (`regla-de-negocio`).\n- **Misma clave mientras la primera petición sigue en proceso:** responde `409` (`conflicto-de-estado`).\n- **Sin la cabecera:** la petición se procesa como siempre.\n\nLas respuestas completadas se guardan 24 horas en la tabla `idempotencia`. Si la operación falla, la clave se libera para que el cliente pueda reintentar. Si la petición se interrumpe a medio camino y la clave queda en proceso, un nuevo intento con la misma clave la retoma pasados 2 minutos; antes de eso responde 409.\n\n\n## Indicadores para reportes ejecutivos\n\nPublica un indicador mensual al tópico `indicadores-areas`, que consume `reportes-ejecutivos-ms`.\n\n- **Indicador:** `ordenes_mes` (área `COMPRAS_PROVEEDORES`).\n- **Definición:** Número de órdenes de compra creadas en el mes, en cualquier estatus (incluidas canceladas). Las órdenes anteriores a V3 reciben, en la migración V4, la fecha en que se aplicó esa migración.\n- **Indicador adicional:** `ordenes_canceladas_mes` (mismo área). Cuenta solo las órdenes en estatus CANCELADA del mes.\n- **Clave del mensaje:** `COMPRAS_PROVEEDORES|ordenes_mes|AAAA-MM`. Reportes actualiza el valor por área, nombre y periodo (upsert).\n- **Ciclo:** recalcula el mes actual y el anterior cada 60 minutos; el primer envío ocurre a los 30 segundos.\n- **Configuración:** `INDICADORES_TOPICO`, `INDICADORES_INTERVALO_MS`, `INDICADORES_INICIO_MS`.\n- **Entrega:** no pasa por el outbox. Es una foto del periodo; si un envío falla, el siguiente ciclo lo corrige.\n- **Clase:** `PublicadorIndicadoresOrdenes`. Prueba: `mvn verify -Dit.test='PublicadorIndicadores*IT'`.\n\n## Guías paso a paso\n\nProcedimientos de este servicio, publicados en HTML:\n\n- [Ejecutar las pruebas de un servicio](https://github.com/josesaid/EMPRESA_JOSESAID/blob/main/docs/guias/02-ejecutar-pruebas.html)\n- [Crear un proveedor, una orden, aprobarla y recibirla](https://github.com/josesaid/EMPRESA_JOSESAID/blob/main/docs/guias/06-orden-de-compra.html)\n- [Índice de todas las guías](https://github.com/josesaid/EMPRESA_JOSESAID/blob/main/docs/guias/README.html)\n", "permisos": [{"verbo": "POST", "ruta": "/v1/ordenes-compra", "operacion": "Crear orden", "roles": "hasRole('COMPRAS')"}, {"verbo": "GET", "ruta": "/v1/ordenes-compra", "operacion": "Listar ordenes", "roles": "hasAnyRole('COMPRAS','ALMACEN','DIRECCION')"}, {"verbo": "GET", "ruta": "/v1/ordenes-compra/{id}", "operacion": "Obtener orden", "roles": "hasAnyRole('COMPRAS','ALMACEN','DIRECCION')"}, {"verbo": "POST", "ruta": "/v1/ordenes-compra/{id}/aprobacion", "operacion": "Aprobar orden", "roles": "hasAnyRole('COMPRAS','DIRECCION')"}, {"verbo": "POST", "ruta": "/v1/ordenes-compra/{id}/cancelacion", "operacion": "Cancelar orden", "roles": "hasRole('COMPRAS')"}, {"verbo": "POST", "ruta": "/v1/ordenes-compra/{id}/recepciones", "operacion": "Registrar recepcion", "roles": "hasRole('ALMACEN')"}, {"verbo": "POST", "ruta": "/v1/proveedores", "operacion": "Crear proveedor", "roles": "hasRole('COMPRAS')"}, {"verbo": "GET", "ruta": "/v1/proveedores", "operacion": "Buscar proveedores", "roles": "hasAnyRole('COMPRAS','FINANZAS')"}, {"verbo": "GET", "ruta": "/v1/proveedores/{id}", "operacion": "Obtener proveedor", "roles": "hasAnyRole('COMPRAS','FINANZAS')"}], "diagramas": [{"titulo": "01 maquina de estados orden", "archivos": ["compras-proveedores-ms/diagramas/01-maquina-de-estados-orden.mmd", "compras-proveedores-ms/diagramas/01-maquina-de-estados-orden.png"], "imagen": "compras-proveedores-ms/diagramas/01-maquina-de-estados-orden.png", "codigo": "flowchart TD\n  P[\"<b>Proveedor<\/b><br/>ACTIVO, INACTIVO o BLOQUEADO\"]:::actor -. \"solo ACTIVO recibe órdenes nuevas\" .-> A[\"<b>Orden BORRADOR<\/b>\"]:::actor\n  A --> B[\"<b>Aprobación<\/b><br/>Ver diagrama 03: límite de monto y creador\"]:::pendiente\n  B --> C[\"<b>APROBADA<\/b>\"]:::servicio\n  C -- \"recepción parcial\" --> D[\"<b>RECIBIDA_PARCIAL<\/b>\"]:::servicio\n  D -- \"recepción completa\" --> F[\"<b>RECIBIDA<\/b><br/>Sin más cambios\"]:::datos\n  A -- \"cancelar con motivo\" --> X[\"<b>CANCELADA<\/b>\"]:::alerta\n  C -- \"cancelar con motivo\" --> X\n\n  classDef actor fill:#F1EFE8,stroke:#888780,color:#2C2C2A\n  classDef servicio fill:#E1F5EE,stroke:#1D9E75,color:#04342C\n  classDef datos fill:#E6F1FB, dor de la orden?<\/b>\"}:::pendiente\n  C -- \"sí\" --> E1[\"<b>403<\/b><br/>No puedes aprobar una orden que tú creaste\"]:::alerta\n  C -- \"no\" --> M{\"<b>Moneda<\/b>\"}:::pendiente\n  M -- \"MXN\" --> V[\"<b>Convierte a USD<\/b><br/>COMPRAS_TIPO_CAMBIO_MXN_USD\"]:::servicio\n  M -- \"USD\" --> L{\"<b>Total mayor o igual al límite?<\/b><br/>COMPRAS_LIMITE_APROBACION_USD, por defecto 1,000,000\"}:::pendiente\n  V --> L\n  L -- \"no\" --> OK[\"<b>COMPRAS aprueba<\/b>\"]:::servicio\n  L -- \"sí\" --> DIR[\"<b>Solo DIRECCION aprueba<\/b><br/>COMPRAS recibe 403\"]:::alerta\n  OK --> F[\"<b>APROBADA<\/b>\"]:::datos\n  DIR --> F\n  K[\"<b>Orden antigua sin creador registrado<\/b>\"]:::actor -. \"solo DIRECCION la aprueba\" .-> DIR\n\n  classDef actor fill:#F1EFE8,stroke:#888780,color:#2C2C2A\n  classDef servicio fill:#E1F5EE,stroke:#1D9E75,color:#04342C\n  classDef datos fill:#E6F1FB,stroke:#378ADD,color:#042C53\n  classDef alerta fill:#FCEBEB,stroke:#E24B4A,color:#501313\n  classDef pendiente fill:#FAEEDA,stroke:#BA7517,color:#412402\n"}, {"titulo": "04 recepciones y eventos", "archivos": ["compras-proveedores-ms/diagramas/04-recepciones-y-eventos.mmd", "compras-proveedores-ms/diagramas/04-recepciones-y-eventos.png"], "imagen": "compras-proveedores-ms/diagramas/04-recepciones-y-eventos.png", "codigo": "flowchart TD\n  A[\"<b>Recepción<\/b><br/>Lista de líneas: SKU y cantidad\"]:::actor --> B{\"<b>Todas las líneas son válidas?<\/b>\"}:::pendiente\n  B -- \"no\" --> E1[\"<b>Se revierte toda la recepción<\/b><br/>No sale ningún evento\"]:::alerta\n  B -- \"sí\" --> C[\"<b>Se registra la recepción<\/b><br/>Cambia el estatus de la orden\"]:::servicio\n  C --> D{\"<b>Quedan líneas pendientes?<\/b>\"}:::pendiente\n  D -- \"sí\" --> E2[\"<b>RECIBIDA_PARCIAL<\/b>\"]:::servicio\n  D -- \"no\" --> E3[\"<b>RECIBIDA<\/b>\"]:::datos\n  C --> F[\"<b>Evento insumos-recibidos<\/b><br/>compras.eventos, en el outbox de la misma transacción\"]:::datos\n  F -. \"pendiente: inventario y con ad": {"type": "number"}, "precioUnitario": {"type": "number"}}}, "EstatusOrdenCompra": {"type": "object", "properties": {}}, "ResumenOrdenRespuesta": {"type": "object", "properties": {"id": {"type": "string", "format": "uuid"}, "estatus": {"$ref": "#/components/schemas/EstatusOrdenCompra"}, "razonSocialProveedor": {"type": "string"}, "creadaUtc": {"type": "string", "format": "date-time"}}}, "OrdenRespuesta": {"type": "object", "properties": {"id": {"type": "string", "format": "uuid"}, "proveedorId": {"type": "string", "format": "uuid"}, "estatus": {"$ref": "#/components/schemas/EstatusOrdenCompra"}, "moneda": {"type": "string"}, "total": {"type": "number"}, "motivoCancelacion": {"type": "string"}, "lineas": {"type": "array", "items": {"$ref": "#/components/schemas/LineaRespuesta"}}}}, "LineaRespuesta": {"type": "object", "properties": {"articuloSku": {"type": "string"}, "cantidadOrdenada": {"type": "number"}, "cantidadRecibida": {"type": "number"}, "precioUnitario": {"type": "number"}, "subtotal": {"type": "number"}}}, "RecepcionSolicitud": {"type": "object", "properties": {"lineas": {"type": "array", "items": {"$ref": "#/components/schemas/LineaRecepcionSolicitud"}}}}, "LineaRecepcionSolicitud": {"type": "object", "properties": {"articuloSku": {"type": "string"}, "cantidad": {"type": "number"}}}, "CancelarSolicitud": {"type": "object", "properties": {"motivo": {"type": "string"}}}}}}</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
<script>
(function () {
  const D = JSON.parse(document.getElementById('datos').textContent);
  const SPEC = JSON.parse(document.getElementById('spec').textContent);
  const $ = (s) => document.querySelector(s);

  function el(tag, attrs, hijos) {
    const n = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (hijos || []).forEach(function (h) {
      if (h === null || h === undefined || h === false) return;
      n.append(h.nodeType ? h : document.createTextNode(String(h)));
    });
    return n;
  }

  function chips(lista, vacio) {
    if (!lista || !lista.length) return [el('span', { class: 'aviso', text: vacio })];
    return lista.map(function (r) { return el('span', { class: 'chip', text: r }); });
  }

  if (window.mermaid) {
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'loose',
      theme: window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default'
    });
  }

  function pintarInfo() {
    const i = D.info;
    $('#titulo').textContent = i.nombre;
    $('#descr').textContent = i.descripcion || '';
    const pild = $('#pildoras');
    [
      'Puerto ' + (i.puerto || '—'),
      'Java ' + (i.java || '—'),
      'Spring Boot ' + (i.spring_boot || '—'),
      i.endpoints ? i.endpoints + ' endpoints' : 'Sin API REST'
    ].forEach(function (t) { pild.append(el('span', { class: 'pildora', text: t })); });
    const campos = [
      ['Servicio', i.nombre],
      ['Descripción', i.descripcion || '—'],
      ['Puerto de la aplicación', i.puerto || '—'],
      ['Java', i.java || '—'],
      ['Spring Boot', i.spring_boot || '—'],
      ['Endpoints REST', i.endpoints || 'Ninguno']
    ];
    const dl = el('dl', { class: 'datos' });
    campos.forEach(function (c) {
      dl.append(el('div', {}, [el('dt', { text: c[0] }), el('dd', { text: String(c[1]) })]));
    });
    dl.append(el('div', {}, [el('dt', { text: 'Roles a usar' }),
      el('dd', {}, chips(i.roles, 'Ninguno detectado'))]));
    $('[data-panel="info"]').append(dl);
  }

  function pintarReadme() {
    const panel = $('[data-panel="readme"]');
    if (!D.readme) {
      panel.append(el('p', { class: 'aviso', text: 'Este servicio no tiene README.md.' }));
      return;
    }
    const art = el('article', { class: 'md' });
    if (window.marked) {
      art.innerHTML = marked.parse(D.readme);
    } else {
      art.append(el('pre', { text: D.readme }));
    }
    art.querySelectorAll('pre > code.language-mermaid').forEach(function (code) {
      const m = el('div', { class: 'mermaid' });
      m.dataset.src = code.textContent;
      code.parentElement.replaceWith(m);
    });
    panel.append(art);
  }

  function pintarPermisos() {
    const panel = $('[data-panel="permisos"]');
    panel.append(el('h2', { class: 'subtitulo', text: 'Roles a usar' }));
    panel.append(el('p', {}, chips(D.info.roles, 'Ninguno detectado')));
    if (!D.permisos.length) {
      panel.append(el('p', { class: 'aviso', text: 'Este servicio no expone endpoints REST, así que no tiene reglas de acceso por endpoint.' }));
      return;
    }
    const cabeza = el('tr', {}, ['Método', 'Ruta', 'Operación', 'Regla de acceso'].map(function (t) {
      return el('th', { text: t });
    }));
    const cuerpo = el('tbody');
    D.permisos.forEach(function (p) {
      cuerpo.append(el('tr', {}, [
        el('td', {}, [el('span', { class: 'verbo', text: p.verbo })]),
        el('td', { text: p.ruta }),
        el('td', { text: p.operacion }),
        el('td', { text: p.roles || 'Solo autenticación (sin @PreAuthorize)' })
      ]));
    });
    const tabla = el('table', {}, [el('thead', {}, [cabeza]), cuerpo]);
    panel.append(el('div', { class: 'tabla-wrap' }, [tabla]));
  }

  function pintarDiagramas() {
    const panel = $('[data-panel="diagramas"]');
    if (!D.diagramas.length) {
      panel.append(el('p', { class: 'aviso', text: 'Este servicio no tiene carpeta docs/diagramas.' }));
      return;
    }
    const grid = el('div', { class: 'grid-diag' });
    D.diagramas.forEach(function (d) {
      const tarjeta = el('article', { class: 'diag' });
      tarjeta.append(el('h3', { text: d.titulo }));
      if (d.imagen) {
        const img = el('img', { src: d.imagen, alt: d.titulo, loading: 'lazy' });
        img.onerror = function () {
          img.replaceWith(el('p', { class: 'aviso', text: 'No se pudo mostrar la imagen. Usa el enlace de abajo para abrir el archivo.' }));
        };
        tarjeta.append(el('a', { href: d.imagen, target: '_blank', rel: 'noopener', class: 'abrir', title: 'Abrir archivo' }, [img]));
      } else if (d.codigo) {
        const m = el('div', { class: 'mermaid' });
        m.dataset.src = d.codigo;
        tarjeta.append(m);
      }
      const pie = el('div', { class: 'pie' });
      d.archivos.forEach(function (a, idx) {
        if (idx) pie.append(' · ');
        pie.append(el('a', { href: a, target: '_blank', rel: 'noopener', text: a.split('/').pop() }));
      });
      tarjeta.append(pie);
      grid.append(tarjeta);
    });
    panel.append(grid);
  }

  async function renderMermaidIn(raiz) {
    if (!raiz) return;
    for (const nodo of raiz.querySelectorAll('.mermaid')) {
      if (nodo.dataset.ok) continue;
      const src = nodo.dataset.src || '';
      if (!window.mermaid) {
        nodo.replaceChildren(el('pre', { text: src }));
        continue;
      }
      try {
        const salida = await mermaid.render('m' + Math.random().toString(36).slice(2), src);
        nodo.innerHTML = salida.svg;
        nodo.dataset.ok = '1';
      } catch (e) {
        nodo.replaceChildren(
          el('p', { class: 'aviso', text: 'No se pudo renderizar este diagrama. Se muestra el código fuente:' }),
          el('pre', { text: src }));
      }
    }
  }

  function pintarTecnologias() {
    const panel = $('[data-panel="tecnologias"]');
    panel.append(el('p', { class: 'aviso', text: 'Herramientas de calidad y pruebas que el pom.xml de este servicio aplica. Las marcadas como no aplicadas no están configuradas.' }));
    const grid = el('div', { class: 'grid-diag' });
    D.tecnologias.forEach(function (t) {
      const tarjeta = el('article', { class: 'diag' });
      tarjeta.append(el('h3', { text: t.nombre }));
      tarjeta.append(el('p', { class: 'aviso', text: t.resumen }));
      if (t.aplicado) {
        tarjeta.append(el('a', { href: t.archivo, class: 'chip', text: 'Ver detalle →' }));
      } else {
        tarjeta.append(el('span', { class: 'chip', text: 'No aplicado' }));
      }
      grid.append(tarjeta);
    });
    panel.append(grid);
  }

  let swaggerListo = false;
  function iniciarSwagger() {
    if (swaggerListo || !SPEC || !window.SwaggerUIBundle) return;
    swaggerListo = true;
    window.ui = SwaggerUIBundle({ spec: SPEC, dom_id: '#swagger-ui', deepLinking: false, persistAuthorization: true });
  }

  function pintarApi() {
    if (SPEC) return;
    $('[data-panel="api"]').replaceChildren(el('p', { class: 'aviso', text: 'Este servicio no expone endpoints REST, así que no tiene Swagger.' }));
    $('[data-tab="api"]').hidden = true;
  }

  const botones = Array.from(document.querySelectorAll('[role="tab"]'));
  function activar(nombre, cambiarHash) {
    if (nombre === 'api' && !SPEC) nombre = 'info';
    botones.forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === nombre)); });
    document.querySelectorAll('[data-panel]').forEach(function (p) { p.hidden = p.dataset.panel !== nombre; });
    if (nombre === 'readme' || nombre === 'diagramas') renderMermaidIn(document.querySelector('[data-panel="' + nombre + '"]'));
    if (nombre === 'api') iniciarSwagger();
    if (cambiarHash) { try { history.replaceState(null, '', '#' + nombre); } catch (e) {} }
  }
  botones.forEach(function (b) { b.addEventListener('click', function () { activar(b.dataset.tab, true); }); });

  pintarInfo();
  pintarReadme();
  pintarPermisos();
  pintarDiagramas();
  pintarApi();
  pintarTecnologias();
  const inicial = location.hash.slice(1);
  activar(['info', 'readme', 'permisos', 'diagramas', 'tecnologias', 'api'].indexOf(inicial) >= 0 ? inicial : 'info', false);
})();
</script>
</body>
</html>
