<script type="application/json" id="datos">{"svc": "facturacion-pagos-ms", "info": {"nombre": "facturacion-pagos-ms", "descripcion": "Emisión de comprobantes fiscales, cobro y registro de pagos.", "puerto": "8081", "java": "21", "spring_boot": "4.1.2", "endpoints": 10, "roles": ["FINANZAS", "VENTAS"]}, "readme": "# facturacion-pagos-ms\n\nMicroservicio del área **Facturación y pagos** de EMPRESA_JOSESAID. Emite comprobantes a partir de órdenes, registra cobros y gestiona cancelaciones.\n\n## 1. Identidad\n\n- **Servicio:** facturacion-pagos-ms · **Versión:** 0.1.0 · **Lenguaje:** Java 21 · **Framework:** Spring Boot 4.1.2\n- **Acceso:** vía gateway, sin puerto publicado (contenedor: contenedor: 8081) · **Base de datos:** `facturacion_pagos`\n- **Responsable:** pendiente de asignar · **Estado:** emisión provisional, sin timbrado fiscal (ver sección 20)\n\n## 2. Propósito y alcance\n\nCrea comprobantes en borrador a partir de una orden, los emite con folio, registra pagos contra su saldo y los cancela con motivo.\n\n**Dentro del alcance:** comprobantes, cálculo de IVA y total, pagos parciales o totales, cancelación con motivo, publicación de eventos.\n\n**Fuera del alcance:** timbrado CFDI con el PAC, complementos de pago, contabilidad (lo hace contabilidad-ms), cobranza a clientes (la hace clientes-ms) y emisión de pedidos (la hace pedidos-ventas-ms).\n\n## 3. Estructura del repositorio\n\n```\nfacturacion-pagos-ms/\n├── pom.xml\n├── Dockerfile\n├── docker-compose.yml          Servicio, con comentarios\n├── .env.example                Variables requeridas (sin valores reales)\n├── docs/diseno.md              Diseño técnico\n├── src/main/java/.../facturacion_pagos/\n│   ├── domain/                 Comprobante, Pago, reglas y puertos (sin Spring)\n│   ├── application/            FacturacionService y publicador de eventos\n│   ├── infrastructure/\n│   │   ├── persistence/        Entidades JPA y adaptador del repositorio\n│   │   └── outbox/             Outbox y retransmisor a Kafka\n│   ├── api/                    Controlador REST y manejo de errores\n│   └── config/                 Seguridad JWT, reloj y propiedades\n└── src/test/java/...           Pruebas unitarias e integración\n```\n\n## 4. Requisitos\n\n- JDK 21 y Maven 3.9 (solo para compilar fuera de Docker)\n- Docker Desktop con Compose v2\n- Red `empresa-net` creada una vez: `docker network create empresa-net`\n\n## 5. Configuración\n\n| Variable | Obligatoria | Descripción |\n|---|---|---|\n| `FACTURACION_DB_PASSWORD` | Sí (Compose) | Contraseña del usuario `facturacion_pagos`. Va en el `.env` de la raíz o de esta carpeta. |\n| `JWT_JWKS_URI` | No | URL del JWKS de usuarios-accesos-ms (clave pública). Ya viene configurada en el Compose |\n| `DB_URL`, `DB_USER`, `DB_PASSWORD` | No | Datos de conexión. Compose ya los fija. |\n| `KAFKA_BOOTSTRAP` | No | Por defecto `localhost:9092`. En Compose: `kafka:29092`. |\n| `JWT_DURACION` | No | Vida del token (ISO-8601), solo para referencia. Por defecto `PT15M`. |\n| `OUTBOX_INTERVALO_MS` | No | Cada cuántos milisegundos se envían eventos pendientes. Por defecto 5000. |\n\nNingún valor real está en el código. Las credenciales viven solo en `.env`, que está en `.gitignore`.\n\n## 6. Ejecución\n\n**Orden de arranque (obligatorio):**\n\n1. Red: `docker network create empresa-net` (una sola vez)\n2. Infraestructura de la raíz: `docker compose up -d postgres kafka` desde la raíz\n3. **usuarios-accesos-ms** primero, porque emite los tokens que este servicio valida\n4. **facturacion-pagos-ms** (este servicio)\n\nEste servicio puede arrancar solo, pero sin PostgreSQL y Kafka no inicia. Para levantarlo:\n\n```bash\ncd facturacion-pagos-ms\ndocker compose up -d --build\ncurl -s http://localhost:8080/facturacion-pagos-ms/actuator/health\n```\n\nPara desarrollo sin contenedor: `mvn spring-boot:run`, con las variables de la sección 5 y PostgreSQL y Kafka accesibles en localhost.\n\n## 7. Modelo de datos\n\n- **comprobantes:** id, orden_id, folio (único), moneda (MXN o USD), subtotal, iva, total, tasa_iva, estatus, motivo_cancelacion, version, creado_utc, actualizado_utc.\n- **pagos:** id, comprobante_id (FK), monto, fecha_pago, referencia, creado_utc. Los pagos no se modifican ni se borran.\n- **outbox_eventos:** id, tipo, agregado_id, payload, creado_utc, publicado_utc, intentos.\n\nTodos los importes son `NUMERIC(14,2)`. Las fechas de sistema son `TIMESTAMPTZ` en UTC.\n\n## 8. Migraciones\n\n- Flyway ejecuta `V1__esquema_inicial.sql` al arrancar.\n- Hibernate solo valida el esquema (`ddl-auto: validate`).\n- Las migraciones son hacia adelante: cambios nuevos en `V2`, `V3`… Nunca se editan migraciones ya aplicadas.\n\n## 9. Máquinas de estado\n\n**Comprobante:** `BORRADOR → EMITIDO → CANCELADO`.\n- Solo un borrador se emite, y al emitir se asigna el folio.\n- Solo un emitido se cancela, y la cancelación exige motivo.\n- Un cancelado no vuelve a emitirse.\n\n**Cobro** (derivado, no se guarda): `PENDIENTE` (sin pagos) → `PARCIAL` → `PAGADO` (saldo en cero).\n\nLos pagos solo se aceptan en comprobantes emitidos y nunca exceden el saldo.\n\n## 10. Seguridad\n\n- API sin estado con JWT RS256 (resource server). Solo `/actuator/health` es público.\n- Roles por método con `@PreAuthorize`:\n  - `FINANZAS`: crear, emitir, cancelar y registrar pagos. Además leer.\n  - `VENTAS`: solo leer.\n- Sin `ROLE_FINANZAS` ni `ROLE_VENTAS` la respuesta es 403; sin token, 401.\n- El servicio falla al arrancar si el clave pública JWKS tiene menos de 32 bytes.\n\n## 11. API\n\nBase: `/v1/comprobantes`\n\n| Método | Ruta | Rol | Respuesta |\n|---|---|---|---|\n| POST | `/` | FINANZAS | 201 comprobante en borrador |\n| GET | `/{id}` | FINANZAS, VENTAS | 200 comprobante con pagos y saldo |\n| POST | `/{id}/emision` | FINANZAS | 200 comprobante emitido con folio |\n| POST | `/{id}/cancelacion` | FINANZAS | 200 comprobante cancelado |\n| POST | `/{id}/pagos` | FINANZAS | 201 comprobante actualizado |\n\nEjemplo de creación:\n\n```json\n{ \"ordenId\": \"00000000-0000-0000-0000-000000000001\", \"moneda\": \"MXN\", \"subtotal\": 1000, \"tasaIva\": 0.16 }\n```\n\nLos errores siguen RFC 9457 (`ProblemDetail`) con `type` `urn:josesaid:facturacion-pagos:error:<slug>`: `datos-invalidos` (400), `no-encontrado` (404), `conflicto` (409) y `regla-de-negocio` (422).\n\n## 12. Reglas de duplicados\n\n- Folio: único por base de datos. El folio es provisional y se genera en la emisión.\n- Pagos: con la cabecera `Idempotency-Key` no se duplican. Sin ella, dos envíos iguales registran dos pagos (ver «Idempotencia de altas»).\n\n## 13. Eventos\n\nSe publican en el tópico `facturacion-pagos.eventos`, con la clave `agregadoId` (id del comprobante).\n\n| Tipo | Cuándo | Datos |\n|---|---|---|\n| `comprobante-emitido` | Al emitir | comprobanteId, folio, total |\n| `pago-registrado` | Al registrar un pago | comprobanteId, monto, saldo |\n| `pago-proveedor-registrado` | Al registrar un pago a proveedor | cuentaId, ordenId, proveedorId, moneda, monto, saldo |\n| `comprobante-cancelado` | Al cancelar | comprobanteId, motivo |\n\n## 14. Outbox\n\nEl evento se guarda en `outbox_eventos` dentro de la misma transacción que el cambio de negocio. Así no se pierde un evento si Kafka no responde. El retransmisor lo envía cada `OUTBOX_INTERVALO_MS`, en orden de creación, y se detiene en el primer fallo para no romper el orden.\n\n## 15. Observabilidad\n\n- Salud: `GET /actuator/health`\n- Métricas: `GET /actuator/prometheus`\n- Logs JSON en formato ECS para el anexo de la empresa.\n- Pendiente: trazas distribuidas y métricas de negocio (sección 20).\n\n## 16. Pruebas\n\n- Unitarias (9): reglas de `Comprobante` y `FacturacionService` con repositorio en memoria.\n- Integración (1): PostgreSQL 17 y Kafka 4.0.0 reales con Testcontainers. Cubre roles, errores y el flujo completo.\n\n```bash\nmvn -B verify          # unitarias e integración, requiere Docker\nmvn -B package -DskipITs   # solo unitarias\n```\n\nPara verificar en tu Mac: `bash ejecutar-pruebas-facturacion.sh` desde la raíz del repositorio.\n\n## 17. Despliegue\n\nImagen multi-etapa (Maven para compilar, JRE 21 para ejecutar), usuario sin privilegios (uid 10001) y `HEALTHCHECK` sobre `/actuator/health`. Se despliega con `docker compose up -d --build` o publicando la imagen `facturacion-pagos-ms:0.1.0`.\n\n## 18. Rollback\n\n- Las migraciones no tienen rollback automático. Revertir código no revierte el esquema.\n- Para volver a una versión anterior: desplegar la imagen anterior, siempre que sea compatible con el esquema actual.\n- Un cambio de esquema que rompa compatibilidad requiere una migración nueva que corrija los datos, no borrarlos.\n\n## 19. Solución de problemas\n\n- **401 en todas las rutas:** `JWT_JWKS_URI` no responde; revise que usuarios-accesos-ms esté arriba.\n- **\"Defina FACTURACION_DB_PASSWORD\":** falta la variable en `.env`. Compose se detiene a propósito.\n- **Todas las peticiones dan 401:** el secreto no coincide con el de usuarios-accesos-ms, o el token expiró.\n- **Error de conexión a la base:** PostgreSQL no está arriba o `init-databases.sh` no creó el usuario. Revisa que se haya creado el volumen con la variable definida.\n\n## 20. Decisiones y pendientes\n\n- **Decisión:** el folio es provisional (`FAC-` + 8 caracteres). El folio fiscal vendrá del PAC.\n- **Pendiente crítico:** timbrado CFDI con PAC, folio y UUID fiscal.\n- **Pendiente:** complementos de pago y cancelación ante el SAT.\n- **Pendiente:** `Idempotency-Key` en pagos y creación.\n- **Pendiente:** trazas distribuidas y métricas de negocio.\n- **Pendiente:** diagramas en PNG (`docs/diagramas`) y reglas de tasas de IVA por tipo de operación.\n\n## 21. Referencias\n\n- Especificación del área: `area_md_specification_files/Facturacion_Pagos.md`\n- Diseño técnico: `docs/diseno.md`\n- Documento de arranque de la raíz: `README.md` del repositorio (sección de orden de arranque)\n\n## Descubrimiento, gateway y monitoreo\n\n- Al arrancar, `facturacion-pagos-ms` se registra en `discovery-ms` (Eureka). Después queda accesible por el gateway en `http://localhost:8080/facturacion-pagos-ms/...`.\n- **Orden de arranque:** `discovery-ms` primero. Si este servicio arranca antes, se registra solo cuando el registro esté disponible.\n- Métricas Prometheus en `/actuator/prometheus`, sin token, solo lectura.\n- Variables `EUREKA_USUARIO` y `EUREKA_PASSWORD`: obligatorias en Docker; el Compose arma la URL de registro `http://USUARIO:CLAVE@discovery-ms:8761/eureka/`. Fuera de Docker use `EUREKA_URL=http://USUARIO:CLAVE@localhost:8761/eureka/` y `EUREKA_INSTANCIA_HOST=localhost`.\n\n\n## Cuentas por pagar a proveedores\n\nCada orden aprobada en compras-proveedores-ms genera una cuenta por pagar, en la moneda y por el total de la orden. La cuenta se crea una sola vez por orden, aunque el evento llegue dos veces.\n\n- `GET /v1/cuentas-por-pagar/{id}` y `POST /v1/cuentas-por-pagar/{id}/pagos` son solo para FINANZAS.\n- Un pago no puede exceder el saldo (422) ni tener un monto que redondee a cero. Si no se envía la fecha, se usa la del reloj del servicio.\n- El estatus se deriva: PENDIENTE sin pagos, PARCIAL con saldo y PAGADA con saldo en cero.\n- Cada pago publica `pago-proveedor-registrado` por outbox y acepta `Idempotency-Key`.\n- Al desplegar, el listener lee `compras.eventos` desde el inicio del topic, así que crea cuentas para las órdenes aprobadas antes del despliegue. Los eventos sin moneda válida (MXN o USD) o con total no positivo se descartan y se registran en el log.\n\n## Tasa de IVA\n\nEl servidor fija la tasa según la fecha de creación del comprobante (en borrador): 16 % si es anterior al 1 de noviembre de 2026 y 8 % (tasa fronteriza) desde esa fecha, para todas las operaciones. El cliente no envía la tasa, y el comprobante conserva la tasa con la que se creó.\n\n## Idempotencia de altas (`Idempotency-Key`)\n\nEl alta de `POST /v1/comprobantes/{id}/pagos` acepta la cabecera opcional `Idempotency-Key`. Úsela cuando un reintento no debe crear el registro dos veces (por ejemplo, si se cortó la conexión y no sabe si la petición llegó).\n\n- **Misma clave y mismo cuerpo:** responde la misma respuesta original; no se crea nada nuevo.\n- **Misma clave con otro cuerpo:** responde `422` (`regla-de-negocio`).\n- **Misma clave mientras la primera petición sigue en proceso:** responde `409` (`conflicto-de-estado`).\n- **Sin la cabecera:** la petición se procesa como siempre.\n\nLas respuestas completadas se guardan 24 horas en la tabla `idempotencia`. Si la operación falla, la clave se libera para que el cliente pueda reintentar. Si la petición se interrumpe a medio camino y la clave queda en proceso, un nuevo intento con la misma clave la retoma pasados 2 minutos; antes de eso responde 409.\n\n\n## Indicadores para reportes ejecutivos\n\nPublica un indicador mensual al tópico `indicadores-areas`, que consume `reportes-ejecutivos-ms`.\n\n- **Indicador:** `cobrado_mes` (área `FINANZAS_CONTABILIDAD`).\n- **Definición:** Suma de pagos en MXN de comprobantes EMITIDOS, asignada al mes de la fecha de pago. Incluye IVA.\n- **Clave del mensaje:** `FINANZAS_CONTABILIDAD|cobrado_mes|AAAA-MM`. Reportes actualiza el valor por área, nombre y periodo (upsert).\n- **Ciclo:** recalcula el mes actual y el anterior cada 60 minutos; el primer envío ocurre a los 30 segundos.\n- **Configuración:** `INDICADORES_TOPICO`, `INDICADORES_INTERVALO_MS`, `INDICADORES_INICIO_MS`.\n- **Entrega:** no pasa por el outbox. Es una foto del periodo; si un envío falla, el siguiente ciclo lo corrige.\n- **Clase:** `PublicadorIndicadoresCobranza`. Prueba: `mvn verify -Dit.test='PublicadorIndicadores*IT'`.\n\n## Guías paso a paso\n\nProcedimientos de este servicio, publicados en HTML:\n\n- [Ejecutar las pruebas de un servicio](https://github.com/josesaid/EMPRESA_JOSESAID/blob/main/docs/guias/02-ejecutar-pruebas.html)\n- [Registrar un pago a proveedor](https://github.com/josesaid/EMPRESA_JOSESAID/blob/main/docs/guias/07-pago-a-proveedor.html)\n- [Emitir un comprobante, registrar un cobro y cancelar](https://github.com/josesaid/EMPRESA_JOSESAID/blob/main/docs/guias/08-comprobantes-y-cobros.html)\n- [Índice de todas las guías](https://github.com/josesaid/EMPRESA_JOSESAID/blob/main/docs/guias/README.html)\n", "permisos": [{"verbo": "POST", "ruta": "/v1/comprobantes", "operacion": "Crear", "roles": "hasRole('FINANZAS')"}, {"verbo": "GET", "ruta": "/v1/comprobantes", "operacion": "Buscar por folio", "roles": "hasAnyRole('FINANZAS','VENTAS')"}, {"verbo": "GET", "ruta": "/v1/comprobantes/pendientes-cobro", "operacion": "Listar pendientes cobro", "roles": "hasAnyRole('FINANZAS','VENTAS')"}, {"verbo": "GET", "ruta": "/v1/comprobantes/{id}", "operacion": "Obtener", "roles": "hasAnyRole('FINANZAS','VENTAS')"}, {"verbo": "POST", "ruta": "/v1/comprobantes/{id}/cancelacion", "operacion": "Cancelar", "roles": "hasRole('FINANZAS')"}, {"verbo": "POST", "ruta": "/v1/comprobantes/{id}/emision", "operacion": "Emitir", "roles": "hasRole('FINANZAS')"}, {"verbo": "POST", "ruta": "/v1/comprobantes/{id}/pagos", "operacion": "Registrar pago", "roles": "hasRole('FINANZAS')"}, {"verbo": "GET", "ruta": "/v1/cuentas-por-pagar/pagos", "operacion": "Listar pagos", "roles": "hasRole('FINANZAS')"}, {"verbo": "GET", "ruta": "/v1/cuentas-por-pagar/{id}", "operacion": "Obtener", "roles": "hasRole('FINANZAS')"}, {"verbo": "POST", "ruta": "/v1/cuentas-por-pagar/{id}/pagos", "operacion": "Registrar pago", "roles": "hasRole('FINANZAS')"}], "diagramas": [{"titulo": "01 maquinas de estado comprobante y cobro", "archivos": ["facturacion-pagos-ms/diagramas/01-maquinas-de-estado-comprobante-y-cobro.mmd", "facturacion-pagos-ms/diagramas/01-maquinas-de-estado-comprobante-y-cobro.png"], "imagen": "facturacion-pagos-ms/diagramas/01-maquinas-de-estado-comprobante-y-cobro.png", "codigo": "flowchart TD\n  A[\"<b>Comprobante BORRADOR<\/b><br/>Moneda MXN o USD, subtotal mayor a cero\"]:::actor -->|\"emisión\"| B[\"<b>EMITIDO<\/b><br/>Folio provisional FAC-\"]:::servicio\n  A -->|\"cancelación\"| C[\"<b>CANCELADO<\/b><br/>Evento comprobante-cancelado\"]:::alerta\n  B -->|\"cancelación\"| C\n  B --> D{\"<b>Pagos registrados<\/b><br/>El cobro se deriva, no se guarda\"}:::pendiente\n  D -- \"sin pagos\" --> E[\"<b>Cobro PENDIENTE<\/b>\"]:::actor\n  D -- \"saldo mayor a cero\" --> F[\"<b>Cobro PARCIAL<\/b>\"]:::servicio\n  D -- \"saldo en cero\" --> G[\"<b>Cobro PAGADO<\/b>\"]:::datos\n\n  classDef actor fill:#F1EFE8,stroke:#888780,color:#2C2C2A\n  classDef servicio fill:#E1F5EE,stroke:#1D9E75,color:#04342C\n  classDef datos fill:#E6F1FB,stroke:#378ADD,color:#042C53\n  classDef alerta fill:#FCEBEB,stroke:#E24B4A,color:#501313\n  classDef pendiente fill:#FAEEDA,stroke:#BA7517,color:#412402\n"}, {"titulo": "02 reglas de duplicados", "archivos": ["facturacion-pagos-ms/diagramas/02-reglas-de-duplicados.mmd", "facturacion-pagos-ms/diagramas/02-reglas-de-duplicados.png"], "imagen": "facturacion-pagos-ms/diagramas/02-reglas-de-duplicados.png", "codigo": "flowchart TD\n  A[\"<b>Emisión de comprobante<\/b>\"]:::actor --> B{\"<b>Folio ya existe?<\/b><br/>Único en base de datos\"}:::pendiente\n  B -- \"sí\" --> E1[\"<b>Conflicto<\/b><br/>No se emite\"]:::alerta\n  B -- \"no\" --> C[\"<b>Folio FAC- asignado<\/b>\"]:::servicio\n  P[\"<b>Registro de pago<\/b>\"]:::actor --> Q{\"<b>Lleva Idempotency-Key?<\/b>\"}:::pendiente\n  Q -- \"sí\" --> R[\"<b>Deduplicado<\/b><br/>Misma clave y cuerpo: misma respuesta\"]:::servicio\n  Q -- \"no\" --> S[\"<b>Sin deduplicación<\/b><br/>Dos envíos iguales registran dos pagos\"]:::alerta\n\n  classDef actor fill:#F1EFE8,stroke:#888780,color:#2C2C2A\n  classDef servicio fill:#E1F5EE,stroke:#1D9E75,color:#04342C\n  classDef datos fill:#E6F1FB,stroke:#378ADD,color:#042C53\n  classDef alerta fill:#FCEBEB,stroke:#E24B4A,color:#501313\n  classDef pendiente fill:#FAEEDA,stroke:#BA7517,color:#412402\n"}, {"titulo": "03 tasa de iva por fecha", "archivos": ["facturacion-pagos-ms/diagramas/03-tasa-de-iva-por-fecha.mmd", "facturacion-pagos-ms/diagramas/03-tasa-de-iva-por-fecha.png"], "imagen": "facturacion-pagos-ms/diagramas/03-tasa-de-iva-por-fecha.png", "codigo": "flowchart TD\n  A[\"<b>Creación del comprobante<\/b><br/>El cliente no envía la tasa\"]:::actor --> B{\"<b>Fecha del comprobante antes del 1 de noviembre de 2026?<\/b>\"}:::pendiente\n  B -- \"sí\" --> C[\"<b>Tasa general 16 %<\/b>\"]:::servicio\n  B -- \"no\" --> D[\"<b>Tasa fronteriza 8 %<\/b><br/>Todas las operaciones\"]:::servicio\n  C --> E[\"<b>El comprobante conserva la tasa<\/b>\"]:::datos\n  D --> E\n  P[\"<b>Pendiente<\/b><br/>El README dice creación; el Javadoc dice emisión. Confirmar cuál aplica\"]:::pendiente\n\n  classDef actor fill:#F1EFE8,stroke:#888780,color:#2C2C2A\n  classDef servicio fill:#E1F5EE,stroke:#1D9E75,color:#04342C\n  classDef datos fill:#E6F1FB,stroke:#378ADD,color:#042C53\n  classDef alerta fill:#FCEBEB,stroke:#E24B4A,color:#501313\n  classDef pendiente fill:#FAEEDA,stroke:#BA7517,color:#412402\n"}, {"titulo": "04 registro de pagos contra saldo", "archivos": ["facturacion-pagos-ms/diagramas/04-registro-de-pagos-contra-saldo.mmd", "facturacion-pagos-ms/diagramas/04-registro-de-pagos-contra-saldo.png"], "imagen": "facturacion-pagos-ms/diagramas/04-registro-de-pagos-contra-saldo.png", "codigo": "flowchart TD\n  A[\"<b>POST /pagos<\/b><br/>Solo FINANZAS\"]:::actor --> B{\"<b>Monto mayor al saldo?<\/b>\"}:::pendiente\n  B -- \"sí\" --> E1[\"<b>422<\/b><br/>El pago no puede exceder el saldo\"]:::alerta\n  B -- \"no\" --> C{\"<b>Monto redondea a cero?<\/b>\"}:::pendiente\n  C -- \"sí\" --> E2[\"<b>Rechazo<\/b>\"]:::alerta\n  C -- \"no\" --> D{\"<b>Fecha enviada?<\/b>\"}:::pendiente\n  D -- \"no\" --> E3[\"<b>Usa la fecha del reloj del servicio<\/b>\"]:::actor\n  D -- \"sí\" --> F[\"<b>Registra el pago<\/b>\"]:::servicio\n  E3 --> F\n  F --> G[\"<b>Saldo y estatus recalculados<\/b><br/>PENDIENTE, PARCIAL o PAGADO\"]:::datos\n  G --> H[\"<b>Evento pago-registrado<\/b><br/>facturacion-pagos.eventos, por outbox\"]:::datos\n\n  classDef actor fill:#F1EFE8,stroke:#888780,color:#2C2C2A\n  classDef servicio fill:#E1F5EE,stroke:#1D9E75,color:#04342C\n  classDef datos fill:#E6F1FB,stroke:#378ADD,color:#042C53\n  classDef alerta fill:#FCEBEB,stroke:#E24B4A,color:#501313\n  classDef pendiente fill:#FAEEDA,stroke:#BA7517,color:#412402\n"}, {"titulo": "05 idempotency key en pagos", "archivos": ["facturacion-pagos-ms/diagramas/05-idempotency-key-en-pagos.mmd", "facturacion-pagos-ms/diagramas/05-idempotency-key-en-pagos.png"], "imagen": "facturacion-pagos-ms/diagramas/05-idempotency-key-en-pagos.png", "codigo": "flowchart TD\n  A[\"<b>POST /v1/comprobantes/{id}/pagos<\/b><br/>Con Idempotency-Key\"]:::actor --> B{\"<b>La clave ya existe?<\/b>\"}:::pendiente\n  B -- \"no\" --> C[\"<b>Registra el pago<\/b>\"]:::servicio\n  C -- \"éxito\" --> D[\"<b>Guarda la respuesta 24 horas<\/b>\"]:::datos\n  C -- \"falla\" --> F[\"<b>Libera la clave<\/b>\"]:::alerta\n  B -- \"sí, petición terminada\" --> G{\"<b>Mismo cuerpo?<\/b>\"}:::pendiente\n  G -- \"sí\" --> H[\"<b>Misma respuesta original<\/b>\"]:::servicio\n  G -- \"no\" --> E1[\"<b>422<\/b>\"]:::alerta\n  B -- \"sí, en proceso\" --> I{\"<b>Pasaron 2 minutos?<\/b>\"}:::pendiente\n  I -- \"no\" --> E2[\"<b>409 conflicto-de-estado<\/b>\"]:::alerta\n  I -- \"sí\" --> J[\"<b>Retoma con la misma clave<\/b>\"]:::servicio\n\n  classDef actor fill:#F1EFE8,stroke:#888780,color:#2C2C2A\n  classDef servicio fill:#E1F5EE,stroke:#1D9E75,color:#04342C\n  classDef datos fill:#E6F1FB,stroke:#378ADD,color:#042C53\n  classDef alerta fill:#FCEBEB,stroke:#E24B4A,color:#501313\n  classDef pendiente fill:#FAEEDA,stroke:#BA7517,color:#412402\n"}, {"titulo": "arquitectura", "archivos": ["facturacion-pagos-ms/diagramas/arquitectura.mmd", "facturacion-pagos-ms/diagramas/arquitectura.png"], "imagen": "facturacion-pagos-ms/diagramas/arquitectura.png", "codigo": "flowchart LR\n  E([\"<b>Aplicaciones y gateway-ms<\/b>\"]):::actor\n  D[\"<b>dis <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
<script>
(function () {
  const D = JSON.parse(document.getElementById('datos').textContent);
  const SPEC = JSON.parse(document.getElementById('spec').textContent);
  const $ = (s) => document.querySelector(s);

  function el(tag, attrs, hijos) {
    const n = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (hijos || []).forEach(function (h) {
      if (h === null || h === undefined || h === false) return;
      n.append(h.nodeType ? h : document.createTextNode(String(h)));
    });
    return n;
  }

  function chips(lista, vacio) {
    if (!lista || !lista.length) return [el('span', { class: 'aviso', text: vacio })];
    return lista.map(function (r) { return el('span', { class: 'chip', text: r }); });
  }

  if (window.mermaid) {
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'loose',
      theme: window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default'
    });
  }

  function pintarInfo() {
    const i = D.info;
    $('#titulo').textContent = i.nombre;
    $('#descr').textContent = i.descripcion || '';
    const pild = $('#pildoras');
    [
      'Puerto ' + (i.puerto || '—'),
      'Java ' + (i.java || '—'),
      'Spring Boot ' + (i.spring_boot || '—'),
      i.endpoints ? i.endpoints + ' endpoints' : 'Sin API REST'
    ].forEach(function (t) { pild.append(el('span', { class: 'pildora', text: t })); });
    const campos = [
      ['Servicio', i.nombre],
      ['Descripción', i.descripcion || '—'],
      ['Puerto de la aplicación', i.puerto || '—'],
      ['Java', i.java || '—'],
      ['Spring Boot', i.spring_boot || '—'],
      ['Endpoints REST', i.endpoints || 'Ninguno']
    ];
    const dl = el('dl', { class: 'datos' });
    campos.forEach(function (c) {
      dl.append(el('div', {}, [el('dt', { text: c[0] }), el('dd', { text: String(c[1]) })]));
    });
    dl.append(el('div', {}, [el('dt', { text: 'Roles detectados' }),
      el('dd', {}, chips(i.roles, 'Ninguno detectado'))]));
    $('[data-panel="info"]').append(dl);
  }

  function pintarReadme() {
    const panel = $('[data-panel="readme"]');
    if (!D.readme) {
      panel.append(el('p', { class: 'aviso', text: 'Este servicio no tiene README.md.' }));
      return;
    }
    const art = el('article', { class: 'md' });
    if (window.marked) {
      art.innerHTML = marked.parse(D.readme);
    } else {
      art.append(el('pre', { text: D.readme }));
    }
    art.querySelectorAll('pre > code.language-mermaid').forEach(function (code) {
      const m = el('div', { class: 'mermaid' });
      m.dataset.src = code.textContent;
      code.parentElement.replaceWith(m);
    });
    panel.append(art);
  }

  function pintarPermisos() {
    const panel = $('[data-panel="permisos"]');
    panel.append(el('h2', { class: 'subtitulo', text: 'Roles detectados' }));
    panel.append(el('p', {}, chips(D.info.roles, 'Ninguno detectado')));
    if (!D.permisos.length) {
      panel.append(el('p', { class: 'aviso', text: 'Este servicio no expone endpoints REST, así que no tiene reglas de acceso por endpoint.' }));
      return;
    }
    const cabeza = el('tr', {}, ['Método', 'Ruta', 'Operación', 'Regla de acceso'].map(function (t) {
      return el('th', { text: t });
    }));
    const cuerpo = el('tbody');
    D.permisos.forEach(function (p) {
      cuerpo.append(el('tr', {}, [
        el('td', {}, [el('span', { class: 'verbo', text: p.verbo })]),
        el('td', { text: p.ruta }),
        el('td', { text: p.operacion }),
        el('td', { text: p.roles || 'Solo autenticación (sin @PreAuthorize)' })
      ]));
    });
    const tabla = el('table', {}, [el('thead', {}, [cabeza]), cuerpo]);
    panel.append(el('div', { class: 'tabla-wrap' }, [tabla]));
  }

  function pintarDiagramas() {
    const panel = $('[data-panel="diagramas"]');
    if (!D.diagramas.length) {
      panel.append(el('p', { class: 'aviso', text: 'Este servicio no tiene carpeta docs/diagramas.' }));
      return;
    }
    const grid = el('div', { class: 'grid-diag' });
    D.diagramas.forEach(function (d) {
      const tarjeta = el('article', { class: 'diag' });
      tarjeta.append(el('h3', { text: d.titulo }));
      if (d.imagen) {
        const img = el('img', { src: d.imagen, alt: d.titulo, loading: 'lazy' });
        img.onerror = function () {
          img.replaceWith(el('p', { class: 'aviso', text: 'No se pudo mostrar la imagen. Usa el enlace de abajo para abrir el archivo.' }));
        };
        tarjeta.append(el('a', { href: d.imagen, target: '_blank', rel: 'noopener', class: 'abrir', title: 'Abrir archivo' }, [img]));
      } else if (d.codigo) {
        const m = el('div', { class: 'mermaid' });
        m.dataset.src = d.codigo;
        tarjeta.append(m);
      }
      const pie = el('div', { class: 'pie' });
      d.archivos.forEach(function (a, idx) {
        if (idx) pie.append(' · ');
        pie.append(el('a', { href: a, target: '_blank', rel: 'noopener', text: a.split('/').pop() }));
      });
      tarjeta.append(pie);
      grid.append(tarjeta);
    });
    panel.append(grid);
  }

  async function renderMermaidIn(raiz) {
    if (!raiz) return;
    for (const nodo of raiz.querySelectorAll('.mermaid')) {
      if (nodo.dataset.ok) continue;
      const src = nodo.dataset.src || '';
      if (!window.mermaid) {
        nodo.replaceChildren(el('pre', { text: src }));
        continue;
      }
      try {
        const salida = await mermaid.render('m' + Math.random().toString(36).slice(2), src);
        nodo.innerHTML = salida.svg;
        nodo.dataset.ok = '1';
      } catch (e) {
        nodo.replaceChildren(
          el('p', { class: 'aviso', text: 'No se pudo renderizar este diagrama. Se muestra el código fuente:' }),
          el('pre', { text: src }));
      }
    }
  }

  function pintarTecnologias() {
    const panel = $('[data-panel="tecnologias"]');
    panel.append(el('p', { class: 'aviso', text: 'Herramientas de calidad y pruebas que el pom.xml de este servicio aplica. Las marcadas como no aplicadas no están configuradas.' }));
    const grid = el('div', { class: 'grid-diag' });
    D.tecnologias.forEach(function (t) {
      const tarjeta = el('article', { class: 'diag' });
      tarjeta.append(el('h3', { text: t.nombre }));
      tarjeta.append(el('p', { class: 'aviso', text: t.resumen }));
      if (t.aplicado) {
        tarjeta.append(el('a', { href: t.archivo, class: 'chip', text: 'Ver detalle →' }));
      } else {
        tarjeta.append(el('span', { class: 'chip', text: 'No aplicado' }));
      }
      grid.append(tarjeta);
    });
    panel.append(grid);
  }

  let swaggerListo = false;
  function iniciarSwagger() {
    if (swaggerListo || !SPEC || !window.SwaggerUIBundle) return;
    swaggerListo = true;
    window.ui = SwaggerUIBundle({ spec: SPEC, dom_id: '#swagger-ui', deepLinking: false, persistAuthorization: true });
  }

  function pintarApi() {
    if (SPEC) return;
    $('[data-panel="api"]').replaceChildren(el('p', { class: 'aviso', text: 'Este servicio no expone endpoints REST, así que no tiene Swagger.' }));
    $('[data-tab="api"]').hidden = true;
  }

  const botones = Array.from(document.querySelectorAll('[role="tab"]'));
  function activar(nombre, cambiarHash) {
    if (nombre === 'api' && !SPEC) nombre = 'info';
    botones.forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === nombre)); });
    document.querySelectorAll('[data-panel]').forEach(function (p) { p.hidden = p.dataset.panel !== nombre; });
    if (nombre === 'readme' || nombre === 'diagramas') renderMermaidIn(document.querySelector('[data-panel="' + nombre + '"]'));
    if (nombre === 'api') iniciarSwagger();
    if (cambiarHash) { try { history.replaceState(null, '', '#' + nombre); } catch (e) {} }
  }
  botones.forEach(function (b) { b.addEventListener('click', function () { activar(b.dataset.tab, true); }); });

  pintarInfo();
  pintarReadme();
  pintarPermisos();
  pintarDiagramas();
  pintarApi();
  pintarTecnologias();
  const inicial = location.hash.slice(1);
  activar(['info', 'readme', 'permisos', 'diagramas', 'tecnologias', 'api'].indexOf(inicial) >= 0 ? inicial : 'info', false);
})();
</script>
</body>
</html>
