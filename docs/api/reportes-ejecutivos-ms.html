<script type="application/json" id="datos">{"svc": "reportes-ejecutivos-ms", "info": {"nombre": "reportes-ejecutivos-ms", "descripcion": "Consolidado de indicadores por área, cierre de reportes por periodo y exportación.", "puerto": "8081", "java": "21", "spring_boot": "4.1.2", "endpoints": 5, "roles": ["DIRECCION", "JEFE_AREA"]}, "readme": "# reportes-ejecutivos-ms\n\n## 1. Identidad\n\n- **Nombre:** reportes-ejecutivos-ms\n- **Área de negocio:** Dirección general\n- **Acceso:** vía gateway, sin puerto publicado (contenedor: dentro del contenedor escucha en 8081)\n- **Base de datos:** `reportes`, usuario `reportes` (creados por `infra/postgres/init-databases.sh`)\n- **Versión:** 0.1.0 · Java 21 · Spring Boot 4.1.2 · PostgreSQL 17 · Kafka 4.0.0\n\n## 2. Propósito y alcance\n\nConsolida indicadores de todas las áreas por periodo, para que Dirección general los consulte, cierre reportes y los exporte.\n\nIncluye: recepción de indicadores por Kafka, consolidado por periodo con marca de desactualizado, cierre de reportes con foto inmutable y exportación en CSV, PDF y XLSX.\n\nNo incluye: la captura de datos (cada área es dueña de los suyos), cálculos contables (Contabilidad), tableros interactivos ni alertas por umbral (pendientes).\n\n## 3. Estructura del repositorio\n\n```\nreportes-ejecutivos-ms/\n├── Dockerfile                  Build multi-etapa, usuario no root\n├── docker-compose.yml          Servicio con comentarios; se incluye desde la raíz\n├── .env.example                Variables del servicio\n├── pom.xml\n├── docs/diseno.md              Diseño y decisiones\n└── src/\n    ├── main/java/.../reportes/\n    │   ├── domain/             Indicador, Reporte, Periodo, Area y reglas\n    │   ├── application/        ReportesService, puerto ExportadorReporte, FormatoExportacion\n    │   ├── infrastructure/\n    │   │   ├── exportacion/    ExportadorCsv, ExportadorPdf (OpenPDF), ExportadorXlsx (Apache POI)\n    │   │   ├── mensajeria/     ListenerIndicadores (Kafka, entrada de indicadores)\n    │   │   ├── persistence/    Entidades JPA y adaptadores\n    │   │   └── outbox/         Outbox y retransmisor a Kafka\n    │   ├── api/                ReportesControlador y ManejadorErrores (RFC 9457)\n    │   └── config/             Seguridad JWT, reloj y propiedades\n    ├── main/resources/\n    │   ├── application.yml\n    │   └── db/migration/V1__esquema_inicial.sql\n    └── test/java/.../reportes/\n        ├── domain/             PeriodoTest, ReporteTest\n        └── api/ReportesIT.java Integración con Testcontainers\n```\n\n## 4. Requisitos\n\n- macOS con Docker Desktop en ejecución.\n- JDK 21 y Maven 3.9+ (solo para correr fuera de Docker).\n- Red `empresa-net`, postgres y kafka levantados desde la raíz.\n- Valida tokens con la clave pública de usuarios-accesos-ms (JWKS), sin secreto compartido.\n\n## 5. Configuración\n\n| Variable | Obligatoria | Descripción |\n|---|---|---|\n| `REPORTES_DB_PASSWORD` | Sí (compose) | Contraseña del usuario `reportes`. |\n| `JWT_JWKS_URI` | No | URL del JWKS de usuarios-accesos-ms (clave pública). Ya viene configurada en el Compose |\n| `REPORTES_FRESCURA_DIAS` | No | Días sin actualización para marcar un indicador como desactualizado. Por omisión 7. |\n| `REPORTES_TOPICO_INDICADORES` | No | Tópico Kafka de entrada. Por omisión `indicadores-areas`. |\n\n## 6. Ejecución\n\nDesde la raíz:\n\n```bash\ndocker compose up -d postgres kafka\ncd reportes-ejecutivos-ms\ndocker compose up -d --build\ncurl -s http://localhost:8080/reportes-ejecutivos-ms/actuator/health\n```\n\n## 7. Modelo de datos\n\n| Tabla | Contenido |\n|---|---|\n| `indicadores` | Valor vigente por área, nombre y periodo. Clave única por esas tres columnas. |\n| `reportes` | Un reporte por periodo: BORRADOR o CERRADO. |\n| `reporte_indicadores` | Foto de cada indicador al cerrar el reporte. |\n| `outbox_eventos` | Eventos pendientes de enviar a Kafka. |\n\n## 8. Migraciones\n\nFlyway ejecuta `V1__esquema_inicial.sql`. Hibernate solo valida. Los cambios futuros serán migraciones nuevas.\n\n## 9. Reglas de estado\n\n**Periodos.** Formato `AAAA` (anual), `AAAA-Qn` (trimestral) o `AAAA-MM` (mensual). Otro formato responde 400.\n\n**Indicadores.** Un indicador se identifica por área, nombre y periodo. Un nuevo valor reemplaza al anterior.\n\n**Desactualizado.** Un indicador cuya fuente no se actualizó dentro de `REPORTES_FRESCURA_DIAS` aparece marcado. El cálculo se hace al momento de consultar.\n\n**Reporte.** Se abre automáticamente con el primer indicador de su periodo. Mientras es BORRADOR, el consolidado se calcula en vivo.\n\n**Cierre.** Congela una foto del consolidado. Un reporte cerrado no cambia: cerrar de nuevo responde 409, y registrar indicadores de ese periodo responde 409. Un periodo sin indicadores no se puede cerrar (422).\n\n## 10. Seguridad\n\n- API sin estado con JWT RS256. Solo `/actuator/health` es público.\n- Toda la API es de rol DIRECCION (lectura completa, carga manual y cierre), salvo `GET /indicadores`, que también acepta JEFE_AREA (ver abajo).\n- Cada área solo ve sus indicadores en el consolidado: **propuesta, pendiente**.\n\n## 11. API\n\nBase `/v1`.\n\n| Método | Ruta | Descripción | Éxito |\n|---|---|---|---|\n| POST | /indicadores | Carga o corrige un indicador (manual) | 201 |\n| GET | /indicadores?area=&periodo= | Indicadores del periodo, con marca de desactualizado. JEFE_AREA solo recibe su área y recibe 403 si pide otra | 200 |\n| GET | /reportes/{periodo} | Reporte del periodo (BORRADOR en vivo o CERRADO con foto) | 200 |\n| POST | /reportes/{periodo}/cierre | Cierra el reporte | 200 |\n| GET | /reportes/{id}/exportacion?formato=CSV\\|PDF\\|XLSX | Descarga el reporte en el formato indicado (CSV por omisión) | 200 |\n\nEjemplo de carga:\n\n```json\n{\"area\":\"OPERACIONES\",\"nombre\":\"Órdenes cerradas\",\"periodo\":\"2026-10\",\n \"valor\":12.5,\"fuenteActualizadaUtc\":\"2026-10-29T10:00:00Z\"}\n```\n\nFormatos: `CSV` (UTF-8 con BOM), `PDF` (A4 horizontal con tabla) y `XLSX` (una hoja con encabezados). El nombre del formato no distingue mayúsculas.\n\nErrores: 400 solicitud inválida o formato no soportado, 403 sin rol, 404 reporte inexistente, 409 reporte cerrado o concurrencia, 422 periodo sin indicadores. Todos en RFC 9457.\n\n## 12. Reglas de duplicados\n\nUn indicador con la misma área, nombre y periodo reemplaza al anterior; no se duplica. Las cargas simultáneas del mismo indicador se resuelven por control optimista.\n\n## 13. Eventos\n\n| Evento | Cuándo | Datos |\n|---|---|---|\n| reporte-cerrado | Al cerrar un reporte | id, periodo |\n\nEntrada: mensajes JSON en el tópico `indicadores-areas` (confirmado) con `area`, `nombre`, `periodo`, `valor` y `fuenteActualizadaUtc`. Un mensaje inválido o que viola una regla (por ejemplo, periodo cerrado) se registra en el log y se descarta.\n\nProductores activos (cada hora, recalculan el mes actual y el anterior):\n\n| Servicio | Indicador | Área |\n|---|---|---|\n| pedidos-ventas-ms | `ventas_mes` | `VENTAS_ATENCION_CLIENTES` |\n| facturacion-pagos-ms | `cobrado_mes` | `FINANZAS_CONTABILIDAD` |\n| contabilidad-ms | `polizas_mes` | `FINANZAS_CONTABILIDAD` |\n| compras-proveedores-ms | `ordenes_mes` | `COMPRAS_PROVEEDORES` |\n| compras-proveedores-ms | `ordenes_canceladas_mes` | `COMPRAS_PROVEEDORES` |\n| inventario-operaciones-ms | `movimientos_mes` | `OPERACIONES` |\n| documentos-cumplimiento-ms | `documentos_por_vencer_30d` | `ADMINISTRACION_LEGAL` |\n| clientes-ms | `clientes_nuevos_mes` | `VENTAS_ATENCION_CLIENTES` |\n| usuarios-accesos-ms | `usuarios_activos` | `ADMINISTRACION_LEGAL` |\n\nUn mismo indicador de la misma área y periodo se reemplaza en cada envío (upsert), así que los reenvíos no duplican.\n\n## 14. Outbox\n\nLos eventos se escriben en `outbox_eventos` dentro de la misma transacción y `RetransmisorOutbox` los envía a Kafka.\n\n## 15. Observabilidad\n\n- Salud: `GET /actuator/health`.\n- Métricas Prometheus: `GET /actuator/prometheus`. Contadores `indicadores_recibidos_total` y `reportes_cerrados_total`.\n- Logs JSON ECS. Indicadores descartados quedan en el log como `WARN`.\n\n## 16. Pruebas\n\n```bash\nmvn -B test     # unitarias: periodos, reglas del reporte y exportación (10)\nmvn -B verify   # además ReportesIT con PostgreSQL y Kafka reales (requiere Docker)\n```\n\nDesde la raíz, en tu Mac: `bash ejecutar-pruebas-reportes.sh`.\n\n## 17. Despliegue\n\nImagen `reportes-ejecutivos-ms:0.1.0`. Requiere red `empresa-net`, base `reportes` y clave pública JWKS. Canary según el anexo. Se despliega después de los servicios de área, porque depende de sus eventos.\n\n## 18. Rollback\n\n1. `docker compose stop reportes-ejecutivos-ms`.\n2. Regrese a la imagen anterior.\n3. Los reportes cerrados se conservan en la base de datos; no se borran al hacer rollback.\n\n## 19. Solución de problemas\n\n| Síntoma | Causa probable | Acción |\n|---|---|---|\n| 404 en `/reportes/{periodo}` | No hay indicadores para ese periodo | Cargue un indicador primero. |\n| Indicador no aparece tras el evento | Mensaje inválido o área mal escrita | Revise el log `Indicador descartado`. |\n| 409 al cargar indicador | Periodo ya cerrado | Un cierre no se reabre; cargue en el periodo siguiente. |\n| 400 al exportar | Formato distinto de CSV, PDF o XLSX | Use `formato=CSV`, `PDF` o `XLSX`. |\n\n## 20. Decisiones y pendientes\n\n- **Permisos por área:** implementados. JEFE_AREA consulta solo su área según el claim `area` del token; carga, cierre y exportación siguen solo para DIRECCION.\n- **Alertas por umbral y tableros interactivos:** pendientes, según la especificación.\n- **Descarte de mensajes inválidos:** hoy se registran y se descartan. Falta una cola de mensajes fallidos.\n- **Tópico de indicadores:** `indicadores-areas`, confirmado.\n- **Frescura:** 7 días por omisión; confirmar con Dirección.\n- **Órdenes de compra anteriores a V3:** reciben en V4 la fecha de aplicación de la migración, así que cuentan en ese mes (octubre 2026). Confirmar si el criterio es aceptable.\n\n## 21. Referencias\n\n- Diseño detallado: `docs/diseno.md`.\n- Orden de arranque: sección del README de la raíz.\n- Especificación del área: `area_md_specification_files/Reportes_Ejecutivos.md`.\n\n## Descubrimiento, gateway y monitoreo\n\n- Al arrancar, `reportes-ejecutivos-ms` se registra en `discovery-ms` (Eureka). Después queda accesible por el gateway en `http://localhost:8080/reportes-ejecutivos-ms/...`.\n- **Orden de arranque:** `discovery-ms` primero. Si este servicio arranca antes, se registra solo cuando el registro esté disponible.\n- Métricas Prometheus en `/actuator/prometheus`, sin token, solo lectura.\n- Variables `EUREKA_USUARIO` y `EUREKA_PASSWORD`: obligatorias en Docker; el Compose arma la URL de registro `http://USUARIO:CLAVE@discovery-ms:8761/eureka/`. Fuera de Docker use `EUREKA_URL=http://USUARIO:CLAVE@localhost:8761/eureka/` y `EUREKA_INSTANCIA_HOST=localhost`.\n\n## Lectura por área (JEFE_AREA)\n\n- `GET /v1/indicadores` acepta DIRECCION y JEFE_AREA.\n- DIRECCION consulta cualquier área, o todas si no envía `area`.\n- JEFE_AREA consulta solo el área del claim `area` de su token. Si no envía `area`, recibe la suya; si pide otra, recibe 403. Un token sin claim `area` válido recibe 403.\n- `GET /reportes/{periodo}` también acepta JEFE_AREA y solo incluye los indicadores de su área.\n- Carga, cierre y exportación siguen solo para DIRECCION.\n\n## Guías paso a paso\n\nProcedimientos de este servicio, publicados en HTML:\n\n- [Ejecutar las pruebas de un servicio](https://github.com/josesaid/EMPRESA_JOSESAID/blob/main/docs/guias/02-ejecutar-pruebas.html)\n- [Consultar indicadores y generar reportes](https://github.com/josesaid/EMPRESA_JOSESAID/blob/main/docs/guias/09-indicadores-y-reportes.html)\n- [Índice de todas las guías](https://github.com/josesaid/EMPRESA_JOSESAID/blob/main/docs/guias/README.html)\n", "permisos": [{"verbo": "POST", "ruta": "/v1/indicadores", "operacion": "Registrar indicador", "roles": "hasRole('DIRECCION')"}, {"verbo": "GET", "ruta": "/v1/indicadores", "operacion": "Consultar indicadores", "roles": "hasAnyRole('DIRECCION','JEFE_AREA')"}, {"verbo": "GET", "ruta": "/v1/reportes/{id}/exportacion", "operacion": "Exportar", "roles": "hasRole('DIRECCION')"}, {"verbo": "GET", "ruta": "/v1/reportes/{periodo}", "operacion": "Consultar reporte", "roles": "hasAnyRole('DIRECCION','JEFE_AREA')"}, {"verbo": "POST", "ruta": "/v1/reportes/{periodo}/cierre", "operacion": "Cerrar reporte", "roles": "hasRole('DIRECCION')"}], "diagramas": [{"titulo": "01 reglas de estado", "archivos": ["reportes-ejecutivos-ms/diagramas/01-reglas-de-estado.mmd", "reportes-ejecutivos-ms/diagramas/01-reglas-de-estado.png"], "imagen": "reportes-ejecutivos-ms/diagramas/01-reglas-de-estado.png", "codigo": "flowchart TD\n  A[\"<b>Periodo<\/b><br/>Formato AAAA<br/>Trimestre AAAA-Qn<br/>Mes AAAA-MM\"]:::actor --> B{\"<b>Formato válido?<\/b>\"}:::pendiente\n  B -- \"no\" --> C[\"<b>400<\/b><br/>Formato no soportado\"]:::alerta\n  B -- \"sí\" --> D[\"<b>Reporte BORRADOR<\/b><br/>Se abre con el primer indicador\"]:::servicio\n  D --> E[\"<b>Consolidado en vivo<\/b><br/>Se calcula al consultar\"]:::datos\n  D -- \"cerrar\" --> F{\"<b>Tiene indicadores?<\/b>\"}:::pendiente\n  F -- \"no\" --> G[\"<b>422<\/b><br/>Periodo sin indicadores\"]:::alerta\n  F -- \"sí\" --> H[\"<b>CERRADO<\/b><br/>Foto congelada del consolidado\"]:::datos\n  H -- \"cerrar otra vez o registrar indicadores\" --> I[\"<b>409<\/b><br/>Reporte cerrado\"]:::alerta\n  J[\"<b>Indicador<\/b><br/>Fuente sin actualizar\"]:::actor -- \"pasa REPORTES_FRESCURA_DIAS\" --> K[\"<b>Marcado como desactualizado<\/b>\"]:::pendiente\n\n  classDef actor fill:#F1EFE8,stroke:#888780,color:#2C2C2A\n  classDef servicio fill:#E1F5EE,stroke:#1D9E75,color:#04342C\n  classDef datos fill:#E6F1FB,stroke:#378ADD,color:#042C53\n  classDef alerta fill:#FCEBEB,stroke:#E24B4A,color:#501313\n  classDef pendiente fill:#FAEEDA,stroke:#BA7517,color:#412402\n"}, {"titulo": "02 reglas ION\"]:::alerta\n\n  classDef actor fill:#F1EFE8,stroke:#888780,color:#2C2C2A\n  classDef servicio fill:#E1F5EE,stroke:#1D9E75,color:#04342C\n  classDef datos fill:#E6F1FB,stroke:#378ADD,color:#042C53\n  classDef alerta fill:#FCEBEB,stroke:#E24B4A,color:#501313\n  classDef pendiente fill:#FAEEDA,stroke:#BA7517,color:#412402\n"}, {"titulo": "arquitectura", "archivos": ["reportes-ejecutivos-ms/diagramas/arquitectura.mmd", "reportes-ejecutivos-ms/diagramas/arquitectura.png"], "imagen": "reportes-ejecutivos-ms/diagramas/arquitectura.png", "codigo": "flowchart LR\n  E([\"<b>Aplicaciones y gateway-ms<\/b>\"]):::actor\n  D[\"<b>discovery-ms<\/b><br/>Eureka\"]:::actor\n  K[[\"<b>Kafka<\/b>\"]]:::alerta\n  subgraph SVC[\"reportes-ejecutivos-ms · 8081 interno (8109 en tu Mac)\"]\n    LIS[\"<b>ListenerIndicadores<\/b><br/>consumidor Kafka\"]:::gateway\n    API[\"<b>API REST /v1<\/b><br/>ControladorREST\"]:::gateway\n    SEG[\"<b>Seguridad JWT<\/b><br/>roles por método\"]:::seguridad\n    APP[\"<b>Servicio de aplicación<\/b><br/>casos de uso\"]:::servicio\n    EXP[\"<b>Exportación<\/b><br/>CSV · PDF · XLSX\"]:::actor\n    OUT[\"<b>Outbox<\/b><br/>outbox_eventos\"]:::infra\n    REP[\"<b>Repositorios JPA<\/b><br/>migraciones Flyway\"]:::infra\n    subgraph DOM[\"Dominio DDD (agregados y reglas)\"]\n      DM1[\"Reporte\"]:::dominio\n      DM2[\"Indicador\"]:::dominio\n      DM3[\"IndicadorConsolidado\"]:::dominio\n      DM4[\"Periodo\"]:::dominio\n    end\n  end\n  DB[(\"<b>PostgreSQL<\/b><br/>base reportes\")]:::datos\n\n  E --> API\n  API --> APP\n  API -.- SEG\n  K -- \"indicadores-areas\" --> LIS\n  LIS --> APP\n  APP --> EXP\n  APP --> OUT\n  OUT --> K\n  APP --> REP\n  REP --> DB\n  APP --> DOM\n  D -. \"registro\" .-> APP\n\n  classDef actor fill:#F1EFE8,stroke:#888780,color:#2C2C2A\n  classDef gateway fill:#EEEDFE,stroke:#7F77DD,color:#26215C\n  classDef servicio fill:#E1F5EE,stroke:#1D9E75,color:#04342C\n  classDef datos fill:#E6F1FB,stroke:#378ADD,color:#042C53\n  classDef alerta fill:#FCEBEB,stroke:#E24B4A,color:#501313\n  classDef pendiente fill:#FAEEDA,stroke:#BA7517,color:#412402\n  classDef infra fill:#FFF8DC,stroke:#E0A800,color:#4A3800\n  classDef seguridad fill:#FDF0E1,stroke:#E8870E,color:#4A2A00\n  classDef cifrado fill:#FDEEF3,stroke:#D4537E,color:#4B1528\n  classDef dominio fill:#F6EEFB,stroke:#AF52DE,color:#3A1450\n"}], "api": true}</script>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
<script>
(function () {
  const D = JSON.parse(document.getElementById('datos').textContent);
  const SPEC = JSON.parse(document.getElementById('spec').textContent);
  const $ = (s) => document.querySelector(s);

  function el(tag, attrs, hijos) {
    const n = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (hijos || []).forEach(function (h) {
      if (h === null || h === undefined || h === false) return;
      n.append(h.nodeType ? h : document.createTextNode(String(h)));
    });
    return n;
  }

  function chips(lista, vacio) {
    if (!lista || !lista.length) return [el('span', { class: 'aviso', text: vacio })];
    return lista.map(function (r) { return el('span', { class: 'chip', text: r }); });
  }

  if (window.mermaid) {
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'loose',
      theme: window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default'
    });
  }

  function pintarInfo() {
    const i = D.info;
    $('#titulo').textContent = i.nombre;
    $('#descr').textContent = i.descripcion || '';
    const pild = $('#pildoras');
    [
      'Puerto ' + (i.puerto || '—'),
      'Java ' + (i.java || '—'),
      'Spring Boot ' + (i.spring_boot || '—'),
      i.endpoints ? i.endpoints + ' endpoints' : 'Sin API REST'
    ].forEach(function (t) { pild.append(el('span', { class: 'pildora', text: t })); });
    const campos = [
      ['Servicio', i.nombre],
      ['Descripción', i.descripcion || '—'],
      ['Puerto de la aplicación', i.puerto || '—'],
      ['Java', i.java || '—'],
      ['Spring Boot', i.spring_boot || '—'],
      ['Endpoints REST', i.endpoints || 'Ninguno']
    ];
    const dl = el('dl', { class: 'datos' });
    campos.forEach(function (c) {
      dl.append(el('div', {}, [el('dt', { text: c[0] }), el('dd', { text: String(c[1]) })]));
    });
    dl.append(el('div', {}, [el('dt', { text: 'Roles detectados' }),
      el('dd', {}, chips(i.roles, 'Ninguno detectado'))]));
    $('[data-panel="info"]').append(dl);
  }

  function pintarReadme() {
    const panel = $('[data-panel="readme"]');
    if (!D.readme) {
      panel.append(el('p', { class: 'aviso', text: 'Este servicio no tiene README.md.' }));
      return;
    }
    const art = el('article', { class: 'md' });
    if (window.marked) {
      art.innerHTML = marked.parse(D.readme);
    } else {
      art.append(el('pre', { text: D.readme }));
    }
    art.querySelectorAll('pre > code.language-mermaid').forEach(function (code) {
      const m = el('div', { class: 'mermaid' });
      m.dataset.src = code.textContent;
      code.parentElement.replaceWith(m);
    });
    panel.append(art);
  }

  function pintarPermisos() {
    const panel = $('[data-panel="permisos"]');
    panel.append(el('h2', { class: 'subtitulo', text: 'Roles detectados' }));
    panel.append(el('p', {}, chips(D.info.roles, 'Ninguno detectado')));
    if (!D.permisos.length) {
      panel.append(el('p', { class: 'aviso', text: 'Este servicio no expone endpoints REST, así que no tiene reglas de acceso por endpoint.' }));
      return;
    }
    const cabeza = el('tr', {}, ['Método', 'Ruta', 'Operación', 'Regla de acceso'].map(function (t) {
      return el('th', { text: t });
    }));
    const cuerpo = el('tbody');
    D.permisos.forEach(function (p) {
      cuerpo.append(el('tr', {}, [
        el('td', {}, [el('span', { class: 'verbo', text: p.verbo })]),
        el('td', { text: p.ruta }),
        el('td', { text: p.operacion }),
        el('td', { text: p.roles || 'Solo autenticación (sin @PreAuthorize)' })
      ]));
    });
    const tabla = el('table', {}, [el('thead', {}, [cabeza]), cuerpo]);
    panel.append(el('div', { class: 'tabla-wrap' }, [tabla]));
  }

  function pintarDiagramas() {
    const panel = $('[data-panel="diagramas"]');
    if (!D.diagramas.length) {
      panel.append(el('p', { class: 'aviso', text: 'Este servicio no tiene carpeta docs/diagramas.' }));
      return;
    }
    const grid = el('div', { class: 'grid-diag' });
    D.diagramas.forEach(function (d) {
      const tarjeta = el('article', { class: 'diag' });
      tarjeta.append(el('h3', { text: d.titulo }));
      if (d.imagen) {
        const img = el('img', { src: d.imagen, alt: d.titulo, loading: 'lazy' });
        img.onerror = function () {
          img.replaceWith(el('p', { class: 'aviso', text: 'No se pudo mostrar la imagen. Usa el enlace de abajo para abrir el archivo.' }));
        };
        tarjeta.append(el('a', { href: d.imagen, target: '_blank', rel: 'noopener', class: 'abrir', title: 'Abrir archivo' }, [img]));
      } else if (d.codigo) {
        const m = el('div', { class: 'mermaid' });
        m.dataset.src = d.codigo;
        tarjeta.append(m);
      }
      const pie = el('div', { class: 'pie' });
      d.archivos.forEach(function (a, idx) {
        if (idx) pie.append(' · ');
        pie.append(el('a', { href: a, target: '_blank', rel: 'noopener', text: a.split('/').pop() }));
      });
      tarjeta.append(pie);
      grid.append(tarjeta);
    });
    panel.append(grid);
  }

  async function renderMermaidIn(raiz) {
    if (!raiz) return;
    for (const nodo of raiz.querySelectorAll('.mermaid')) {
      if (nodo.dataset.ok) continue;
      const src = nodo.dataset.src || '';
      if (!window.mermaid) {
        nodo.replaceChildren(el('pre', { text: src }));
        continue;
      }
      try {
        const salida = await mermaid.render('m' + Math.random().toString(36).slice(2), src);
        nodo.innerHTML = salida.svg;
        nodo.dataset.ok = '1';
      } catch (e) {
        nodo.replaceChildren(
          el('p', { class: 'aviso', text: 'No se pudo renderizar este diagrama. Se muestra el código fuente:' }),
          el('pre', { text: src }));
      }
    }
  }

  let swaggerListo = false;
  function iniciarSwagger() {
    if (swaggerListo || !SPEC || !window.SwaggerUIBundle) return;
    swaggerListo = true;
    window.ui = SwaggerUIBundle({ spec: SPEC, dom_id: '#swagger-ui', deepLinking: false, persistAuthorization: true });
  }

  function pintarApi() {
    if (SPEC) return;
    $('[data-panel="api"]').replaceChildren(el('p', { class: 'aviso', text: 'Este servicio no expone endpoints REST, así que no tiene Swagger.' }));
    $('[data-tab="api"]').hidden = true;
  }

  const botones = Array.from(document.querySelectorAll('[role="tab"]'));
  function activar(nombre, cambiarHash) {
    if (nombre === 'api' && !SPEC) nombre = 'info';
    botones.forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === nombre)); });
    document.querySelectorAll('[data-panel]').forEach(function (p) { p.hidden = p.dataset.panel !== nombre; });
    if (nombre === 'readme' || nombre === 'diagramas') renderMermaidIn(document.querySelector('[data-panel="' + nombre + '"]'));
    if (nombre === 'api') iniciarSwagger();
    if (cambiarHash) { try { history.replaceState(null, '', '#' + nombre); } catch (e) {} }
  }
  botones.forEach(function (b) { b.addEventListener('click', function () { activar(b.dataset.tab, true); }); });

  pintarInfo();
  pintarReadme();
  pintarPermisos();
  pintarDiagramas();
  pintarApi();
  const inicial = location.hash.slice(1);
  activar(['info', 'readme', 'permisos', 'diagramas', 'api'].indexOf(inicial) >= 0 ? inicial : 'info', false);
})();
</script>
</body>
</html>
