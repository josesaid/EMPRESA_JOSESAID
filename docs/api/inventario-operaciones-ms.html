<script type="application/json" id="datos">{"svc": "inventario-operaciones-ms", "info": {"nombre": "inventario-operaciones-ms", "descripcion": "Existencias por almacén, reservas, lotes con trazabilidad y órdenes de producción o servicio.", "puerto": "8081", "java": "21", "spring_boot": "4.1.2", "endpoints": 9, "roles": ["ALMACEN", "CALIDAD", "COMPRAS", "OPERACIONES", "VENTAS"]}, "readme": "# inventario-operaciones-ms\n\nMicroservicio del área **Operaciones** de EMPRESA_JOSESAID. Controla existencias por almacén, reservas para ventas, lotes con trazabilidad y órdenes de producción o de servicio.\n\n## 1. Identidad\n\n- **Servicio:** inventario-operaciones-ms · **Versión:** 0.1.0 · **Lenguaje:** Java 21 · **Framework:** Spring Boot 4.1.2\n- **Acceso:** vía gateway, sin puerto publicado (contenedor: contenedor: 8081) · **Base de datos:** `inventario`\n- **Responsable:** pendiente de asignar · **Estado:** funcional; producción vs. servicio pendiente de confirmar (sección 20)\n\n## 2. Propósito y alcance\n\nRegistra entradas, salidas, ajustes y reservas de inventario; controla órdenes de producción o de servicio; y permite consultar la trazabilidad de cada lote.\n\n**Dentro del alcance:** artículos, almacenes, existencias, reservas, lotes, órdenes y eventos de bajo mínimo.\n\n**Fuera del alcance:** compras a proveedores (compras-proveedores-ms), facturación (facturacion-pagos-ms) y reportes consolidados (reportes-ejecutivos-ms).\n\n## 3. Estructura del repositorio\n\n```\ninventario-operaciones-ms/\n├── pom.xml\n├── Dockerfile\n├── docker-compose.yml          Servicio, con comentarios\n├── .env.example                Variables requeridas (sin valores reales)\n├── docs/diseno.md              Diseño técnico\n├── src/main/java/.../inventario/\n│   ├── domain/                 Existencia, MovimientoInventario, Articulo, OrdenOperacion y puertos\n│   ├── application/            InventarioService y publicador de eventos\n│   ├── infrastructure/\n│   │   ├── persistence/        Entidades JPA y adaptadores\n│   │   └── outbox/             Outbox y retransmisor a Kafka\n│   ├── api/                    Controlador REST y manejo de errores\n│   └── config/                 Seguridad JWT, reloj y propiedades\n└── src/test/java/...           Pruebas unitarias e integración\n```\n\n## 4. Requisitos\n\n- JDK 21 y Maven 3.9 (solo para compilar fuera de Docker)\n- Docker Desktop con Compose v2\n- Red `empresa-net`: `docker network create empresa-net` (una sola vez)\n\n## 5. Configuración\n\n| Variable | Obligatoria | Descripción |\n|---|---|---|\n| `INVENTARIO_DB_PASSWORD` | Sí (Compose) | Contraseña del usuario `inventario`. En el `.env` de la raíz o de esta carpeta. |\n| `JWT_JWKS_URI` | No | URL del JWKS de usuarios-accesos-ms (clave pública). Ya viene configurada en el Compose |\n| `KAFKA_BOOTSTRAP` | No | Por defecto `localhost:9092`. En Compose: `kafka:29092`. |\n| `OUTBOX_INTERVALO_MS` | No | Intervalo del retransmisor. Por defecto 5000. |\n\nLas credenciales viven solo en `.env`, que está en `.gitignore`.\n\n## 6. Ejecución\n\n**Orden de arranque (obligatorio):**\n\n1. Red: `docker network create empresa-net` (una sola vez)\n2. Raíz: `docker compose up -d postgres kafka`\n3. **usuarios-accesos-ms** primero, porque emite los tokens que este servicio valida\n4. **inventario-operaciones-ms** (este servicio). Puede arrancar en cualquier orden respecto de los demás servicios de negocio.\n\n```bash\ncd inventario-operaciones-ms\ndocker compose up -d --build\ncurl -s http://localhost:8080/inventario-operaciones-ms/actuator/health\n```\n\n## 7. Modelo de datos\n\n- **articulos:** id, sku (único), nombre, unidad, lote_obligatorio, minimo.\n- **almacenes:** id, nombre, ubicacion.\n- **existencias:** id, articulo_id, almacen_id (único por par), cantidad, reservado, version. `disponible = cantidad - reservado`.\n- **movimientos_inventario:** id, articulo_id, almacen_id, tipo, cantidad, lote, referencia, creado_utc. Inmutables.\n- **ordenes_operacion:** id, tipo (PRODUCCION, SERVICIO), estatus (ABIERTA, CERRADA), cantidad_objetivo, cantidad_real, version.\n- **outbox_eventos:** id, tipo, agregado_id, payload, creado_utc, publicado_utc, intentos.\n\nLas cantidades son `NUMERIC(14,3)` para admitir fracciones.\n\n## 8. Migraciones\n\nFlyway ejecuta `V1__esquema_inicial.sql`. Hibernate solo valida. Los cambios futuros van en `V2`, `V3`…, nunca editando las migraciones ya aplicadas.\n\n## 9. Máquinas de estado\n\n**Orden de operación:** `ABIERTA → CERRADA`. El cierre exige cantidad real mayor a cero. Una orden cerrada no se vuelve a cerrar.\n\n**Existencia:** no tiene estado, pero aplica estas reglas en cada movimiento:\n- La existencia nunca es negativa.\n- Lo reservado nunca supera lo existente.\n- Una salida o reserva no puede exceder lo disponible.\n- Un ajuste no puede dejar la existencia negativa ni por debajo de lo reservado.\n\n## 10. Seguridad\n\n- JWT RS256 emitido por usuarios-accesos-ms. Solo `/actuator/health` es público.\n- **ALMACEN:** registra movimientos y da de alta almacenes.\n- **OPERACIONES:** da de alta artículos, abre y cierra órdenes, y consulta trazabilidad.\n- **CALIDAD:** consulta trazabilidad.\n- **COMPRAS** y **VENTAS:** solo consultan existencias.\n\n## 11. API\n\nBase: `/v1`\n\n| Método | Ruta | Rol | Éxito | Errores |\n|---|---|---|---|---|\n| POST | `/articulos` (añadido) | OPERACIONES | 201 | 400, 409 |\n| POST | `/almacenes` (añadido) | ALMACEN | 201 | 400 |\n| POST | `/movimientos` | ALMACEN | 201 | 400 (lote faltante), 404, 409 (existencia insuficiente), 422 |\n| GET | `/existencias?articulo=` | ALMACEN, COMPRAS, VENTAS | 200 | 404 |\n| POST | `/ordenes-operacion` | OPERACIONES | 201 | 400, 422 |\n| POST | `/ordenes-operacion/{id}/cierre` | OPERACIONES | 200 | 404, 409, 422 |\n| GET | `/lotes/{lote}/trazabilidad` | OPERACIONES, CALIDAD | 200 | 404 |\n\nEjemplo de entrada con lote:\n\n```json\n{ \"articuloId\": \"<UUID>\", \"almacenId\": \"<UUID>\", \"tipo\": \"ENTRADA\", \"cantidad\": 20, \"lote\": \"LOTE-A\" }\n```\n\nErrores RFC 9457 con `type` `urn:josesaid:inventario-operaciones:error:<slug>`.\n\n## 12. Reglas de duplicados\n\n- SKU único: un duplicado responde 409.\n- Un par artículo-almacén tiene una sola fila de existencia.\n- Dos movimientos iguales registran dos movimientos, salvo que se envíe `Idempotency-Key` (ver Idempotencia de altas).\n- Edición concurrente de una existencia responde 409 (`conflicto-concurrencia`).\n\n## 13. Eventos\n\nTópico `inventario.eventos`, clave = id del artículo o de la orden.\n\n| Tipo | Cuándo | Datos |\n|---|---|---|\n| `existencia-bajo-minimo` | Una salida o ajuste deja la existencia por debajo del mínimo del artículo | articulo_id, almacen_id, cantidad |\n| `orden-operacion-cerrada` | Al cerrar una orden | id, cantidad_real |\n\n## 14. Outbox\n\nEl evento se guarda en `outbox_eventos` dentro de la misma transacción que el movimiento o el cierre. El retransmisor lo envía a Kafka en orden y se detiene en el primer fallo.\n\n## 15. Observabilidad\n\n- Salud: `GET /actuator/health`. Métricas: `GET /actuator/prometheus`.\n- Logs JSON en formato ECS.\n- Pendiente: métricas de negocio (`movimientos_total`, `existencia_bajo_minimo_total`) y trazas.\n\n## 16. Pruebas\n\n- Unitarias (11): reglas de existencia y reserva, cierre de órdenes y reglas del servicio con repositorios en memoria.\n- Integración (1): PostgreSQL 17 y Kafka 4.0.0 con Testcontainers. Cubre lote obligatorio (400), existencia insuficiente (409), reserva, trazabilidad y cierre de orden.\n\n```bash\nmvn -B verify              # requiere Docker\nmvn -B package -DskipITs   # solo unitarias\n```\n\n## 17. Despliegue\n\nImagen multi-etapa, usuario sin privilegios (uid 10001), `HEALTHCHECK` sobre `/actuator/health`. Despliegue con `docker compose up -d --build`.\n\n## 18. Rollback\n\nLas migraciones no revierten solas. Para volver atrás, despliega la imagen anterior compatible con el esquema actual. Las correcciones de inventario se hacen con movimientos de compensación, nunca borrando.\n\n## 19. Solución de problemas\n\n- **400 \"requiere lote\":** el artículo tiene lote obligatorio. Envía el campo `lote`.\n- **409 \"Existencia insuficiente\":** consulta `GET /existencias` para ver lo disponible.\n- **409 \"conflicto-concurrencia\":** dos operaciones tocaron la misma existencia. Reintenta.\n- **422 en el cierre:** la cantidad real debe ser mayor a cero.\n\n## 20. Decisiones y pendientes\n\n- **Añadido a la especificación:** `POST /articulos` y `POST /almacenes`, sin los cuales el servicio no puede usarse.\n- **Añadido:** el campo `lote` en movimientos y el campo `minimo` en artículos, necesarios para trazabilidad y para el evento de bajo mínimo.\n- **Decisión:** `AJUSTE` acepta cantidades negativas. Los demás tipos son siempre positivos.\n- **Pendiente:** confirmar si el área maneja producción, servicio o ambos.\n- **Pendiente:** entidad de lote con liberación; hoy un lote solo se identifica en los movimientos.\n- **Pendiente:** liberar reservas. Hoy una reserva se mantiene hasta que la operación la consume.\n- **Pendiente:** recepción automática desde compras y reserva automática desde ventas (eventos).\n- **Pendiente:** conteo cíclico con dispositivos móviles e integración con sensores.\n- **Pendiente:** métricas de negocio.\n\n## 21. Referencias\n\n- Especificación del área: `area_md_specification_files/Inventario_Operaciones.md`\n- Diseño técnico: `docs/diseno.md`\n- Orden de arranque general: `README.md` de la raíz, sección 10\n\n## Descubrimiento, gateway y monitoreo\n\n- Al arrancar, `inventario-operaciones-ms` se registra en `discovery-ms` (Eureka). Después queda accesible por el gateway en `http://localhost:8080/inventario-operaciones-ms/...`.\n- **Orden de arranque:** `discovery-ms` primero. Si este servicio arranca antes, se registra solo cuando el registro esté disponible.\n- Métricas Prometheus en `/actuator/prometheus`, sin token, solo lectura.\n- Variables `EUREKA_USUARIO` y `EUREKA_PASSWORD`: obligatorias en Docker; el Compose arma la URL de registro `http://USUARIO:CLAVE@discovery-ms:8761/eureka/`. Fuera de Docker use `EUREKA_URL=http://USUARIO:CLAVE@localhost:8761/eureka/` y `EUREKA_INSTANCIA_HOST=localhost`.\n\n\n## Idempotencia de altas (`Idempotency-Key`)\n\nEl alta de `POST /v1/movimientos` acepta la cabecera opcional `Idempotency-Key`. Úsela cuando un reintento no debe crear el registro dos veces (por ejemplo, si se cortó la conexión y no sabe si la petición llegó).\n\n- **Misma clave y mismo cuerpo:** responde la misma respuesta original; no se crea nada nuevo.\n- **Misma clave con otro cuerpo:** responde `422` (`regla-de-negocio`).\n- **Misma clave mientras la primera petición sigue en proceso:** responde `409` (`conflicto-de-estado`).\n- **Sin la cabecera:** la petición se procesa como siempre.\n\nLas respuestas completadas se guardan 24 horas en la tabla `idempotencia`. Si la operación falla, la clave se libera para que el cliente pueda reintentar. Si la petición se interrumpe a medio camino y la clave queda en proceso, un nuevo intento con la misma clave la retoma pasados 2 minutos; antes de eso responde 409.\n\n\n## Indicadores para reportes ejecutivos\n\nPublica un indicador mensual al tópico `indicadores-areas`, que consume `reportes-ejecutivos-ms`.\n\n- **Indicador:** `movimientos_mes` (área `OPERACIONES`).\n- **Definición:** Número de movimientos de inventario del mes, por hora de la Ciudad de México.\n- **Clave del mensaje:** `OPERACIONES|movimientos_mes|AAAA-MM`. Reportes actualiza el valor por área, nombre y periodo (upsert).\n- **Ciclo:** recalcula el mes actual y el anterior cada 60 minutos; el primer envío ocurre a los 30 segundos.\n- **Configuración:** `INDICADORES_TOPICO`, `INDICADORES_INTERVALO_MS`, `INDICADORES_INICIO_MS`.\n- **Entrega:** no pasa por el outbox. Es una foto del periodo; si un envío falla, el siguiente ciclo lo corrige.\n- **Clase:** `PublicadorIndicadoresMovimientos`. Prueba: `mvn verify -Dit.test='PublicadorIndicadores*IT'`.\n\n## Guías paso a paso\n\nProcedimientos de este servicio, publicados en HTML:\n\n- [Ejecutar las pruebas de un servicio](https://github.com/josesaid/EMPRESA_JOSESAID/blob/main/docs/guias/02-ejecutar-pruebas.html)\n- [Índice de todas las guías](https://github.com/josesaid/EMPRESA_JOSESAID/blob/main/docs/guias/README.html)\n", "permisos": [{"verbo": "POST", "ruta": "/v1/almacenes", "operacion": "Crear almacen", "roles": "hasRole('ALMACEN')"}, {"verbo": "POST", "ruta": "/v1/articulos", "operacion": "Crear articulo", "roles": "hasRole('OPERACIONES')"}, {"verbo": "GET", "ruta": "/v1/articulos/bajo-minimo", "operacion": "Articulos bajo minimo", "roles": "hasAnyRole('ALMACEN','COMPRAS')"}, {"verbo": "GET", "ruta": "/v1/existencias", "operacion": "Existencias", "roles": "hasAnyRole('ALMACEN','COMPRAS','VENTAS')"}, {"verbo": "GET", "ruta": "/v1/lotes/{lote}/trazabilidad", "operacion": "Trazabilidad", "roles": "hasAnyRole('OPERACIONES','CALIDAD')"}, {"verbo": "POST", "ruta": "/v1/movimientos", "operacion": "Registrar movimiento", "roles": "hasRole('ALMACEN')"}, {"verbo": "GET", "ruta": "/v1/movimientos", "operacion": "Movimientos de articulo", "roles": "hasAnyRole('ALMACEN','COMPRAS')"}, {"verbo": "POST", "ruta": "/v1/ordenes-operacion", "operacion": "Crear orden", "roles": "hasRole('OPERACIONES')"}, {"verbo": "POST", "ruta": "/v1/ordenes-operacion/{id}/cierre", "operacion": "Cerrar orden", "roles": "hasRole('OPERACIONES')"}], "diagramas": [{"titulo": "01 maquina de estados orden", "archivos": ["inventario-operaciones-ms/diagramas/01-maquina-de-estados-orden.mmd", "inventario-operaciones-ms/diagramas/01-maquina-de-estados-orden.png"], "imagen": "inventario-operaciones-ms/diagramas/01-maquina-de-estados-orden.png", "codigo": "flowchart LR\n  A[\"<b>Alta de orden<\/b><br/>Cantidad objetivo mayor a cero\"]:::actor --> B[\"<b>ABIERTA<\/b>\"]:::servicio\n  B -- \"cierre con cantidad real\" --> C[\"<b>CERRADA<\/b><br/>Estado final\"]:::datos\n  B -- \"cierre sin cantidad real\" --> E[\"<b>422<\/b><br/>Cerrar requiere la cantidad producida o el servicio completado\"]:::alerta\n  C -- \"cerrar otra vez\" --> F[\"<b>409<\/b><br/>La orden ya está cerrada\"]:::alerta\n\n  classDef actor fill:#F1EFE8,stroke:#888780,color:#2C2C2A\n  classDef servicio fill:#E1F5EE,stroke:#1D9E75,color:#04342C\n  classDef datos fill:#E6F1FB,stroke:#378ADD,color:#042C53\n  classDef alerta fill:#FCEBEB,stroke:#E24B4A,color:#501313\n  classDef pendiente fill:#FAEEDA,stroke:#BA7517,color:#412402\n"}, {"titulo": "02 maquina de estados existencia", "archivos": ["inventario-operaciones-ms/diagramas/02-maquina-de-estados-existencia.mmd", "inventario-operaciones-ms/diagramas/02-maquina-de-estados-existencia.png"], "imagen": "inventario-operaciones-ms/diagramas/02-maquina-de-estados-existencia.png", "codigo": "flowchart TD\n  A[\"<b>Movimiento<\/b><br/>Entrada, salida, reserva o ajuste\"]:::actor --> B{\"<b>Tipo de movimiento<\/b>\"}:::pendiente\n  B -- \"entrada\" --> C[\"<b>Suma a la existencia<\/b>\"]:::servicio\n  B -- \"salida o reserva\" --> D{\"<b>Cabe en lo disponible?<\/b>\"}:::pendiente\n  D -- \"no\" --> E[\"<b>409<\/b><br/>Existencia insuficiente\"]:::alerta\n  D -- \"sí\" --> F[\"<b>Descuenta o reserva<\/b>\"]:::servicio\n  B -- \"ajuste\" --> G{\"<b>Deja la existencia sin negativos y sin bajar de lo reservado?<\/b>\"}:::pendiente\n  G -- \"no\" --> H[\"<b>409<\/b><br/>El ajuste no es válido\"]:::alerta\n  G -- \"sí\" --> I[\"<b>Aplica el ajuste<\/b>\"]:::servicio\n  F --> J{\"<b>Queda bajo el mínimo?<\/b>\"}:::pendiente\n  I --> J\n  J -- \"sí\" --> K[\"<b>Evento existencia-bajo-minimo<\/b>\"]:::datos\n\n  classDef actor fill:#F1EFE8,stroke:#888780,color:#2C2C2A\n  classDef servicio fill:#E1F5EE,stroke:#1D9E75,color:#04342C\n  classDef datos fill:#E6F1FB,stroke:#378ADD,color:#042C53\n  classDef alerta fill:#FCEBEB,stroke:#E24B4A,color:#501313\n  classDef pendiente fill:#FAEEDA,stroke:#BA7517,color:#412402\n"}, {"titulo": "03 reglas de duplicados", "archivos": ["inventario-operaciones-ms/diagramas/03-reglas-de-duplicados.mmd", "inventario-operaciones-ms/diagramas/03-reglas-de-duplicados.png"], "imagen": "inventario-operaciones-ms/diagramas/03-reglas-de-duplicados.png", "codigo": "flowchart TD\n  A[\"<b>Alta de artículo<\/b><br/>Con SKU\"]:::actor --> B{\"<b>Ya existe ese SKU?<\/b>\"}:::pendiente\n  B -- \"no\" --> C[\"<b>Crea el artículo<\/b>\"]:::servicio\n  B -- \"sí\" --> D[\"<b>409<\/b><br/>SKU duplicado\"]:::alerta\n  E[\"<b>Movimiento<\/b><br/>Artículo y almacén\"]:::actor --> F{\"<b>Ya existe la fila de existencia?<\/b>\"}:::pendiente\n  F -- \"no\" --> G[\"<b>Crea la fila<\/b><br/>Una sola por par\"]:::servicio\n  F -- \"sí\" --> H[\"<b>Usa la fila existente<\/b>\"]:::servicio\n  H --> I[\"<b>Sin Idempotency-Key<\/b><br/>Dos movimientos iguales registran dos movimientos\"]:::alerta\n\n  classDef actor fill:#F1EFE8,stroke:#888780,color:#2C2C2A\n  classDef servicio fill:#E1F5EE,stroke:#1D9E75,color:#04342C\n  classDef datos fill:#E6F1FB,stroke:#378ADD,color:#042C53\n  classDef alerta fill:#FCEBEB,stroke:#E24B4A,color:#501313\n  classDef pendiente fill:#FAEEDA,stroke:#BA7517,color:#412402\n"}, {"titulo": "04 idempotency key en movimientos", "archivos": ["inventario-operaciones-ms/diagramas/04-idempotency-key-en-movimientos.mmd", "inventario-operaciones-ms/diagramas/04-idempotency-key-en-movimientos.png"], "imagen": "inventario-operaciones-ms/diagramas/04-idempotency-key-en-movimientos.png", "codigo": "flowchart TD\n  A[\"<b>POST /v1/movimientos<\/b><br/>Con Idempotency-Key\"]:::actor --> B{\"<b>La clave ya existe?<\/b>\"}:::pendiente\n  B -- \"no\" --> C[\"<b>Registra el movimiento<\/b>\"]:::servicio\n  C -- \"éxito\" --> D[\"<b>Guarda la respuesta 24 horas<\/b><br/>Tabla idempotencia\"]:::datos\n  C -- \"falla\" --> F[\"<b>Libera la clave<\/b><br/>El cliente puede reintentar\"]:::alerta\n  B -- \"sí, la original ya terminó\" --> G{\"<b>Mismo cuerpo?<\/b>\"}:::pendiente\n  G -- \"sí\" --> H[\"<b>Misma respuesta original<\/b><br/>No se crea nada nuevo\"]:::servicio\n  G -- \"no\" --> E1[\"<b>422<\/b><br/>La clave ya se usó con otro cuerpo\"]:::alerta\n  B -- \"sí, sigue en proceso\" --> I{\"<b>Pasaron 2 minutos?<\/b>\"}:::pendiente\n  I -- \"no\" --> E2[\"<b>409<\/b><br/>La petición sigue en proceso\"]:::alerta\n  I -- \"sí\" --> J[\"<b>Retoma con la misma clave<\/b>\"]:::servicio\n  A -. \"sin cabecera\" .-> K[\"<b>Se procesa como siempre<\/b>\"]:::actor\n\n  classDef actor fill:#F1EFE8,stroke:#888780,color:#2C2C2A\n  classDef servicio fill:#E1F5EE,stroke:#1D9E75,color:#04342C\n  classDef datos fill:#E6F1FB,stroke:#378ADD,color:#042C53\n  classDef alerta fill:#FCEBEB,stroke:#E24B4A,color:#501313\n  classDef pendiente fill:#FAEEDA,stroke:#BA7517,color:#412402\n"}, {"titulo": "arquitectura", "archivos": ["inventario-operaciones-ms/diagramas/arquitectura.mmd", "inventario-operaciones-ms/diagramas/arquitectura.png"], "imagen": "inventario-operaciones-ms/diagramas/arquitectura.png", "codigo": "flowchart LR\n  E([\"<b>Aplicaciones y gateway-ms<\/b>\"]):::actor\n  D[\"<b>discovery-ms<\/b><br/>Eureka\"]:::actor\n  subgraph SVC[\"inventario-operaciones-ms · 8081 interno (8105 en tu Mac)\"]\n    API[\"<b>API REST /v1<\/b><br/>ControladorREST\"]:::gateway\n    SEG[\"<b>Seguridad JWT<\/b><br/>roles por método\"]:::seguridad\n    APP[\"<b>Servicio de aplicación<\/b><br/>casos de uso\"]:::servicio\n    REP[\"<b>Repositorios JPA<\/b><br/>migraciones Flyway\"]:::infra\n    OUT[\"<b>Outbox<\/b><br/>outbox_eventos\"]:::infra\n    subgraph DOM[\"Dominio DDD (agregados y reglas)\"]\n      DM1[\"Articulo\"]:::dominio\n      DM2[\"Almacen\"]:::dominio\n      DM3[\"Existencia\"]:::dominio\n      DM4[\"OrdenOperacion\"]:::dominio\n      DM5[\"MovimientoInventario\"]:::dominio\n    end\n  end\n  DB[(\"<b>PostgreSQL<\/b><br/>base inventario\")]:::datos\n  K[[\"<b>Kafka<\/b>\"]]:::alerta\n\n  E --> API\n  API --> APP\n  API -.- SEG\n  APP --> REP\n  REP --> DB\n  APP --> OUT\n  OUT --> K\n  APP --> DOM\n  D -. \"registro\" .-> APP\n\n  classDef actor fill:#F1EFE8,stroke:#888780,color:#2C2C2A\n  classDef gateway fill:#EEEDFE,stroke:#7F77DD,color:#26215C\n  classDef servicio fill:#E1F5EE,stroke:#1D9E75,color:#04342C\n  classDef datos fill:#E6F1FB,stroke:#378ADD,color:#042C53\n  classDef alerta fill:#FCEBEB,stroke:#E24B4A,color:#501313\n  classDef pendiente fill:#FAEEDA,stroke:#BA7517,color:#412402\n  classDef infra fill:#FFF8DC,stroke:#E0A800,color:#4A3800\n  classDef seguridad fill:#FDF0E1,stroke:#E8870E,color:#4A2A00\n  classDef cifrado fill:#FDEEF3,stroke:#D4537E,color:#4B1528\n  classDef dominio fill:#F6EEFB,stroke:#AF52DE,color:#3A1450\n"}], "api": true, "tecnologias": [{"id": "pruebas", "nombre": "Pruebas automatizadas", "resumen": "Pruebas unitarias y de integración con JUnit 5. Surefire ejecuta las unitarias y Failsafe las de integración.", "aplicado": true, "archivo": "inventario-operaciones-ms/tecnologias/pruebas.html"}, {"id": "checkstyle", "nombre": "Checkstyle", "resumen": "Revisa convenciones de estilo del código Java (nombres, tamaños de métodos, imports) contra un conjunto de reglas.", "aplicado": true, "archivo": "inventario-operaciones-ms/tecnologias/checkstyle.html"}, {"id": "pmd", "nombre": "PMD", "resumen": "Busca patrones problemáticos en el código: variables sin uso, bloques vacíos y complejidad excesiva.", "aplicado": true, "archivo": "inventario-operaciones-ms/tecnologias/pmd.html"}, {"id": "spotbugs", "nombre": "SpotBugs", "resumen": "Analiza el bytecode para detectar errores probables: referencias nulas, recursos sin cerrar y problemas de concurrencia.", "aplicado": true, "archivo": "inventario-operaciones-ms/tecnologias/spotbugs.html"}, {"id": "jacoco", "nombre": "JaCoCo", "resumen": "Mide la cobertura de pruebas (líneas y ramas) y puede fallar el build si no se alcanza el mínimo configurado.", "aplicado": true, "archivo": "inventario-operaciones-ms/tecnologias/jacoco.html"}, {"id": "javadoc", "nombre": "Javadoc", "resumen": " <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
<script>
(function () {
  const D = JSON.parse(document.getElementById('datos').textContent);
  const SPEC = JSON.parse(document.getElementById('spec').textContent);
  const $ = (s) => document.querySelector(s);

  function el(tag, attrs, hijos) {
    const n = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (hijos || []).forEach(function (h) {
      if (h === null || h === undefined || h === false) return;
      n.append(h.nodeType ? h : document.createTextNode(String(h)));
    });
    return n;
  }

  function chips(lista, vacio) {
    if (!lista || !lista.length) return [el('span', { class: 'aviso', text: vacio })];
    return lista.map(function (r) { return el('span', { class: 'chip', text: r }); });
  }

  if (window.mermaid) {
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'loose',
      theme: window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default'
    });
  }

  function pintarInfo() {
    const i = D.info;
    $('#titulo').textContent = i.nombre;
    $('#descr').textContent = i.descripcion || '';
    const pild = $('#pildoras');
    [
      'Puerto ' + (i.puerto || '—'),
      'Java ' + (i.java || '—'),
      'Spring Boot ' + (i.spring_boot || '—'),
      i.endpoints ? i.endpoints + ' endpoints' : 'Sin API REST'
    ].forEach(function (t) { pild.append(el('span', { class: 'pildora', text: t })); });
    const campos = [
      ['Servicio', i.nombre],
      ['Descripción', i.descripcion || '—'],
      ['Puerto de la aplicación', i.puerto || '—'],
      ['Java', i.java || '—'],
      ['Spring Boot', i.spring_boot || '—'],
      ['Endpoints REST', i.endpoints || 'Ninguno']
    ];
    const dl = el('dl', { class: 'datos' });
    campos.forEach(function (c) {
      dl.append(el('div', {}, [el('dt', { text: c[0] }), el('dd', { text: String(c[1]) })]));
    });
    dl.append(el('div', {}, [el('dt', { text: 'Roles a usar' }),
      el('dd', {}, chips(i.roles, 'Ninguno detectado'))]));
    $('[data-panel="info"]').append(dl);
  }

  function pintarReadme() {
    const panel = $('[data-panel="readme"]');
    if (!D.readme) {
      panel.append(el('p', { class: 'aviso', text: 'Este servicio no tiene README.md.' }));
      return;
    }
    const art = el('article', { class: 'md' });
    if (window.marked) {
      art.innerHTML = marked.parse(D.readme);
    } else {
      art.append(el('pre', { text: D.readme }));
    }
    art.querySelectorAll('pre > code.language-mermaid').forEach(function (code) {
      const m = el('div', { class: 'mermaid' });
      m.dataset.src = code.textContent;
      code.parentElement.replaceWith(m);
    });
    panel.append(art);
  }

  function pintarPermisos() {
    const panel = $('[data-panel="permisos"]');
    panel.append(el('h2', { class: 'subtitulo', text: 'Roles a usar' }));
    panel.append(el('p', {}, chips(D.info.roles, 'Ninguno detectado')));
    if (!D.permisos.length) {
      panel.append(el('p', { class: 'aviso', text: 'Este servicio no expone endpoints REST, así que no tiene reglas de acceso por endpoint.' }));
      return;
    }
    const cabeza = el('tr', {}, ['Método', 'Ruta', 'Operación', 'Regla de acceso'].map(function (t) {
      return el('th', { text: t });
    }));
    const cuerpo = el('tbody');
    D.permisos.forEach(function (p) {
      cuerpo.append(el('tr', {}, [
        el('td', {}, [el('span', { class: 'verbo', text: p.verbo })]),
        el('td', { text: p.ruta }),
        el('td', { text: p.operacion }),
        el('td', { text: p.roles || 'Solo autenticación (sin @PreAuthorize)' })
      ]));
    });
    const tabla = el('table', {}, [el('thead', {}, [cabeza]), cuerpo]);
    panel.append(el('div', { class: 'tabla-wrap' }, [tabla]));
  }

  function pintarDiagramas() {
    const panel = $('[data-panel="diagramas"]');
    if (!D.diagramas.length) {
      panel.append(el('p', { class: 'aviso', text: 'Este servicio no tiene carpeta docs/diagramas.' }));
      return;
    }
    const grid = el('div', { class: 'grid-diag' });
    D.diagramas.forEach(function (d) {
      const tarjeta = el('article', { class: 'diag' });
      tarjeta.append(el('h3', { text: d.titulo }));
      if (d.imagen) {
        const img = el('img', { src: d.imagen, alt: d.titulo, loading: 'lazy' });
        img.onerror = function () {
          img.replaceWith(el('p', { class: 'aviso', text: 'No se pudo mostrar la imagen. Usa el enlace de abajo para abrir el archivo.' }));
        };
        tarjeta.append(el('a', { href: d.imagen, target: '_blank', rel: 'noopener', class: 'abrir', title: 'Abrir archivo' }, [img]));
      } else if (d.codigo) {
        const m = el('div', { class: 'mermaid' });
        m.dataset.src = d.codigo;
        tarjeta.append(m);
      }
      const pie = el('div', { class: 'pie' });
      d.archivos.forEach(function (a, idx) {
        if (idx) pie.append(' · ');
        pie.append(el('a', { href: a, target: '_blank', rel: 'noopener', text: a.split('/').pop() }));
      });
      tarjeta.append(pie);
      grid.append(tarjeta);
    });
    panel.append(grid);
  }

  async function renderMermaidIn(raiz) {
    if (!raiz) return;
    for (const nodo of raiz.querySelectorAll('.mermaid')) {
      if (nodo.dataset.ok) continue;
      const src = nodo.dataset.src || '';
      if (!window.mermaid) {
        nodo.replaceChildren(el('pre', { text: src }));
        continue;
      }
      try {
        const salida = await mermaid.render('m' + Math.random().toString(36).slice(2), src);
        nodo.innerHTML = salida.svg;
        nodo.dataset.ok = '1';
      } catch (e) {
        nodo.replaceChildren(
          el('p', { class: 'aviso', text: 'No se pudo renderizar este diagrama. Se muestra el código fuente:' }),
          el('pre', { text: src }));
      }
    }
  }

  function pintarTecnologias() {
    const panel = $('[data-panel="tecnologias"]');
    panel.append(el('p', { class: 'aviso', text: 'Herramientas de calidad y pruebas que el pom.xml de este servicio aplica. Las marcadas como no aplicadas no están configuradas.' }));
    const grid = el('div', { class: 'grid-diag' });
    D.tecnologias.forEach(function (t) {
      const tarjeta = el('article', { class: 'diag' });
      tarjeta.append(el('h3', { text: t.nombre }));
      tarjeta.append(el('p', { class: 'aviso', text: t.resumen }));
      if (t.aplicado) {
        tarjeta.append(el('a', { href: t.archivo, class: 'chip', text: 'Ver detalle →' }));
      } else {
        tarjeta.append(el('span', { class: 'chip', text: 'No aplicado' }));
      }
      grid.append(tarjeta);
    });
    panel.append(grid);
  }

  let swaggerListo = false;
  function iniciarSwagger() {
    if (swaggerListo || !SPEC || !window.SwaggerUIBundle) return;
    swaggerListo = true;
    window.ui = SwaggerUIBundle({ spec: SPEC, dom_id: '#swagger-ui', deepLinking: false, persistAuthorization: true });
  }

  function pintarApi() {
    if (SPEC) return;
    $('[data-panel="api"]').replaceChildren(el('p', { class: 'aviso', text: 'Este servicio no expone endpoints REST, así que no tiene Swagger.' }));
    $('[data-tab="api"]').hidden = true;
  }

  const botones = Array.from(document.querySelectorAll('[role="tab"]'));
  const javadoc = $('[data-panel="javadoc"]');
  javadoc.append(el('h2', { text: 'Javadoc' }));
  javadoc.append(el('p', { text: 'Documentación técnica generada desde los comentarios /** */ del código. Se abre desde tu equipo después de generarla con build.sh.' }));
  javadoc.append(el('a', { class: 'jd-boton', href: '../../' + D.info.nombre + '/target/reports/apidocs/index.html', text: 'Abrir Javadoc de ' + D.info.nombre }));

  function activar(nombre, cambiarHash) {
    if (nombre === 'api' && !SPEC) nombre = 'info';
    botones.forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === nombre)); });
    document.querySelectorAll('[data-panel]').forEach(function (p) { p.hidden = p.dataset.panel !== nombre; });
    if (nombre === 'readme' || nombre === 'diagramas') renderMermaidIn(document.querySelector('[data-panel="' + nombre + '"]'));
    if (nombre === 'api') iniciarSwagger();
    if (cambiarHash) { try { history.replaceState(null, '', '#' + nombre); } catch (e) {} }
  }
  botones.forEach(function (b) { b.addEventListener('click', function () { activar(b.dataset.tab, true); }); });

  pintarInfo();
  pintarReadme();
  pintarPermisos();
  pintarDiagramas();
  pintarApi();
  pintarTecnologias();
  const inicial = location.hash.slice(1);
  activar(['info', 'readme', 'permisos', 'diagramas', 'tecnologias', 'api', 'javadoc'].indexOf(inicial) >= 0 ? inicial : 'info', false);
})();
</script>
</body>
</html>
