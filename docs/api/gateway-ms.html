<script type="application/json" id="datos">{"svc": "gateway-ms", "info": {"nombre": "gateway-ms", "descripcion": "API gateway de EMPRESA_JOSESAID: enruta cada servicio registrado en Eureka.", "puerto": "8080", "java": "21", "spring_boot": "4.1.2", "endpoints": 0, "roles": []}, "readme": "# gateway-ms\n\n## 1. Identidad\n\n- **Nombre:** gateway-ms\n- **Puerto en tu Mac:** 8080\n- **Versión:** 0.1.0 · Java 21 · Spring Boot 4.1.2 · Spring Cloud 2025.1.2\n\n## 2. Propósito y alcance\n\nPunto de entrada único de EMPRESA_JOSESAID. Las rutas se generan desde Eureka: cada servicio registrado queda en `/{nombre}/**` y se reenvía sin tocar el código de los servicios.\n\n## 3. Estructura\n\n```\ngateway-ms/\n├── Dockerfile\n├── docker-compose.yml\n├── pom.xml\n├── docs/diseno.md\n└── src/\n    ├── main/java/   aplicación\n    ├── main/resources/application.yml\n    └── test/java/   prueba de arranque\n```\n\n## 4. Requisitos\n\n- Docker Desktop en ejecución.\n- Red `empresa-net` creada (`docker network create empresa-net`).\n- JDK 21 y Maven 3.9+ solo si corre fuera de Docker.\n\n## 5. Configuración\n\nRequiere `EUREKA_USUARIO` y `EUREKA_PASSWORD` en el `.env` de la raíz. El Compose arma `EUREKA_URL` con esas credenciales.\n\n## 6. Ejecución\n\nDesde la raíz: `docker compose up -d --build` o, dentro de `gateway-ms/`, `docker compose up -d --build`.\nSalud: `curl -s http://localhost:8080/actuator/health`.\n\n## 7. Modelo de datos\n\nNo aplica. Este servicio no guarda datos de negocio.\n\n## 8. Migraciones\n\nNo aplica.\n\n## 9. Reglas de estado\n\nNo aplica.\n\n## 10. Seguridad\n\nEl gateway no valida tokens (lo hace cada servicio). Bloquea hacia afuera `/actuator/**` y `/discovery-ms/**` con 404, para que el panel de Eureka y las métricas no sean accesibles desde la entrada única. Prometheus y Eureka se comunican dentro de `empresa-net`.\n\n## 11. API\n\n| Ruta de entrada | Destino |\n|---|---|\n| `/{nombre-del-servicio}/**` | Servicio registrado en `discovery-ms`, con el prefijo retirado. Ejemplo: `/usuarios-accesos-ms/v1/auth/login` llega a `/v1/auth/login`. |\n| `/actuator/health` | Salud del gateway |\n\n## 12. Reglas de duplicados\n\nNo aplica.\n\n## 13. Eventos\n\nNo aplica.\n\n## 14. Outbox\n\nNo aplica.\n\n## 15. Observabilidad\n\nSalud y métricas Prometheus en `/actuator/health` y `/actuator/prometheus` dentro de la red interna. Desde `localhost:8080`, `/actuator/**` responde 404 por diseño.\n\n## 16. Pruebas\n\n```bash\nmvn -B test   # prueba de arranque del contexto (sin Eureka)\n```\nRutas públicas (sin token): `/*/v1/auth/login`, `/*/v1/auth/refresh`, `/*/v1/auth/logout` y `/*/v1/auth/cambiar-password-inicial` y la clave pública `/*/.well-known/jwks.json`. `/*/v1/auth/logout-todas` exige token. Todo `/actuator` responde 404.\n\nLa prueba con servicios reales se hace desde la raíz: `curl` a `http://localhost:8080/usuarios-accesos-ms/v1/auth/login`.\n\n## 17. Despliegue\n\nImagen `gateway-ms:0.1.0`. Se levanta antes que los servicios de área.\n\n## 18. Rollback\n\nDetenga el contenedor y regrese a la imagen anterior. No hay datos que revertir.\n\n## 19. Solución de problemas\n\n| Síntoma | Causa probable | Acción |\n|---|---|---|\n| 404 en `/{servicio}/...` | El servicio no está registrado | Verifique en http://localhost:8761 que aparezca (con usuario y contraseña de Eureka). |\n| 404 en `/actuator/...` o `/discovery-ms/...` | Ruta bloqueada a propósito | Use la red interna o el panel de Eureka en `localhost:8761`. |\n| 503 | Ninguna instancia disponible | Levante el servicio y espere su registro. |\n| 401 | Token inválido o ausente | El gateway lo reenvía; revise el token con el servicio de usuarios. |\n\n## 20. Decisiones y pendientes\n\n- **Validación de JWT en el gateway:** implementada (resource server con firma). Cada servicio vuelve a validar su token y sus roles.\n- **Sin límites de tasa ni CORS:** pendientes.\n- **Puerto 8080 en tu Mac:** si lo ocupa otra aplicación, cambie el mapeo del compose.\n\n## 21. Referencias\n\n- Diseño: `docs/diseno.md`.\n- Orden de arranque: sección 10 del README de la raíz.\n- Gateway y monitoreo: sección 11 del README de la raíz.\n\n## Ruta vieja tras recrear un servicio\n\nCuando un servicio se recrea con `docker compose up -d --build`, el gateway puede seguir enrutando a la IP anterior durante un rato. Síntomas: el login responde 404 o 401 sin cuerpo, y la cabecera `WWW-Authenticate` trae solo `error` y `error_description`, que es la respuesta de un servicio de área y no del gateway.\n\nSolución: `docker compose restart gateway-ms` y esperar a que quede `healthy`.\n\n### Tiempos de descubrimiento (desarrollo)\n\nPara que el gateway vea enseguida los cambios de instancias, los tiempos están bajos en desarrollo y se pueden sobrescribir con variables de entorno:\n\n- Servicios de área: `EUREKA_RENOVACION_SEG` (5 s) y `EUREKA_EXPIRACION_SEG` (15 s).\n- Gateway: `EUREKA_FETCH_SEG` (5 s) para el registro y `LB_CACHE_TTL` (5 s) para la caché de balanceo.\n- discovery-ms: `EUREKA_EVICCION_MS` (5 000 ms) para retirar instancias caídas.\n\nEn producción conviene subirlos para no saturar el registro con renovaciones.\n\n## Guías paso a paso\n\nProcedimientos de este servicio, publicados en HTML:\n\n- [Levantar el ecosistema completo](https://github.com/josesaid/EMPRESA_JOSESAID/blob/main/docs/guias/01-levantar-ecosistema.html)\n- [Ejecutar las pruebas de un servicio](https://github.com/josesaid/EMPRESA_JOSESAID/blob/main/docs/guias/02-ejecutar-pruebas.html)\n- [Índice de todas las guías](https://github.com/josesaid/EMPRESA_JOSESAID/blob/main/docs/guias/README.html)\n", "permisos": [], "diagramas": [{"titulo": "01 validacion jwt y enrutamiento", "archivos": ["gateway-ms/diagramas/01-validacion-jwt-y-enrutamiento.mmd", "gateway-ms/diagramas/01-validacion-jwt-y-enrutamiento.png"], "imagen": "gateway-ms/diagramas/01-validacion-jwt-y-enrutamiento.png", "codigo": "flowchart TD\n  A[\"<b>Cliente<\/b><br/>Petición a /{servicio}/**\"]:::actor --> B{\"<b>Ruta pública?<\/b><br/>login, refresh, logout, cambiar-password-inicial, jwks.json\"}:::pendiente\n  B -- \"sí\" --> D[\"<b>Reenvía sin token<\/b>\"]:::servicio\n  B -- \"no\" --> C{\"<b>JWT válido?<\/b><br/>Resource server con firma\"}:::pendiente\n  C -- \"ausente o inválido\" --> E1[\"<b>401<\/b><br/>Sin reenvío\"]:::alerta\n  C -- \"válido\" --> D\n  D --> F{\"<b>Servicio registrado en discovery-ms?<\/b>\"}:::pendiente\n  F -- \"no\" --> E2[\"<b>404<\/b><br/>Servicio no encontrado\"]:::alerta\n  F -- \"sí\" --> G[\"<b>Quita el prefijo y reenvía<\/b><br/>/usuarios-accesos-ms/v1/x llega como /v1/x\"]:::servicio\n  G --> H[\"<b>El servicio destino<\/b><br/>Vuelve a validar el token y los roles\"]:::datos\n  I[\"<b>/actuator<\/b>\"]:::actor -. \"pendiente: confirmar; README dice 404\" .-> J[\"<b>Bloqueo de rutas internas<\/b>\"]:::pendiente\n\n  classDef actor fill:#F1EFE8,stroke:#888780,color:#2C2C2A\n  classDef servicio fill:#E1F5EE,stroke:#1D9E75,color:#04342C\n  classDef datos fill:#E6F1FB,stroke:#378ADD,color:#042C53\n  classDef alerta fill:#FCEBEB,stroke:#E24B4A,color:#501313\n  classDef pendiente fill:#FAEEDA,stroke:#BA7517,color:#412402\n"}, {"titulo": "arquitectura", "archivos": ["gateway-ms/diagramas/arquitectura.mmd", "gateway-ms/diagramas/arquitectura.png"], "imagen": "gateway-ms/diagramas/arquitectura.png", "codigo": "flowchart LR\n  C([\"<b>Cliente o aplicación<\/b>\"]):::actor\n  D[\"<b>discovery-ms<\/b><br/>Eureka · 8761\"]:::actor\n  subgraph GW[\"gateway-ms · 8080\"]\n    RUT[\"<b>Rutas automáticas<\/b><br/>/{servicio}/**\"]:::gateway\n    LB[\"<b>Balanceo de carga<\/b><br/>Spring Cloud LoadBalancer\"]:::servicio\n  end\n  US[\"<b>usuarios-accesos-ms<\/b>\"]:::servicio\n  CL[\"<b>clientes-ms y demás servicios<\/b>\"]:::servicio\n\n  C --> RUT\n  RUT --> LB\n  LB --> US\n  LB --> CL\n  US -. \"se registra\" .-> D\n  CL -. \"se registra\" .-> D\n  RUT -. \"consulta instancias\" .-> D\n\n  classDef actor fill:#F1EFE8,stroke:#888780,color:#2C2C2A\n  classDef gateway fill:#EEEDFE,stroke:#7F77DD,color:#26215C\n  classDef servicio fill:#E1F5EE,stroke:#1D9E75,color:#04342C\n  classDef datos fill:#E6F1FB,stroke:#378ADD,color:#042C53\n  classDef alerta fill:#FCEBEB,stroke:#E24B4A,color:#501313\n  classDef pendiente fill:#FAEEDA,stroke:#BA7517,color:#412402\n  classDef infra fill:#FFF8DC,stroke:#E0A800,color:#4A3800\n  classDef seguridad fill:#FDF0E1,stroke:#E8870E,color:#4A2A00\n  classDef cifrado fill:#FDEEF3,stroke:#D4537E,color:#4B1528\n  classDef dominio fill:#F6EEFB,stroke:#AF52DE,color:#3A1450\n"}], "api": false, "tecnologias": [{"id": "pruebas", "nombre": "Pruebas automatizadas", "resumen": "Pruebas unitarias y de integración con JUnit 5. Surefire ejecuta las unitarias y Failsafe las de integración.", "aplicado": true, "archivo": "gateway-ms/tecnologias/pruebas.html"}, {"id": "checkstyle", "nombre": "Checkstyle", "resumen": "Revisa convenciones de estilo del código Java (nombres, tamaños de métodos, imports) contra un conjunto de reglas.", "aplicado": true, "archivo": "gateway-ms/tecnologias/checkstyle.html"}, {"id": "pmd", "nombre": "PMD", "resumen": "Busca patrones problemáticos en el código: variables sin uso, bloques vacíos y complejidad excesiva.", "aplicado": true, "archivo": "gateway-ms/tecnologias/pmd.html"}, {"id": "spotbugs", "nombre": "SpotBugs", "resumen": "Analiza el bytecode para detectar errores probables: referencias nulas, recursos sin cerrar y problemas de concurrencia.", "aplicado": true, "archivo": "gateway-ms/tecnologias/spotbugs.html"}, {"id": "jacoco", "nombre": "JaCoCo", "resumen": "Mide la cobertura de pruebas (líneas y ramas) y puede fallar el build si no se alcanza el mínimo configurado.", "aplicado": true, "archivo": "gateway-ms/tecnologias/jacoco.html"}, {"id": "javadoc", "nombre": "Javadoc", "resumen": "Genera documentación técnica a partir de los comentarios /** */.", "aplicado": true, "archivo": "gateway-ms/tecnologias/javadoc.html"}, {"id": "cobertura", "nombre": "Cobertura", "resumen": "Alternativa a JaCoCo para medir la cobertura de pruebas.", "aplicado": true, "archivo": "gateway-ms/tecnologias/cobertura.html"}]}</script>

<script>
(function () {
  const D = JSON.parse(document.getElementById('datos').textContent);
  const SPEC = JSON.parse(document.getElementById('spec').textContent);
  const $ = (s) => document.querySelector(s);

  function el(tag, attrs, hijos) {
    const n = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (hijos || []).forEach(function (h) {
      if (h === null || h === undefined || h === false) return;
      n.append(h.nodeType ? h : document.createTextNode(String(h)));
    });
    return n;
  }

  function chips(lista, vacio) {
    if (!lista || !lista.length) return [el('span', { class: 'aviso', text: vacio })];
    return lista.map(function (r) { return el('span', { class: 'chip', text: r }); });
  }

  if (window.mermaid) {
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'loose',
      theme: window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default'
    });
  }

  function pintarInfo() {
    const i = D.info;
    $('#titulo').textContent = i.nombre;
    $('#descr').textContent = i.descripcion || '';
    const pild = $('#pildoras');
    [
      'Puerto ' + (i.puerto || '—'),
      'Java ' + (i.java || '—'),
      'Spring Boot ' + (i.spring_boot || '—'),
      i.endpoints ? i.endpoints + ' endpoints' : 'Sin API REST'
    ].forEach(function (t) { pild.append(el('span', { class: 'pildora', text: t })); });
    const campos = [
      ['Servicio', i.nombre],
      ['Descripción', i.descripcion || '—'],
      ['Puerto de la aplicación', i.puerto || '—'],
      ['Java', i.java || '—'],
      ['Spring Boot', i.spring_boot || '—'],
      ['Endpoints REST', i.endpoints || 'Ninguno']
    ];
    const dl = el('dl', { class: 'datos' });
    campos.forEach(function (c) {
      dl.append(el('div', {}, [el('dt', { text: c[0] }), el('dd', { text: String(c[1]) })]));
    });
    dl.append(el('div', {}, [el('dt', { text: 'Roles a usar' }),
      el('dd', {}, chips(i.roles, 'Ninguno detectado'))]));
    $('[data-panel="info"]').append(dl);
  }

  function pintarReadme() {
    const panel = $('[data-panel="readme"]');
    if (!D.readme) {
      panel.append(el('p', { class: 'aviso', text: 'Este servicio no tiene README.md.' }));
      return;
    }
    const art = el('article', { class: 'md' });
    if (window.marked) {
      art.innerHTML = marked.parse(D.readme);
    } else {
      art.append(el('pre', { text: D.readme }));
    }
    art.querySelectorAll('pre > code.language-mermaid').forEach(function (code) {
      const m = el('div', { class: 'mermaid' });
      m.dataset.src = code.textContent;
      code.parentElement.replaceWith(m);
    });
    panel.append(art);
  }

  function pintarPermisos() {
    const panel = $('[data-panel="permisos"]');
    panel.append(el('h2', { class: 'subtitulo', text: 'Roles a usar' }));
    panel.append(el('p', {}, chips(D.info.roles, 'Ninguno detectado')));
    if (!D.permisos.length) {
      panel.append(el('p', { class: 'aviso', text: 'Este servicio no expone endpoints REST, así que no tiene reglas de acceso por endpoint.' }));
      return;
    }
    const cabeza = el('tr', {}, ['Método', 'Ruta', 'Operación', 'Regla de acceso'].map(function (t) {
      return el('th', { text: t });
    }));
    const cuerpo = el('tbody');
    D.permisos.forEach(function (p) {
      cuerpo.append(el('tr', {}, [
        el('td', {}, [el('span', { class: 'verbo', text: p.verbo })]),
        el('td', { text: p.ruta }),
        el('td', { text: p.operacion }),
        el('td', { text: p.roles || 'Solo autenticación (sin @PreAuthorize)' })
      ]));
    });
    const tabla = el('table', {}, [el('thead', {}, [cabeza]), cuerpo]);
    panel.append(el('div', { class: 'tabla-wrap' }, [tabla]));
  }

  function pintarDiagramas() {
    const panel = $('[data-panel="diagramas"]');
    if (!D.diagramas.length) {
      panel.append(el('p', { class: 'aviso', text: 'Este servicio no tiene carpeta docs/diagramas.' }));
      return;
    }
    const grid = el('div', { class: 'grid-diag' });
    D.diagramas.forEach(function (d) {
      const tarjeta = el('article', { class: 'diag' });
      tarjeta.append(el('h3', { text: d.titulo }));
      if (d.imagen) {
        const img = el('img', { src: d.imagen, alt: d.titulo, loading: 'lazy' });
        img.onerror = function () {
          img.replaceWith(el('p', { class: 'aviso', text: 'No se pudo mostrar la imagen. Usa el enlace de abajo para abrir el archivo.' }));
        };
        tarjeta.append(el('a', { href: d.imagen, target: '_blank', rel: 'noopener', class: 'abrir', title: 'Abrir archivo' }, [img]));
      } else if (d.codigo) {
        const m = el('div', { class: 'mermaid' });
        m.dataset.src = d.codigo;
        tarjeta.append(m);
      }
      const pie = el('div', { class: 'pie' });
      d.archivos.forEach(function (a, idx) {
        if (idx) pie.append(' · ');
        pie.append(el('a', { href: a, target: '_blank', rel: 'noopener', text: a.split('/').pop() }));
      });
      tarjeta.append(pie);
      grid.append(tarjeta);
    });
    panel.append(grid);
  }

  async function renderMermaidIn(raiz) {
    if (!raiz) return;
    for (const nodo of raiz.querySelectorAll('.mermaid')) {
      if (nodo.dataset.ok) continue;
      const src = nodo.dataset.src || '';
      if (!window.mermaid) {
        nodo.replaceChildren(el('pre', { text: src }));
        continue;
      }
      try {
        const salida = await mermaid.render('m' + Math.random().toString(36).slice(2), src);
        nodo.innerHTML = salida.svg;
        nodo.dataset.ok = '1';
      } catch (e) {
        nodo.replaceChildren(
          el('p', { class: 'aviso', text: 'No se pudo renderizar este diagrama. Se muestra el código fuente:' }),
          el('pre', { text: src }));
      }
    }
  }

  function pintarTecnologias() {
    const panel = $('[data-panel="tecnologias"]');
    panel.append(el('p', { class: 'aviso', text: 'Herramientas de calidad y pruebas que el pom.xml de este servicio aplica. Las marcadas como no aplicadas no están configuradas.' }));
    const grid = el('div', { class: 'grid-diag' });
    D.tecnologias.forEach(function (t) {
      const tarjeta = el('article', { class: 'diag' });
      tarjeta.append(el('h3', { text: t.nombre }));
      tarjeta.append(el('p', { class: 'aviso', text: t.resumen }));
      if (t.aplicado) {
        tarjeta.append(el('a', { href: t.archivo, class: 'chip', text: 'Ver detalle →' }));
      } else {
        tarjeta.append(el('span', { class: 'chip', text: 'No aplicado' }));
      }
      grid.append(tarjeta);
    });
    panel.append(grid);
  }

  let swaggerListo = false;
  function iniciarSwagger() {
    if (swaggerListo || !SPEC || !window.SwaggerUIBundle) return;
    swaggerListo = true;
    window.ui = SwaggerUIBundle({ spec: SPEC, dom_id: '#swagger-ui', deepLinking: false, persistAuthorization: true });
  }

  function pintarApi() {
    if (SPEC) return;
    $('[data-panel="api"]').replaceChildren(el('p', { class: 'aviso', text: 'Este servicio no expone endpoints REST, así que no tiene Swagger.' }));
    $('[data-tab="api"]').hidden = true;
  }

  const botones = Array.from(document.querySelectorAll('[role="tab"]'));
  function activar(nombre, cambiarHash) {
    if (nombre === 'api' && !SPEC) nombre = 'info';
    botones.forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === nombre)); });
    document.querySelectorAll('[data-panel]').forEach(function (p) { p.hidden = p.dataset.panel !== nombre; });
    if (nombre === 'readme' || nombre === 'diagramas') renderMermaidIn(document.querySelector('[data-panel="' + nombre + '"]'));
    if (nombre === 'api') iniciarSwagger();
    if (cambiarHash) { try { history.replaceState(null, '', '#' + nombre); } catch (e) {} }
  }
  botones.forEach(function (b) { b.addEventListener('click', function () { activar(b.dataset.tab, true); }); });

  pintarInfo();
  pintarReadme();
  pintarPermisos();
  pintarDiagramas();
  pintarApi();
  pintarTecnologias();
  const inicial = location.hash.slice(1);
  activar(['info', 'readme', 'permisos', 'diagramas', 'tecnologias', 'api'].indexOf(inicial) >= 0 ? inicial : 'info', false);
})();
</script>
</body>
</html>
