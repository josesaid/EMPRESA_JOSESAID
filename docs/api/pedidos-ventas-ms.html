<script type="application/json" id="datos">{"svc": "pedidos-ventas-ms", "info": {"nombre": "pedidos-ventas-ms", "descripcion": "Cotizaciones, pedidos, confirmación, entrega, cancelación, devolución y métricas de ventas.", "puerto": "8081", "java": "21", "spring_boot": "4.1.2", "endpoints": 16, "roles": ["ALMACEN", "DIRECCION", "FINANZAS", "VENTAS"]}, "readme": "# pedidos-ventas-ms\n\n## 1. Identidad\n\n- **Nombre:** pedidos-ventas-ms\n- **Área de negocio:** Pedidos y ventas\n- **Acceso:** vía gateway, sin puerto publicado (contenedor: dentro del contenedor escucha en 8081)\n- **Base de datos:** `pedidos`, usuario `pedidos` (creados por `infra/postgres/init-databases.sh`)\n- **Versión:** 0.1.0 · Java 21 · Spring Boot 4.1.2 · PostgreSQL 17 · Kafka 4.0.0\n\n## 2. Propósito y alcance\n\nGestiona el ciclo comercial de venta: cotizaciones que se aceptan y se convierten en pedidos, confirmación, entrega, cancelación, devolución y métricas de ventas netas.\n\nIncluye:\n- Cotizaciones con vigencia (BORRADOR → ENVIADA → ACEPTADA, o VENCIDA).\n- Pedidos (BORRADOR → CONFIRMADO → ENTREGADO, con CANCELADO como salida).\n- Cálculo de subtotal, IVA y total con tasas del catálogo y redondeo bancario.\n- Métricas de ventas por mes y moneda.\n\nNo incluye (por ahora): clientes (vive en clientes-ms), facturación (facturacion-pagos-ms), inventario (inventario-operaciones-ms) ni cobro. Ver sección 20.\n\n## 3. Estructura del repositorio\n\n```\npedidos-ventas-ms/\n├── Dockerfile                 Build multi-etapa (JDK 21 → JRE 21), usuario no root\n├── docker-compose.yml         Servicio con comentarios; se incluye desde la raíz\n├── .env.example               Variables del servicio (copie a .env sin subir secretos)\n├── pom.xml                    Dependencias heredadas del padre de la empresa\n├── docs/diseno.md             Diseño de dominio y decisiones\n└── src/\n    ├── main/java/.../pedidos/\n    │   ├── domain/            Cotizacion, Pedido, Linea, Totales, reglas y excepciones\n    │   ├── application/       PedidosService (casos de uso), eventos y publicador\n    │   ├── infrastructure/\n    │   │   ├── persistence/   Entidades JPA y adaptadores de repositorio\n    │   │   └── outbox/        Outbox y retransmisor a Kafka\n    │   ├── api/               PedidosControlador y ManejadorErrores (RFC 9457)\n    │   └── config/            Seguridad JWT, reloj y propiedades\n    ├── main/resources/\n    │   ├── application.yml\n    │   └── db/migration/V1__esquema_inicial.sql\n    └── test/java/.../pedidos/\n        ├── domain/            Pruebas unitarias de reglas\n        └── api/PedidosIT.java Pruebas de integración con Testcontainers\n```\n\n## 4. Requisitos\n\n- macOS con Docker Desktop en ejecución.\n- JDK 21 (solo si corre fuera de Docker) y Maven 3.9+.\n- Red `empresa-net` creada por la raíz.\n- postgres y kafka levantados desde la raíz.\n- Valida tokens con la clave pública de usuarios-accesos-ms (JWKS), sin secreto compartido.\n\n## 5. Configuración\n\n| Variable | Obligatoria | Descripción |\n|---|---|---|\n| `PEDIDOS_DB_PASSWORD` | Sí (compose) | Contraseña del usuario de base `pedidos`. |\n| `JWT_JWKS_URI` | No | URL del JWKS de usuarios-accesos-ms (clave pública). Ya viene configurada en el Compose |\n| `JWT_DURACION` | No | Duración del token aceptado, ISO-8601. Por omisión `PT15M`. |\n| `OUTBOX_INTERVALO_MS` | No | Cada cuántos ms se envían eventos pendientes. Por omisión 5000. |\n| `KAFKA_BOOTSTRAP` | No | Dentro de compose es `kafka:29092`. |\n\nEl servicio no arranca si el clave pública JWKS falta o es menor a 32 bytes.\n\n## 6. Ejecución\n\nDesde la raíz del repositorio (recomendado):\n\n```bash\ncp .env.example .env            # una sola vez; complete las variables de la raíz\ndocker compose up -d postgres kafka\ncd pedidos-ventas-ms\ndocker compose up -d --build\ncurl -s http://localhost:8080/pedidos-ventas-ms/actuator/health\n```\n\nSin Docker, con Maven:\n\n```bash\nexport DB_URL=jdbc:postgresql://localhost:5432/pedidos DB_USER=pedidos DB_PASSWORD=...\nexport JWT_JWKS_URI=http://localhost:8080/usuarios-accesos-ms/.well-known/jwks.json\nmvn spring-boot:run\n```\n\n## 7. Modelo de datos\n\n| Tabla | Contenido |\n|---|---|\n| `cotizaciones` | Cabecera, estatus, vigencia, `pedido_id` único (se convierte una sola vez). |\n| `lineas_cotizacion` | Líneas por posición; precio congelado al crear. |\n| `pedidos` | Cabecera, estatus, fechas de confirmación y entrega, motivo de cancelación. |\n| `lineas_pedido` | Líneas del pedido; se congelan al confirmar. |\n| `outbox_eventos` | Eventos pendientes de enviar a Kafka. |\n\nMontos en `NUMERIC(14,2)`. `version` en cada agregado para control optimista.\n\n## 8. Migraciones\n\nFlyway ejecuta `V1__esquema_inicial.sql` al arrancar. Hibernate solo valida (`ddl-auto: validate`). Los cambios futuros serán nuevas migraciones `V2`, `V3`, etc.; nunca se editan migraciones ya aplicadas.\n\n## 9. Máquinas de estado\n\n**Cotización:** BORRADOR →(enviar)→ ENVIADA →(aceptar, dentro de vigencia)→ ACEPTADA. Si la vigencia pasó, aceptar la marca VENCIDA y responde 410. VENCIDA no se reactiva: se crea una nueva cotización.\n\n**Pedido:** BORRADOR →(confirmar, requiere ≥1 línea)→ CONFIRMADO →(entregar)→ ENTREGADO.\n- CANCELADO desde BORRADOR o CONFIRMADO, con motivo `CANCELACION_CLIENTE` o `ERROR_CAPTURA`.\n- Devolución total desde ENTREGADO: queda CANCELADO con motivo `DEVOLUCION_TOTAL`.\n- Las líneas solo cambian en BORRADOR.\n- Nada se borra físicamente.\n\n## 10. Seguridad\n\n- API sin estado con token JWT RS256 (resource server). Solo `/actuator/health` es público.\n- Roles en el claim `roles` del token, convertidos a `ROLE_*`.\n- Autorización por método con `@PreAuthorize`.\n\n| Operación | Roles |\n|---|---|\n| Crear y operar cotización y pedido | VENTAS, DIRECCION |\n| Entregar pedido | ALMACEN, DIRECCION |\n| Consultar pedidos y cotizaciones | VENTAS, DIRECCION, FINANZAS (ALMACEN solo pedido) |\n| Métricas de ventas | DIRECCION, FINANZAS |\n| Catálogos | Cualquier usuario autenticado |\n\n## 11. API\n\nBase `/v1`. Errores en `application/problem+json` (RFC 9457).\n\n| Método | Ruta | Descripción | Éxito |\n|---|---|---|---|\n| POST | /cotizaciones | Crea cotización | 201 |\n| GET | /cotizaciones/{id} | Consulta cotización | 200 |\n| POST | /cotizaciones/{id}/envio | Envía a cliente | 200 |\n| POST | /cotizaciones/{id}/aceptacion | Acepta (410 si venció) | 200 |\n| POST | /cotizaciones/{id}/pedido | Convierte en pedido (una vez) | 201 |\n| POST | /pedidos | Crea pedido directo | 201 |\n| GET | /pedidos?clienteId=&estatus=&canal= | Lista con filtros | 200 |\n| GET | /pedidos/{id} | Consulta pedido | 200 |\n| PUT | /pedidos/{id}/lineas | Reemplaza líneas (solo BORRADOR) | 200 |\n| POST | /pedidos/{id}/confirmacion | Confirma | 200 |\n| POST | /pedidos/{id}/entrega | Registra entrega | 200 |\n| POST | /pedidos/{id}/cancelacion | Cancela con `motivo` | 200 |\n| POST | /pedidos/{id}/devolucion | Devolución total | 200 |\n| GET | /metricas/ventas?mes=2026-10 | Ventas netas del mes | 200 |\n| GET | /catalogos/tasas-iva | Tasas disponibles | 200 |\n| GET | /catalogos/monedas | Monedas y decimales | 200 |\n\nCódigos de error: 400 solicitud inválida, 404 no encontrado, 409 conflicto de estado o concurrencia, 410 cotización vencida, 422 regla de negocio, 403 sin rol.\n\nEjemplo de cotización:\n\n```json\n{\"clienteId\":\"11111111-1111-1111-1111-111111111111\",\"canal\":\"WEB\",\"moneda\":\"MXN\",\n \"tasaIva\":\"IVA_GENERAL\",\"vigenteHasta\":\"2026-12-31\",\n \"lineas\":[{\"productoId\":\"22222222-2222-2222-2222-222222222222\",\"descripcion\":\"Tornillo\",\"cantidad\":2,\"precioUnitario\":10.00}]}\n```\n\n## 12. Reglas de duplicados\n\n- Una cotización solo genera un pedido (`pedido_id` único y validación de estado).\n- Dos peticiones simultáneas de conversión: una gana y la otra recibe 409 por control optimista.\n- Idempotency-Key en POST /v1/pedidos: implementada; ver «Idempotencia de altas».\n\n## 13. Eventos\n\nSe publican en el outbox dentro de la misma transacción:\n\n| Evento | Cuándo | Datos |\n|---|---|---|\n| PedidoConfirmado | Pedido confirmado | clienteId, moneda, total |\n| PedidoEntregado | Pedido entregado | clienteId |\n| PedidoCancelado | Cancelación o devolución | motivo |\n\nFormato del sobre: `{\"tipo\":\"...\",\"agregadoId\":\"...\",\"datos\":{...}}`. Topic de Kafka: nombre del servicio.\n\n## 14. Outbox\n\n`PublicadorEventosOutbox` escribe en `outbox_eventos`. `RetransmisorOutbox` lo lee cada `OUTBOX_INTERVALO_MS`, envía a Kafka y marca publicado. Si Kafka falla, el evento queda pendiente y se reintenta; se detiene al primer fallo para conservar el orden.\n\n## 15. Observabilidad\n\n- Salud: `GET /actuator/health`.\n- Métricas Prometheus: `GET /actuator/prometheus` (se conecta cuando exista monitoreo de la empresa).\n- Logs en formato JSON ECS.\n- Trazabilidad de requests: pendiente de contenedor de tracing de la empresa.\n\n## 16. Pruebas\n\n```bash\nmvn -B test     # unitarias de reglas de dominio (8)\nmvn -B verify   # además PedidosIT con PostgreSQL y Kafka reales (requiere Docker)\n```\n\nScript de verificación en Mac, desde la raíz: `bash ejecutar-pruebas-pedidos.sh`. Resume cada paso y guarda registros `.verify-pedidos-ventas-ms.log` y `.build-pedidos-ventas-ms.log`.\n\n## 17. Despliegue\n\nSe despliega como contenedor con la imagen `pedidos-ventas-ms:0.1.0`. Requiere la red `empresa-net`, la base `pedidos` y el clave pública JWKS. Un único replica es suficiente para el alcance actual.\n\n## 18. Rollback\n\n1. `docker compose stop pedidos-ventas-ms`.\n2. Regrese a la imagen anterior con su etiqueta.\n3. Las migraciones Flyway no se revierten automáticamente. Si una migración fue incorrecta, se corrige con una migración nueva.\n\n## 19. Solución de problemas\n\n| Síntoma | Causa probable | Acción |\n|---|---|---|\n| Arranque falla con \"secreto debe tener al menos 32 bytes\" | `JWT_JWKS_URI` no responde | Revise `.env` de la raíz. |\n| Error 401 con token válido | Secreto distinto al de usuarios-accesos-ms | Copie el mismo valor. |\n| Error de conexión a la base | Base `pedidos` no creada en un volumen existente | Ejecute el `CREATE ROLE` y `CREATE DATABASE` del README de la raíz. |\n| 409 al convertir cotización | Ya convertida | Consulte `pedido_id` de la cotización. |\n| 410 al aceptar | Venció la vigencia | Cree una nueva cotización. |\n\n## 20. Decisiones y pendientes\n\n- **IVA_FRONTERIZO (8%)**: tasa tomada del catálogo propuesto; falta validación con Contabilidad.\n- **Rol Gerente de ventas**: no existe en el catálogo de usuarios-accesos; se usa DIRECCION. Pendiente de decisión.\n- **Idempotency-Key**: implementada en POST /v1/pedidos; ver «Idempotencia de altas».\n- **Validación de cliente existente**: implementada; ver la sección «Validación de cliente».\n- **Métricas de ventas**: ventas netas; excluye cancelados y devueltos.\n- **Inventario al confirmar**: no reserva stock todavía; se integrará con inventario-operaciones-ms.\n- **Refresh/logout**: heredado de usuarios-accesos; pendiente de definir si aplica aquí.\n\n## 21. Referencias\n\n- Diseño detallado: `docs/diseno.md`.\n- Arranque y dependencias: sección \"Orden de arranque\" del README de la raíz.\n- Especificación del área: `area_md_specification_files/Pedidos_Ventas.md`.\n- Servicio de tokens: `usuarios-accesos-ms`.\n\n## Descubrimiento, gateway y monitoreo\n\n- Al arrancar, `pedidos-ventas-ms` se registra en `discovery-ms` (Eureka). Después queda accesible por el gateway en `http://localhost:8080/pedidos-ventas-ms/...`.\n- **Orden de arranque:** `discovery-ms` primero. Si este servicio arranca antes, se registra solo cuando el registro esté disponible.\n- Métricas Prometheus en `/actuator/prometheus`, sin token, solo lectura.\n- Variables `EUREKA_USUARIO` y `EUREKA_PASSWORD`: obligatorias en Docker; el Compose arma la URL de registro `http://USUARIO:CLAVE@discovery-ms:8761/eureka/`. Fuera de Docker use `EUREKA_URL=http://USUARIO:CLAVE@localhost:8761/eureka/` y `EUREKA_INSTANCIA_HOST=localhost`.\n\n\n## Idempotencia de altas (`Idempotency-Key`)\n\nEl alta de `POST /v1/pedidos` acepta la cabecera opcional `Idempotency-Key`. Úsela cuando un reintento no debe crear el registro dos veces (por ejemplo, si se cortó la conexión y no sabe si la petición llegó).\n\n- **Misma clave y mismo cuerpo:** responde la misma respuesta original; no se crea nada nuevo.\n- **Misma clave con otro cuerpo:** responde `422` (`regla-de-negocio`).\n- **Misma clave mientras la primera petición sigue en proceso:** responde `409` (`conflicto-de-estado`).\n- **Sin la cabecera:** la petición se procesa como siempre.\n\nLas respuestas completadas se guardan 24 horas en la tabla `idempotencia`. Si la operación falla, la clave se libera para que el cliente pueda reintentar. Si la petición se interrumpe a medio camino y la clave queda en proceso, un nuevo intento con la misma clave la retoma pasados 2 minutos; antes de eso responde 409.\n\n\n## Indicadores para reportes ejecutivos\n\nPublica un indicador mensual al tópico `indicadores-areas`, que consume `reportes-ejecutivos-ms`.\n\n- **Indicador:** `ventas_mes` (área `VENTAS_ATENCION_CLIENTES`).\n- **Definición:** Suma de líneas de pedidos en MXN con estatus CONFIRMADO o ENTREGADO, con IVA incluido, asignada al mes de su confirmación (hora de la Ciudad de México).\n- **Clave del mensaje:** `VENTAS_ATENCION_CLIENTES|ventas_mes|AAAA-MM`. Reportes actualiza el valor por área, nombre y periodo (upsert).\n- **Ciclo:** recalcula el mes actual y el anterior cada 60 minutos; el primer envío ocurre a los 30 segundos.\n- **Configuración:** `INDICADORES_TOPICO`, `INDICADORES_INTERVALO_MS`, `INDICADORES_INICIO_MS`.\n- **Entrega:** no pasa por el outbox. Es una foto del periodo; si un envío falla, el siguiente ciclo lo corrige.\n- **Clase:** `PublicadorIndicadoresVentas`. Prueba: `mvn verify -Dit.test='PublicadorIndicadores*IT'`.\n\n\n## Validación de cliente\n\nAntes de crear una cotización o un pedido, el servicio consulta `GET /v1/clientes/{id}` en clientes-ms, con el mismo token del usuario.\n\n| Caso | Respuesta |\n|---|---|\n| Cliente inexistente | 422 `regla-de-negocio`: \"El cliente no existe\" |\n| Cliente SUSPENDIDO o BAJA | 422 `regla-de-negocio`: \"El cliente no está activo\" |\n| clientes-ms caído o con error | 503 `servicio-no-disponible`: reintentar |\n| Cliente ACTIVO | La operación continúa |\n\n- **Configuración:** `CLIENTES_URL`, por omisión `http://clientes-ms:8080`.\n- **Decisión:** consulta síncrona, aprobada. Si clientes-ms no responde, pedidos tampoco crea nada: prefiere rechazar a guardar un cliente no verificado.\n- **Pruebas:** `ClientesRestValidadorTest` con servidor REST simulado; `PedidosIT` sustituye el validador con `@MockitoBean`.\n\n## Guías paso a paso\n\nProcedimientos de este servicio, publicados en HTML:\n\n- [Ejecutar las pruebas de un servicio](https://github.com/josesaid/EMPRESA_JOSESAID/blob/main/docs/guias/02-ejecutar-pruebas.html)\n- [Índice de todas las guías](https://github.com/josesaid/EMPRESA_JOSESAID/blob/main/docs/guias/README.html)\n", "permisos": [{"verbo": "GET", "ruta": "/v1/catalogos/monedas", "operacion": "Monedas", "roles": "isAuthenticated()"}, {"verbo": "GET", "ruta": "/v1/catalogos/tasas-iva", "operacion": "Tasas iva", "roles": "isAuthenticated()"}, {"verbo": "POST", "ruta": "/v1/cotizaciones", "operacion": "Crear cotizacion", "roles": "hasAnyRole('VENTAS','DIRECCION')"}, {"verbo": "GET", "ruta": "/v1/cotizaciones/{id}", "operacion": "Obtener cotizacion", "roles": "hasAnyRole('VENTAS','DIRECCION','FINANZAS')"}, {"verbo": "POST", "ruta": "/v1/cotizaciones/{id}/aceptacion", "operacion": "Aceptar cotizacion", "roles": "hasAnyRole('VENTAS','DIRECCION')"}, {"verbo": "POST", "ruta": "/v1/cotizaciones/{id}/envio", "operacion": "Enviar cotizacion", "roles": "hasAnyRole('VENTAS','DIRECCION')"}, {"verbo": "POST", "ruta": "/v1/cotizaciones/{id}/pedido", "operacion": "Convertir en pedido", "roles": "hasAnyRole('VENTAS','DIRECCION')"}, {"verbo": "GET", "ruta": "/v1/metricas/ventas", "operacion": "Resumen ventas", "roles": "hasAnyRole('DIRECCION','FINANZAS')"}, {"verbo": "POST", "ruta": "/v1/pedidos", "operacion": "Crear pedido", "roles": "hasAnyRole('VENTAS','DIRECCION')"}, {"verbo": "GET", "ruta": "/v1/pedidos", "operacion": "Buscar pedidos", "roles": "hasAnyRole('VENTAS','DIRECCION','FINANZAS')"}, {"verbo": "GET", "ruta": "/v1/pedidos/{id}", "operacion": "Obtener pedido", "roles": "hasAnyRole('VENTAS','DIRECCION','FINANZAS','ALMACEN')"}, {"verbo": "POST", "ruta": "/v1/pedidos/{id}/cancelacion", "operacion": "Cancelar pedido", "roles": "hasAnyRole('VENTAS','DIRECCION')"}, {"verbo": "POST", "ruta": "/v1/pedidos/{id}/confirmacion", "operacion": "Confirmar pedido", "roles": "hasAnyRole('VENTAS','DIRECCION')"}, {"verbo": "POST", "ruta": "/v1/pedidos/{id}/devolucion", "operacion": "Devolver pedido", "roles": "hasAnyRole('VENTAS','DIRECCION')"}, {"verbo": "POST", "ruta": "/v1/pedidos/{id}/entrega", "operacion": "Entregar pedido", "roles": "hasAnyRole('ALMACEN','DIRECCION')"}, {"verbo": "PUT", "ruta": "/v1/pedidos/{id}/lineas", "operacion": "Reemplazar lineas", "roles": "hasAnyRole('VENTAS','DIRECCION')"}], "diagramas": [{"titulo": "01 maquina de estados pedido", "archivos": ["pedidos-ventas-ms/diagramas/01-maquina-de-estados-pedido.mmd", "pedidos-ventas-ms/diagramas/01-maquina-de-estados-pedido.png"], "imagen": "pedidos-ventas-ms/diagramas/01-maquina-de-estados-pedido.png", "codigo": "flowchart TD\n  A[\"<b>Cotización BORRADOR<\/b>\"]:::actor -->|\"enviar\"| B[\"<b>ENVIADA<\/b>\"]:::servicio\n  B --> C{\"<b>Aceptar dentro de vigencia?<\/b>\"}:::pendiente\n  C -- \"vencida\" --> V[\"<b>VENCIDA, responde 410<\/b><br/>No se reactiva; nueva cotización\"]:::alerta\n  C -- \"sí\" --> AC[\"<b>ACEPTADA<\/b>\"]:::servicio\n  AC --> P1[\"<b>Pedido BORRADOR<\/b><br/>Solo aquí se editan las líneas\"]:::actor\n  P1 -->|\"confirmar, con al menos una línea\"| P2[\"<b>CONFIRMADO<\/b>\"]:::servicio\n  P2 -->|\" ave ya existe?<\/b>\"}:::pendiente\n  B -- \"no\" --> C[\"<b>Procesa el alta<\/b>\"]:::servicio\n  C -- \"éxito\" --> D[\"<b>Guarda la respuesta 24 horas<\/b><br/>Tabla idempotencia\"]:::datos\n  C -- \"falla\" --> F[\"<b>Libera la clave<\/b><br/>El cliente puede reintentar\"]:::alerta\n  B -- \"sí, y la petición original ya terminó\" --> G{\"<b>Mismo cuerpo?<\/b>\"}:::pendiente\n  G -- \"sí\" --> H[\"<b>Misma respuesta original<\/b><br/>No se crea nada nuevo\"]:::servicio\n  G -- \"no\" --> E1[\"<b>422<\/b><br/>La clave ya se usó con otro cuerpo\"]:::alerta\n  B -- \"sí, y la petición sigue en proceso\" --> I{\"<b>Pasaron 2 minutos?<\/b>\"}:::pendiente\n  I -- \"no\" --> E2[\"<b>409 conflicto-de-estado<\/b>\"]:::alerta\n  I -- \"sí\" --> J[\"<b>Retoma la petición con la misma clave<\/b>\"]:::servicio\n  A -. \"sin cabecera\" .-> K[\"<b>Se procesa como siempre<\/b>\"]:::actor\n\n  classDef actor fill:#F1EFE8,stroke:#888780,color:#2C2C2A\n  classDef servicio fill:#E1F5EE,stroke:#1D9E75,color:#04342C\n  classDef datos fill:#E6F1FB,stroke:#378ADD,color:#042C53\n  classDef alerta fill:#FCEBEB,stroke:#E24B4A,color:#501313\n  classDef pendiente fill:#FAEEDA,stroke:#BA7517,color:#412402\n"}, {"titulo": "04 validacion de cliente", "archivos": ["pedidos-ventas-ms/diagramas/04-validacion-de-cliente.mmd", "pedidos-ventas-ms/diagramas/04-validacion-de-cliente.png"], "imagen": "pedidos-ventas-ms/diagramas/04-validacion-de-cliente.png", "codigo": "flowchart TD\n  A[\"<b>Crear cotización o pedido<\/b><br/>Con clienteId y el token del usuario\"]:::actor --> B[\"<b>GET /v1/clientes/{id}<\/b><br/>clientes-ms, mismo token\"]:::servicio\n  B --> C{\"<b>Respuesta<\/b>\"}:::pendiente\n  C -- \"404\" --> E1[\"<b>422<\/b><br/>El cliente no existe\"]:::alerta\n  C -- \"error o timeout\" --> E2[\"<b>503 servicio-no-disponible<\/b><br/>Reintentar; no crea nada\"]:::alerta\n  C -- \"estatus SUSPENDIDO o BAJA\" --> E3[\"<b>422<\/b><br/>El cliente no está activo\"]:::alerta\n  C -- \"ACTIVO\" -- da": {"type": "string"}, "tasaIva": {"$ref": "#/components/schemas/TasaIva"}, "estatus": {"$ref": "#/components/schemas/EstatusPedido"}, "lineas": {"type": "array", "items": {"$ref": "#/components/schemas/LineaRespuesta"}}, "totales": {"$ref": "#/components/schemas/Totales"}, "fechaConfirmacion": {"type": "string", "format": "date-time"}, "fechaEntrega": {"type": "string", "format": "date-time"}, "motivoCancelacion": {"$ref": "#/components/schemas/MotivoCancelacion"}}}, "EstatusPedido": {"type": "object", "properties": {}}, "MotivoCancelacion": {"type": "object", "properties": {}}, "CrearPedidoPeticion": {"type": "object", "properties": {"clienteId": {"type": "string", "format": "uuid"}, "canal": {"$ref": "#/components/schemas/Canal"}, "moneda": {"type": "string"}, "tasaIva": {"$ref": "#/components/schemas/TasaIva"}, "lineas": {"type": "array", "items": {"$ref": "#/components/schemas/LineaPeticion"}}}}, "LineasPeticion": {"type": "object", "properties": {"lineas": {"type": "array", "items": {"$ref": "#/components/schemas/LineaPeticion"}}}}, "CancelacionPeticion": {"type": "object", "properties": {"motivo": {"$ref": "#/components/schemas/MotivoCancelacion"}}}, "ResumenVentasRespuesta": {"type": "object", "properties": {"mes": {"type": "string"}, "pedidos": {"type": "integer", "format": "int64"}, "ventasPorMoneda": {"type": "object", "additionalProperties": true}}}}}}</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
<script>
(function () {
  const D = JSON.parse(document.getElementById('datos').textContent);
  const SPEC = JSON.parse(document.getElementById('spec').textContent);
  const $ = (s) => document.querySelector(s);

  function el(tag, attrs, hijos) {
    const n = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (hijos || []).forEach(function (h) {
      if (h === null || h === undefined || h === false) return;
      n.append(h.nodeType ? h : document.createTextNode(String(h)));
    });
    return n;
  }

  function chips(lista, vacio) {
    if (!lista || !lista.length) return [el('span', { class: 'aviso', text: vacio })];
    return lista.map(function (r) { return el('span', { class: 'chip', text: r }); });
  }

  if (window.mermaid) {
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'loose',
      theme: window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default'
    });
  }

  function pintarInfo() {
    const i = D.info;
    $('#titulo').textContent = i.nombre;
    $('#descr').textContent = i.descripcion || '';
    const pild = $('#pildoras');
    [
      'Puerto ' + (i.puerto || '—'),
      'Java ' + (i.java || '—'),
      'Spring Boot ' + (i.spring_boot || '—'),
      i.endpoints ? i.endpoints + ' endpoints' : 'Sin API REST'
    ].forEach(function (t) { pild.append(el('span', { class: 'pildora', text: t })); });
    const campos = [
      ['Servicio', i.nombre],
      ['Descripción', i.descripcion || '—'],
      ['Puerto de la aplicación', i.puerto || '—'],
      ['Java', i.java || '—'],
      ['Spring Boot', i.spring_boot || '—'],
      ['Endpoints REST', i.endpoints || 'Ninguno']
    ];
    const dl = el('dl', { class: 'datos' });
    campos.forEach(function (c) {
      dl.append(el('div', {}, [el('dt', { text: c[0] }), el('dd', { text: String(c[1]) })]));
    });
    dl.append(el('div', {}, [el('dt', { text: 'Roles a usar' }),
      el('dd', {}, chips(i.roles, 'Ninguno detectado'))]));
    $('[data-panel="info"]').append(dl);
  }

  function pintarReadme() {
    const panel = $('[data-panel="readme"]');
    if (!D.readme) {
      panel.append(el('p', { class: 'aviso', text: 'Este servicio no tiene README.md.' }));
      return;
    }
    const art = el('article', { class: 'md' });
    if (window.marked) {
      art.innerHTML = marked.parse(D.readme);
    } else {
      art.append(el('pre', { text: D.readme }));
    }
    art.querySelectorAll('pre > code.language-mermaid').forEach(function (code) {
      const m = el('div', { class: 'mermaid' });
      m.dataset.src = code.textContent;
      code.parentElement.replaceWith(m);
    });
    panel.append(art);
  }

  function pintarPermisos() {
    const panel = $('[data-panel="permisos"]');
    panel.append(el('h2', { class: 'subtitulo', text: 'Roles a usar' }));
    panel.append(el('p', {}, chips(D.info.roles, 'Ninguno detectado')));
    if (!D.permisos.length) {
      panel.append(el('p', { class: 'aviso', text: 'Este servicio no expone endpoints REST, así que no tiene reglas de acceso por endpoint.' }));
      return;
    }
    const cabeza = el('tr', {}, ['Método', 'Ruta', 'Operación', 'Regla de acceso'].map(function (t) {
      return el('th', { text: t });
    }));
    const cuerpo = el('tbody');
    D.permisos.forEach(function (p) {
      cuerpo.append(el('tr', {}, [
        el('td', {}, [el('span', { class: 'verbo', text: p.verbo })]),
        el('td', { text: p.ruta }),
        el('td', { text: p.operacion }),
        el('td', { text: p.roles || 'Solo autenticación (sin @PreAuthorize)' })
      ]));
    });
    const tabla = el('table', {}, [el('thead', {}, [cabeza]), cuerpo]);
    panel.append(el('div', { class: 'tabla-wrap' }, [tabla]));
  }

  function pintarDiagramas() {
    const panel = $('[data-panel="diagramas"]');
    if (!D.diagramas.length) {
      panel.append(el('p', { class: 'aviso', text: 'Este servicio no tiene carpeta docs/diagramas.' }));
      return;
    }
    const grid = el('div', { class: 'grid-diag' });
    D.diagramas.forEach(function (d) {
      const tarjeta = el('article', { class: 'diag' });
      tarjeta.append(el('h3', { text: d.titulo }));
      if (d.imagen) {
        const img = el('img', { src: d.imagen, alt: d.titulo, loading: 'lazy' });
        img.onerror = function () {
          img.replaceWith(el('p', { class: 'aviso', text: 'No se pudo mostrar la imagen. Usa el enlace de abajo para abrir el archivo.' }));
        };
        tarjeta.append(el('a', { href: d.imagen, target: '_blank', rel: 'noopener', class: 'abrir', title: 'Abrir archivo' }, [img]));
      } else if (d.codigo) {
        const m = el('div', { class: 'mermaid' });
        m.dataset.src = d.codigo;
        tarjeta.append(m);
      }
      const pie = el('div', { class: 'pie' });
      d.archivos.forEach(function (a, idx) {
        if (idx) pie.append(' · ');
        pie.append(el('a', { href: a, target: '_blank', rel: 'noopener', text: a.split('/').pop() }));
      });
      tarjeta.append(pie);
      grid.append(tarjeta);
    });
    panel.append(grid);
  }

  async function renderMermaidIn(raiz) {
    if (!raiz) return;
    for (const nodo of raiz.querySelectorAll('.mermaid')) {
      if (nodo.dataset.ok) continue;
      const src = nodo.dataset.src || '';
      if (!window.mermaid) {
        nodo.replaceChildren(el('pre', { text: src }));
        continue;
      }
      try {
        const salida = await mermaid.render('m' + Math.random().toString(36).slice(2), src);
        nodo.innerHTML = salida.svg;
        nodo.dataset.ok = '1';
      } catch (e) {
        nodo.replaceChildren(
          el('p', { class: 'aviso', text: 'No se pudo renderizar este diagrama. Se muestra el código fuente:' }),
          el('pre', { text: src }));
      }
    }
  }

  function pintarTecnologias() {
    const panel = $('[data-panel="tecnologias"]');
    panel.append(el('p', { class: 'aviso', text: 'Herramientas de calidad y pruebas que el pom.xml de este servicio aplica. Las marcadas como no aplicadas no están configuradas.' }));
    const grid = el('div', { class: 'grid-diag' });
    D.tecnologias.forEach(function (t) {
      const tarjeta = el('article', { class: 'diag' });
      tarjeta.append(el('h3', { text: t.nombre }));
      tarjeta.append(el('p', { class: 'aviso', text: t.resumen }));
      if (t.aplicado) {
        tarjeta.append(el('a', { href: t.archivo, class: 'chip', text: 'Ver detalle →' }));
      } else {
        tarjeta.append(el('span', { class: 'chip', text: 'No aplicado' }));
      }
      grid.append(tarjeta);
    });
    panel.append(grid);
  }

  let swaggerListo = false;
  function iniciarSwagger() {
    if (swaggerListo || !SPEC || !window.SwaggerUIBundle) return;
    swaggerListo = true;
    window.ui = SwaggerUIBundle({ spec: SPEC, dom_id: '#swagger-ui', deepLinking: false, persistAuthorization: true });
  }

  function pintarApi() {
    if (SPEC) return;
    $('[data-panel="api"]').replaceChildren(el('p', { class: 'aviso', text: 'Este servicio no expone endpoints REST, así que no tiene Swagger.' }));
    $('[data-tab="api"]').hidden = true;
  }

  const botones = Array.from(document.querySelectorAll('[role="tab"]'));
  const javadoc = $('[data-panel="javadoc"]');
  javadoc.append(el('h2', { text: 'Javadoc' }));
  javadoc.append(el('p', { text: 'Documentación técnica generada desde los comentarios /** */ del código. Se abre desde tu equipo después de generarla con build.sh.' }));
  javadoc.append(el('a', { class: 'jd-boton', href: '../../' + D.info.nombre + '/target/reports/apidocs/index.html', text: 'Abrir Javadoc de ' + D.info.nombre }));

  function activar(nombre, cambiarHash) {
    if (nombre === 'api' && !SPEC) nombre = 'info';
    botones.forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === nombre)); });
    document.querySelectorAll('[data-panel]').forEach(function (p) { p.hidden = p.dataset.panel !== nombre; });
    if (nombre === 'readme' || nombre === 'diagramas') renderMermaidIn(document.querySelector('[data-panel="' + nombre + '"]'));
    if (nombre === 'api') iniciarSwagger();
    if (cambiarHash) { try { history.replaceState(null, '', '#' + nombre); } catch (e) {} }
  }
  botones.forEach(function (b) { b.addEventListener('click', function () { activar(b.dataset.tab, true); }); });

  pintarInfo();
  pintarReadme();
  pintarPermisos();
  pintarDiagramas();
  pintarApi();
  pintarTecnologias();
  const inicial = location.hash.slice(1);
  activar(['info', 'readme', 'permisos', 'diagramas', 'tecnologias', 'api', 'javadoc'].indexOf(inicial) >= 0 ? inicial : 'info', false);
})();
</script>
</body>
</html>
