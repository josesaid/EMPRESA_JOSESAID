name: Escaneo de secretos

# Revisa cada push y cada PR para detectar claves o contraseñas que se hayan
# colado en el código o en el historial. Si encuentra alguna, el job falla.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
