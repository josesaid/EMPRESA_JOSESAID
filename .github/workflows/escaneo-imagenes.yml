name: Escaneo de imágenes de contenedor

# Construye la imagen de cada microservicio y la escanea con Trivy.
# Falla si encuentra vulnerabilidades HIGH o CRITICAL que ya tengan parche.
# El contexto de build sigue a docker-compose.yml de cada servicio: la carpeta del
# servicio, salvo nexus-ms y ui-ms, que usan la raíz del repo (context: ..).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  imagen:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio:
          - clientes-ms
          - compras-proveedores-ms
          - contabilidad-ms
          - discovery-ms
          - documentos-cumplimiento-ms
          - facturacion-pagos-ms
          - gateway-ms
          - inventario-operaciones-ms
          - nexus-ms
          - pedidos-ventas-ms
          - reportes-ejecutivos-ms
          - ui-ms
          - usuarios-accesos-ms
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: |
          if [ "${{ matrix.servicio }}" = "nexus-ms" ] || [ "${{ matrix.servicio }}" = "ui-ms" ]; then
            CONTEXTO=.
          else
            CONTEXTO=${{ matrix.servicio }}
          fi
          docker build -f ${{ matrix.servicio }}/Dockerfile -t ${{ matrix.servicio }}:ci "$CONTEXTO"
      - name: Escanear con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.servicio }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
