# Kafka UI: interfaz en el navegador para ver los topics, los mensajes y los consumidores de Kafka.
# Abre: http://localhost:8090
# Lee el listener interno de Kafka (kafka:29092) por la red empresa-net.

services:
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      # Nombre del clúster que se muestra en la interfaz
      KAFKA_CLUSTERS_0_NAME: empresa
      # Listener interno del broker de la raíz
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      # Puerto de tu Mac 8090 -> puerto 8080 dentro del contenedor
      - "8090:8080"
    networks:
      - empresa-net
    restart: unless-stopped

networks:
  empresa-net:
    external: true
    name: empresa-net
