# Configuración de gateway-ms. Valida la firma del JWT con la clave pública de usuarios-accesos-ms y la reenvía al servicio destino.
spring:
  application:
    name: gateway-ms
  security:
    oauth2:
      resourceserver:
        jwt:
          # Clave pública de usuarios-accesos-ms (JWKS)
          jwk-set-uri: ${JWT_JWKS_URI:http://usuarios-accesos-ms:8081/.well-known/jwks.json}
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              # Cada servicio registrado queda en /{nombre-del-servicio}/** sin configurar rutas
              enabled: true
              lower-case-service-id: true

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-ms:8761/eureka/}

management:
  tracing:
    sampling:
      # 100% de las solicitudes para ver todo en la práctica; bajar en producción
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          # Jaeger recibe OTLP en la red empresa-net
          endpoint: ${TRAZAS_OTLP_ENDPOINT:http://jaeger:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  structured:
    format:
      # Logs JSON en formato ECS
      file: ecs
